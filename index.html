<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#0f172a">
  <title>iPhone WebGPU LLM Chat V6</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1e293b;
      --border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #4ade80;
      --bad: #fb7185;
      --warn: #fbbf24;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;
    }

    .wrap {
      width: min(900px, 100%);
      margin: 0 auto;
      padding:
        calc(14px + env(safe-area-inset-top))
        14px
        calc(24px + env(safe-area-inset-bottom));
    }

    h1 {
      font-size: 22px;
      margin: 4px 0 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    select,
    button,
    textarea,
    input {
      font: inherit;
    }

    select,
    button {
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    select {
      flex: 1;
      min-width: 220px;
      background: var(--panel2);
      color: var(--text);
      padding: 0 10px;
    }

    button {
      background: var(--panel2);
      color: var(--text);
      padding: 8px 14px;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background: #075985;
      border-color: #0ea5e9;
    }

    button.good {
      background: #14532d;
      border-color: #22c55e;
    }

    button.warn {
      background: #713f12;
      border-color: #f59e0b;
    }

    button.danger {
      background: #7f1d1d;
      border-color: #ef4444;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #020617;
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.good {
      border-color: #166534;
    }

    .status.bad {
      border-color: #991b1b;
    }

    .status.warn {
      border-color: #92400e;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    progress {
      width: 100%;
      height: 10px;
      margin-top: 10px;
    }

    .chat {
      min-height: 280px;
      max-height: 48vh;
      overflow-y: auto;
      padding: 4px;
    }

    .msg {
      margin: 9px 0;
      padding: 10px 12px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }

    .user {
      background: #075985;
      margin-left: 12%;
    }

    .assistant {
      background: #1e293b;
      margin-right: 8%;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      background: #020617;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      outline: none;
    }

    textarea:focus,
    select:focus,
    button:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      font-size: 12px;
    }

    .metric b {
      display: block;
      font-size: 14px;
      margin-top: 2px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .user {
        margin-left: 4%;
      }

      .assistant {
        margin-right: 4%;
      }

      button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
<div class="wrap">

  <h1>📱 WebGPU LLM Chat V6</h1>
  <div class="subtitle">
    iPhone Safari / OPFS Stream / MediaPipe Tasks GenAI 0.10.29
  </div>

  <!-- MODEL -->
  <section class="card">
    <div class="row">
      <select id="modelSelect">
        <option value="qwen">
          Qwen 0.5B — q8 — 約 547 MB
        </option>
        <option value="gemma">
          Gemma 3 1B — int4 web — 約 700 MB
        </option>
      </select>
    </div>

    <div class="row" style="margin-top:8px">
      <button id="gpuBtn" class="primary">
        🔍 GPU 診斷
      </button>

      <button id="downloadBtn">
        ⬇️ 下載模型
      </button>

      <button id="initBtn" class="good">
        🚀 初始化
      </button>

      <button id="clearBtn" class="danger">
        🗑 清除模型
      </button>
    </div>

    <progress id="progress" value="0" max="100" hidden></progress>

    <div id="modelStatus" class="status">
      尚未開始。
    </div>
  </section>

  <!-- GPU -->
  <section class="card">
    <b>WebGPU 診斷</b>

    <div id="gpuStatus" class="status">
      尚未診斷。
    </div>

    <div id="gpuMetrics" class="grid" style="margin-top:8px"></div>
  </section>

  <!-- INITIALIZATION -->
  <section class="card">
    <b>初始化狀態</b>

    <div id="initStatus" class="status">
      尚未初始化。
    </div>

    <div class="small" style="margin-top:8px">
      V6 不使用 Blob、Object URL、Cache API 或 IndexedDB。
      初始化時直接從 OPFS File Stream 交給 MediaPipe。
    </div>
  </section>

  <!-- CHAT -->
  <section class="card">
    <b>聊天</b>

    <div id="chat" class="chat">
      <div class="small">
        模型初始化成功後即可開始聊天。
      </div>
    </div>

    <textarea
      id="prompt"
      placeholder="輸入訊息，例如：你好，請用繁體中文介紹自己。"
      style="margin-top:10px"
    ></textarea>

    <div class="row" style="margin-top:8px">
      <button id="sendBtn" class="primary" disabled>
        ➤ 發送
      </button>
    </div>
  </section>

  <!-- LOG -->
  <section class="card">
    <b>Debug Log</b>

    <div id="log" class="status"></div>

    <div class="small" style="margin-top:8px">
      如果初始化時 Safari 整頁重新載入，請重新進入此頁。
      V6 會偵測上一輪是否死在初始化階段。
    </div>
  </section>

</div>

<script>
(() => {
  "use strict";

  /*
   * ============================================================
   * V6
   *
   * 重要設計：
   *
   * 1. 不使用 Cache API
   * 2. 不使用 IndexedDB
   * 3. 不建立 Blob
   * 4. 不建立 Object URL
   * 5. 模型下載直接寫入 OPFS
   * 6. 初始化直接：
   *
   *      OPFS File
   *          ↓
   *      file.stream()
   *          ↓
   *      ReadableStreamDefaultReader
   *          ↓
   *      LlmInference.createFromModelBuffer()
   *
   * 7. MediaPipe 使用 stable 0.10.29
   * 8. MediaPipe 使用 dynamic import
   *    避免 CDN import 失敗時整個 UI 沒有反應
   */

  const MP_VERSION = "0.10.29";

  const WASM_URL =
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@" +
    MP_VERSION +
    "/wasm";

  const MP_MODULE_URL =
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@" +
    MP_VERSION +
    "/genai_bundle.mjs";

  const MODELS = {
    qwen: {
      name: "Qwen 0.5B",
      filename:
        "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",
      url:
        "https://huggingface.co/litert-community/" +
        "Qwen2.5-0.5B-Instruct/resolve/main/" +
        "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",
      approxMB: 547
    },

    gemma: {
      name: "Gemma 3 1B",
      filename:
        "gemma3-1b-it-int4-web.task",
      url:
        "https://huggingface.co/litert-community/" +
        "Gemma3-1B-IT/resolve/main/" +
        "gemma3-1b-it-int4-web.task",
      approxMB: 700
    }
  };

  let FilesetResolver = null;
  let LlmInference = null;
  let mpLoaded = false;

  let llm = null;
  let llmModelKey = null;
  let initializing = false;
  let downloading = false;

  const $ = id => document.getElementById(id);

  const modelSelect = $("modelSelect");
  const gpuBtn = $("gpuBtn");
  const downloadBtn = $("downloadBtn");
  const initBtn = $("initBtn");
  const clearBtn = $("clearBtn");
  const sendBtn = $("sendBtn");
  const prompt = $("prompt");

  const modelStatus = $("modelStatus");
  const gpuStatus = $("gpuStatus");
  const gpuMetrics = $("gpuMetrics");
  const initStatus = $("initStatus");
  const chat = $("chat");
  const logBox = $("log");
  const progress = $("progress");

  // ------------------------------------------------------------
  // Logging
  // ------------------------------------------------------------

  function now() {
    return new Date().toLocaleTimeString();
  }

  function log(message) {
    const line = `[${now()}] ${message}`;
    console.log(line);

    if (logBox.textContent.length > 12000) {
      logBox.textContent = "";
    }

    logBox.textContent +=
      (logBox.textContent ? "\n" : "") +
      line;
  }

  function setStatus(el, text, type = "") {
    el.textContent = text;
    el.className = "status" + (type ? " " + type : "");
  }

  function getModel() {
    return MODELS[modelSelect.value];
  }

  function opfsSupported() {
    return !!(
      navigator.storage &&
      navigator.storage.getDirectory
    );
  }

  // ------------------------------------------------------------
  // Crash/reload detection
  // ------------------------------------------------------------

  const CRASH_KEY = "llm-v6-initializing";

  function markInitStart(modelKey) {
    try {
      localStorage.setItem(
        CRASH_KEY,
        JSON.stringify({
          model: modelKey,
          time: Date.now()
        })
      );
    } catch (_) {}
  }

  function clearInitMark() {
    try {
      localStorage.removeItem(CRASH_KEY);
    } catch (_) {}
  }

  function checkPreviousCrash() {
    try {
      const raw = localStorage.getItem(CRASH_KEY);

      if (!raw) return;

      const data = JSON.parse(raw);

      const age = Date.now() - Number(data.time || 0);

      // 10 minutes內才視為上一輪初始化異常
      if (age < 10 * 60 * 1000) {
        setStatus(
          initStatus,
          "⚠️ 偵測到上一輪頁面可能在 LLM 初始化期間被 Safari 終止。\n" +
          "模型：" +
          (MODELS[data.model]?.name || data.model) +
          "\n" +
          "這不是正常的 JavaScript error；如果 Safari 整頁重載，通常代表 WebKit page process 在 WASM/GPU 初始化階段被終止。",
          "warn"
        );

        log(
          "偵測到上一輪初始化沒有正常結束：" +
          (data.model || "unknown")
        );
      }
    } catch (_) {}
  }

  // ------------------------------------------------------------
  // OPFS
  // ------------------------------------------------------------

  async function getOPFSRoot() {
    if (!opfsSupported()) {
      throw new Error(
        "此 Safari 不支援 OPFS。"
      );
    }

    return await navigator.storage.getDirectory();
  }

  async function getModelHandle(modelKey, create = false) {
    const model = MODELS[modelKey];
    const root = await getOPFSRoot();

    return await root.getFileHandle(
      model.filename,
      { create }
    );
  }

  async function modelExists(modelKey) {
    try {
      await getModelHandle(modelKey, false);
      return true;
    } catch (_) {
      return false;
    }
  }

  async function deleteModel(modelKey) {
    const model = MODELS[modelKey];
    const root = await getOPFSRoot();

    try {
      await root.removeEntry(model.filename);
      log("已刪除：" + model.name);
      return true;
    } catch (_) {
      return false;
    }
  }

  async function getModelFile(modelKey) {
    const handle = await getModelHandle(modelKey, false);
    return await handle.getFile();
  }

  // ------------------------------------------------------------
  // Download
  // ------------------------------------------------------------

  async function downloadModel() {
    if (downloading) return;

    const key = modelSelect.value;
    const model = MODELS[key];

    if (!opfsSupported()) {
      setStatus(
        modelStatus,
        "❌ 此裝置不支援 OPFS，無法使用 V6。",
        "bad"
      );
      return;
    }

    downloading = true;
    downloadBtn.disabled = true;
    initBtn.disabled = true;
    clearBtn.disabled = true;

    progress.hidden = false;
    progress.value = 0;

    setStatus(
      modelStatus,
      `開始下載 ${model.name}\n` +
      `檔案：約 ${model.approxMB} MB\n` +
      `直接串流寫入 OPFS，不建立 Blob。`
    );

    log("開始下載：" + model.name);
    log("URL：" + model.url);

    try {
      const response = await fetch(model.url, {
        method: "GET",
        cache: "no-store",
        redirect: "follow"
      });

      if (!response.ok) {
        throw new Error(
          "HTTP " +
          response.status +
          " " +
          response.statusText
        );
      }

      if (!response.body) {
        throw new Error(
          "瀏覽器沒有提供 ReadableStream。"
        );
      }

      const total = Number(
        response.headers.get("content-length") || 0
      );

      if (total > 0) {
        log(
          "Content-Length：" +
          Math.round(total / 1024 / 1024) +
          " MB"
        );
      } else {
        log("沒有 Content-Length，使用不定長度下載。");
      }

      const root = await getOPFSRoot();

      // 先刪掉舊檔案，避免舊檔案與新檔案同時佔空間。
      try {
        await root.removeEntry(model.filename);
      } catch (_) {}

      const handle = await root.getFileHandle(
        model.filename,
        { create: true }
      );

      const writable = await handle.createWritable();

      const reader = response.body.getReader();

      let received = 0;
      let lastShown = -1;

      try {
        while (true) {
          const result = await reader.read();

          if (result.done) break;

          const chunk = result.value;

          if (chunk) {
            await writable.write(chunk);
            received += chunk.byteLength;
          }

          let percent = 0;

          if (total > 0) {
            percent = Math.min(
              100,
              received / total * 100
            );
          }

          const rounded = Math.floor(percent);

          if (rounded !== lastShown) {
            lastShown = rounded;
            progress.value = rounded;

            const mb =
              received / 1024 / 1024;

            if (total > 0) {
              setStatus(
                modelStatus,
                `下載中：${model.name}\n` +
                `${mb.toFixed(1)} MB / ` +
                `${(total / 1024 / 1024).toFixed(1)} MB\n` +
                `${rounded}%`
              );
            } else {
              setStatus(
                modelStatus,
                `下載中：${model.name}\n` +
                `${mb.toFixed(1)} MB`
              );
            }
          }
        }

        await writable.close();

      } catch (e) {
        try {
          await writable.abort();
        } catch (_) {}

        throw e;
      }

      const file = await handle.getFile();

      log(
        "下載完成：" +
        (file.size / 1024 / 1024).toFixed(1) +
        " MB"
      );

      setStatus(
        modelStatus,
        `✓ ${model.name} 已下載完成\n` +
        `檔案大小：` +
        `${(file.size / 1024 / 1024).toFixed(1)} MB\n` +
        `儲存位置：OPFS`,
        "good"
      );

      progress.value = 100;

    } catch (e) {
      console.error(e);

      setStatus(
        modelStatus,
        "❌ 下載失敗\n" +
        (e?.message || String(e)),
        "bad"
      );

      log(
        "下載錯誤：" +
        (e?.stack || e?.message || String(e))
      );

    } finally {
      downloading = false;
      downloadBtn.disabled = false;
      initBtn.disabled = false;
      clearBtn.disabled = false;
    }
  }

  // ------------------------------------------------------------
  // MediaPipe dynamic import
  // ------------------------------------------------------------

  async function loadMediaPipe() {
    if (mpLoaded) {
      return;
    }

    log(
      "載入 MediaPipe Tasks GenAI " +
      MP_VERSION
    );

    setStatus(
      initStatus,
      "正在載入 MediaPipe Tasks GenAI..."
    );

    try {
      const mod = await import(MP_MODULE_URL);

      FilesetResolver = mod.FilesetResolver;
      LlmInference = mod.LlmInference;

      if (!FilesetResolver || !LlmInference) {
        throw new Error(
          "MediaPipe module 載入成功，但找不到 " +
          "FilesetResolver / LlmInference。"
        );
      }

      mpLoaded = true;

      log("MediaPipe module ✓");

    } catch (e) {
      log(
        "MediaPipe import 失敗：" +
        (e?.stack || e?.message || String(e))
      );

      throw e;
    }
  }

  // ------------------------------------------------------------
  // GPU diagnostics
  // ------------------------------------------------------------

  async function gpuDiagnostic() {
    gpuBtn.disabled = true;

    try {
      if (!navigator.gpu) {
        setStatus(
          gpuStatus,
          "❌ navigator.gpu 不存在。\n" +
          "此瀏覽器沒有可用 WebGPU。",
          "bad"
        );

        return;
      }

      setStatus(
        gpuStatus,
        "正在取得 WebGPU adapter..."
      );

      const adapter =
        await navigator.gpu.requestAdapter();

      if (!adapter) {
        setStatus(
          gpuStatus,
          "❌ 無法取得 WebGPU adapter。",
          "bad"
        );

        return;
      }

      const limits = adapter.limits;
      const features = [...adapter.features];

      // 不呼叫 requestAdapterInfo()
      // Safari / WebKit 某些版本對此 API 不完整。

      const storageLimit =
        Number(
          limits.maxStorageBufferBindingSize || 0
        );

      const maxBuffer =
        Number(
          limits.maxBufferSize || 0
        );

      const storageGB =
        storageLimit / 1024 / 1024 / 1024;

      const maxBufferGB =
        maxBuffer / 1024 / 1024 / 1024;

      const deviceMemory =
        navigator.deviceMemory || "未知";

      const hardwareConcurrency =
        navigator.hardwareConcurrency || "未知";

      gpuMetrics.innerHTML = `
        <div class="metric">
          WebGPU
          <b>✓ 可用</b>
        </div>

        <div class="metric">
          Adapter
          <b>✓ 已取得</b>
        </div>

        <div class="metric">
          maxStorageBufferBindingSize
          <b>${storageGB.toFixed(2)} GB</b>
        </div>

        <div class="metric">
          maxBufferSize
          <b>${maxBufferGB.toFixed(2)} GB</b>
        </div>

        <div class="metric">
          deviceMemory
          <b>${deviceMemory} GB</b>
        </div>

        <div class="metric">
          CPU threads
          <b>${hardwareConcurrency}</b>
        </div>
      `;

      const featureText =
        features.length
          ? features.join(", ")
          : "無額外 features";

      setStatus(
        gpuStatus,
        "✓ WebGPU 基本檢查通過\n\n" +
        "Adapter：已取得\n" +
        "maxStorageBufferBindingSize：" +
        storageGB.toFixed(2) +
        " GB\n" +
        "maxBufferSize：" +
        maxBufferGB.toFixed(2) +
        " GB\n" +
        "Features：" +
        featureText,
        "good"
      );

      log(
        "WebGPU 診斷完成：" +
        storageGB.toFixed(2) +
        " GB / " +
        maxBufferGB.toFixed(2) +
        " GB"
      );

    } catch (e) {
      console.error(e);

      setStatus(
        gpuStatus,
        "❌ WebGPU 診斷失敗\n" +
        (e?.message || String(e)),
        "bad"
      );

      log(
        "GPU diagnostic error：" +
        (e?.stack || e?.message || String(e))
      );

    } finally {
      gpuBtn.disabled = false;
    }
  }

  // ------------------------------------------------------------
  // Initialize model
  // ------------------------------------------------------------

  async function initializeModel() {
    if (initializing) return;

    const key = modelSelect.value;
    const model = MODELS[key];

    initializing = true;

    initBtn.disabled = true;
    downloadBtn.disabled = true;
    clearBtn.disabled = true;
    sendBtn.disabled = true;

    markInitStart(key);

    setStatus(
      initStatus,
      `準備初始化 ${model.name}...\n` +
      `V6：OPFS File → ReadableStream → MediaPipe`
    );

    log("================================");
    log("開始初始化：" + model.name);
    log("V6 stream initialization");
    log("================================");

    try {
      // --------------------------------------------------------
      // 1. Check model
      // --------------------------------------------------------

      const exists =
        await modelExists(key);

      if (!exists) {
        throw new Error(
          `${model.name} 尚未下載。\n` +
          `請先按「下載模型」。`
        );
      }

      const file =
        await getModelFile(key);

      log(
        "OPFS file：" +
        (file.size / 1024 / 1024).toFixed(1) +
        " MB"
      );

      // --------------------------------------------------------
      // 2. Load MediaPipe
      // --------------------------------------------------------

      await loadMediaPipe();

      // --------------------------------------------------------
      // 3. WASM fileset
      // --------------------------------------------------------

      setStatus(
        initStatus,
        `✓ MediaPipe 已載入\n` +
        `正在載入 GenAI WASM...\n` +
        `模型：${model.name}`
      );

      log("載入 GenAI WASM");

      const genai =
        await FilesetResolver.forGenAiTasks(
          WASM_URL
        );

      log("GenAI WASM fileset ✓");

      // --------------------------------------------------------
      // 4. Create stream
      // --------------------------------------------------------

      /*
       * 重要：
       *
       * 不做：
       *
       *   await file.arrayBuffer()
       *   new Blob(...)
       *   URL.createObjectURL(...)
       *
       * 直接取得 File stream。
       */

      const stream =
        file.stream();

      const reader =
        stream.getReader();

      log(
        "ReadableStreamDefaultReader ✓"
      );

      setStatus(
        initStatus,
        `正在初始化 ${model.name}\n\n` +
        `模型：${(file.size / 1024 / 1024).toFixed(1)} MB\n` +
        `輸入方式：ReadableStreamDefaultReader\n` +
        `Delegate：GPU\n\n` +
        `⚠️ 這個階段可能需要一些時間。\n` +
        `請不要切換 Safari 分頁。`
      );

      // --------------------------------------------------------
      // 5. Create LLM from stream
      // --------------------------------------------------------

      log(
        "呼叫 LlmInference.createFromModelBuffer()"
      );

      const started =
        performance.now();

      /*
       * MediaPipe Tasks 的 model-buffer API
       * 接受 Uint8Array 或 ReadableStreamDefaultReader。
       *
       * 這裡刻意使用 reader，
       * 避免把整個 500~700 MB 模型再複製到 JS heap。
       */

      llm =
        await LlmInference.createFromModelBuffer(
          genai,
          reader
        );

      const elapsed =
        (performance.now() - started) / 1000;

      llmModelKey = key;

      clearInitMark();

      setStatus(
        initStatus,
        `✓ ${model.name} 初始化成功\n\n` +
        `初始化時間：${elapsed.toFixed(1)} 秒\n` +
        `Delegate：GPU\n\n` +
        `現在可以開始聊天。`,
        "good"
      );

      setStatus(
        modelStatus,
        `✓ ${model.name} 已準備完成\n` +
        `OPFS：${(file.size / 1024 / 1024).toFixed(1)} MB`,
        "good"
      );

      sendBtn.disabled = false;

      log(
        "LLM 初始化成功：" +
        elapsed.toFixed(1) +
        " 秒"
      );

    } catch (e) {
      console.error(e);

      /*
       * 如果是正常 JS exception，
       * 這裡會顯示錯誤。
       *
       * 如果 Safari WebKit page process 被殺掉，
       * 則這裡不會執行；
       * 下一次進頁面會由 CRASH_KEY 告知。
       */

      setStatus(
        initStatus,
        "❌ 初始化失敗\n\n" +
        (e?.message || String(e)) +
        "\n\n" +
        "如果 Safari 整頁重載，而不是看到這段錯誤，" +
        "代表問題發生在 WASM/GPU 原生層。",
        "bad"
      );

      log(
        "初始化 exception：" +
        (e?.stack || e?.message || String(e))
      );

      try {
        if (typeof reader !== "undefined") {
          await reader.cancel();
        }
      } catch (_) {}

      clearInitMark();

    } finally {
      initializing = false;
      initBtn.disabled = false;
      downloadBtn.disabled = false;
      clearBtn.disabled = false;
    }
  }

  // ------------------------------------------------------------
  // Chat
  // ------------------------------------------------------------

  function addMessage(role, text) {
    const div =
      document.createElement("div");

    div.className =
      "msg " +
      (role === "user"
        ? "user"
        : "assistant");

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop =
      chat.scrollHeight;

    return div;
  }

  async function sendMessage() {
    if (!llm) {
      setStatus(
        initStatus,
        "請先初始化模型。",
        "warn"
      );
      return;
    }

    const text =
      prompt.value.trim();

    if (!text) return;

    prompt.value = "";

    addMessage("user", text);

    const answerDiv =
      addMessage(
        "assistant",
        "⏳ 生成中..."
      );

    sendBtn.disabled = true;

    try {
      log(
        "generateResponse()"
      );

      const response =
        await llm.generateResponse(text);

      answerDiv.textContent =
        response || "(模型沒有回覆)";

      log("生成完成");

    } catch (e) {
      console.error(e);

      answerDiv.textContent =
        "❌ 生成失敗：\n" +
        (e?.message || String(e));

      log(
        "生成錯誤：" +
        (e?.stack || e?.message || String(e))
      );

    } finally {
      sendBtn.disabled = false;
      prompt.focus();
    }
  }

  // ------------------------------------------------------------
  // Clear model
  // ------------------------------------------------------------

  async function clearCurrentModel() {
    if (initializing || downloading) {
      return;
    }

    const key =
      modelSelect.value;

    const model =
      MODELS[key];

    const confirmed =
      confirm(
        `確定刪除 ${model.name} 的本機模型？`
      );

    if (!confirmed) return;

    try {
      // 如果目前正在使用同一個模型，
      // 先丟掉 JS reference。
      if (llmModelKey === key) {
        llm = null;
        llmModelKey = null;
        sendBtn.disabled = true;
      }

      if (await deleteModel(key)) {
        setStatus(
          modelStatus,
          `✓ 已刪除 ${model.name} 的 OPFS 模型。`,
          "good"
        );

        log(
          "刪除模型：" +
          model.name
        );
      } else {
        setStatus(
          modelStatus,
          "找不到本機模型。"
        );
      }

    } catch (e) {
      setStatus(
        modelStatus,
        "❌ 刪除失敗\n" +
        (e?.message || String(e)),
        "bad"
      );
    }
  }

  // ------------------------------------------------------------
  // Model selection
  // ------------------------------------------------------------

  modelSelect.addEventListener(
    "change",
    async () => {
      const key =
        modelSelect.value;

      const model =
        MODELS[key];

      llm = null;
      llmModelKey = null;
      sendBtn.disabled = true;

      try {
        const exists =
          await modelExists(key);

        if (exists) {
          const file =
            await getModelFile(key);

          setStatus(
            modelStatus,
            `✓ ${model.name} 已存在於 OPFS\n` +
            `檔案大小：` +
            `${(file.size / 1024 / 1024).toFixed(1)} MB`,
            "good"
          );
        } else {
          setStatus(
            modelStatus,
            `${model.name} 尚未下載。\n` +
            `預估大小：約 ${model.approxMB} MB`
          );
        }

      } catch (e) {
        setStatus(
          modelStatus,
          "讀取 OPFS 失敗\n" +
          (e?.message || String(e)),
          "bad"
        );
      }
    }
  );

  // ------------------------------------------------------------
  // Buttons
  // ------------------------------------------------------------

  gpuBtn.addEventListener(
    "click",
    gpuDiagnostic
  );

  downloadBtn.addEventListener(
    "click",
    downloadModel
  );

  initBtn.addEventListener(
    "click",
    initializeModel
  );

  clearBtn.addEventListener(
    "click",
    clearCurrentModel
  );

  sendBtn.addEventListener(
    "click",
    sendMessage
  );

  prompt.addEventListener(
    "keydown",
    e => {
      if (
        e.key === "Enter" &&
        (e.ctrlKey || e.metaKey)
      ) {
        e.preventDefault();
        sendMessage();
      }
    }
  );

  // ------------------------------------------------------------
  // Initial page
  // ------------------------------------------------------------

  async function boot() {
    log("V6 啟動");
    log(
      "MediaPipe Tasks GenAI " +
      MP_VERSION
    );

    if (!opfsSupported()) {
      setStatus(
        modelStatus,
        "❌ 此瀏覽器沒有 OPFS。\n" +
        "V6 無法使用。",
        "bad"
      );

      return;
    }

    log("OPFS ✓");

    checkPreviousCrash();

    try {
      const key =
        modelSelect.value;

      if (await modelExists(key)) {
        const file =
          await getModelFile(key);

        setStatus(
          modelStatus,
          `✓ ${MODELS[key].name} 已存在\n` +
          `檔案大小：` +
          `${(file.size / 1024 / 1024).toFixed(1)} MB\n` +
          `可以按「初始化」。`,
          "good"
        );
      } else {
        setStatus(
          modelStatus,
          `目前選擇：${MODELS[key].name}\n` +
          `尚未下載。`
        );
      }

    } catch (e) {
      log(
        "Boot OPFS error：" +
        (e?.message || String(e))
      );
    }
  }

  boot();

})();
</script>

</body>
</html>
