<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemma 3 1B · LiteRT.js (WebGPU)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
      --user-msg: #1f242c;
      --ai-msg: #161b22;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .title-group h1 { font-size: 1rem; font-weight: 600; color: #fff; }
    .title-group p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #21262d;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.warn { color: var(--warn); border-color: var(--warn); }
    .badge.err { color: var(--err); border-color: var(--err); }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg { display: flex; flex-direction: column; max-width: 85%; }
    .msg.user { align-self: flex-end; }
    .msg.ai { align-self: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
    }
    .msg.user .bubble { background: var(--user-msg); border-color: #38444d; color: #fff; }
    .msg.ai .bubble { background: var(--ai-msg); }

    .control-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 10px auto;
      max-width: 480px;
      width: 100%;
    }

    .control-panel h2 { font-size: 0.95rem; margin-bottom: 8px; color: #fff; }
    .control-panel p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }

    select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #21262d;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    select { margin-bottom: 10px; cursor: pointer; }

    button#load-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button#load-btn:hover { background: var(--accent-hover); }
    button#load-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .progress-bar-bg {
      height: 6px;
      background: #21262d;
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    #status-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    .input-area {
      padding: 12px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      max-width: 800px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 44px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: #fff;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }
    textarea:disabled { opacity: 0.5; }

    button#send-btn {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
    }
    button#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>Gemma 3 1B AI 對話</h1>
      <p>LiteRT.js (MediaPipe WebGPU Engine)</p>
    </div>
    <div id="gpu-status" class="badge">檢查 WebGPU 中...</div>
  </header>

  <div id="chat-container">
    <div class="control-panel" id="setup-panel">
      <h2>載入 LiteRT AI 模型</h2>
      <p>選擇專為 Web 最佳化的 LiteRT 模型（`.task` 格式）。第一次下載後會直接於本機 WebGPU 執行。</p>
      
      <select id="model-select">
        <option value="https://huggingface.co/litert-community/gemma-3-1b-it-litert-lm/resolve/main/gemma3-1b-it-int4-web.task">
          Gemma 3 1B IT (INT4 Web · 約 668 MB)
        </option>
        <option value="https://huggingface.co/litert-community/gemma-2-2b-it-litert-lm/resolve/main/gemma2-2b-it-gpu-int4.task">
          Gemma 2 2B IT (INT4 GPU · 約 1.3 GB)
        </option>
      </select>

      <button type="button" id="load-btn">下載並初始化模型</button>

      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div id="status-text">點擊按鈕開始下載</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="user-input" placeholder="請先載入模型..." disabled></textarea>
      <button type="button" id="send-btn" disabled>➤</button>
    </div>
  </div>

  <!-- 引入 Google 官方 LiteRT / MediaPipe GenAI WebGPU 模組 -->
  <script type="module">
    import { FilesetResolver, LlmInference } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.27/+esm';

    const gpuStatus = document.getElementById("gpu-status");
    const setupPanel = document.getElementById("setup-panel");
    const modelSelect = document.getElementById("model-select");
    const loadBtn = document.getElementById("load-btn");
    const progressFill = document.getElementById("progress-fill");
    const statusText = document.getElementById("status-text");
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    let llmInference = null;
    let isBusy = false;

    // 檢查 WebGPU 支援
    if (!navigator.gpu) {
      gpuStatus.textContent = "無 WebGPU 支援";
      gpuStatus.className = "badge err";
      statusText.textContent = "您的瀏覽器不支援 WebGPU，請使用 Chrome / Edge 最新版。";
      loadBtn.disabled = true;
    } else {
      gpuStatus.textContent = "WebGPU 就緒";
      gpuStatus.className = "badge ok";
    }

    function addMessage(role, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    // 帶進度條的流暢 Fetch 函式
    async function fetchModelWithProgress(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`下載失敗 HTTP ${response.status}`);

      const contentLength = +response.headers.get("Content-Length");
      const reader = response.body.getReader();
      let receivedLength = 0;
      let chunks = [];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        receivedLength += value.length;

        if (contentLength) {
          const percent = Math.round((receivedLength / contentLength) * 100);
          progressFill.style.width = percent + "%";
          const mbRead = (receivedLength / 1024 / 1024).toFixed(1);
          const mbTotal = (contentLength / 1024 / 1024).toFixed(1);
          statusText.textContent = `下載中... ${percent}% (${mbRead} MB / ${mbTotal} MB)`;
        } else {
          statusText.textContent = `下載中... ${(receivedLength / 1024 / 1024).toFixed(1)} MB`;
        }
      }

      const blob = new Blob(chunks);
      return URL.createObjectURL(blob);
    }

    // 載入模型
    loadBtn.addEventListener("click", async () => {
      loadBtn.disabled = true;
      modelSelect.disabled = true;
      statusText.textContent = "準備下載模型...";

      try {
        const modelUrl = modelSelect.value;
        const blobUrl = await fetchModelWithProgress(modelUrl);

        statusText.textContent = "載入 WebGPU WebAssembly 推理引擎...";
        const genaiFileset = await FilesetResolver.forGenAiTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.27/wasm"
        );

        statusText.textContent = "初始化 LiteRT 模型至 VRAM...";
        llmInference = await LlmInference.createFromOptions(genaiFileset, {
          baseOptions: {
            modelAssetPath: blobUrl
          },
          maxTokens: 1024,
          temperature: 0.7,
          topK: 40
        });

        statusText.textContent = "就緒！";
        progressFill.style.width = "100%";
        setupPanel.style.display = "none";

        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.placeholder = "輸入問題...";
        userInput.focus();

        addMessage("ai", "Gemma 3 模型已載入成功！請用中文提問。");
      } catch (err) {
        console.error(err);
        statusText.textContent = `錯誤：${err.message || err}`;
        loadBtn.disabled = false;
        modelSelect.disabled = false;
      }
    });

    // 發送問題與串流回應
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || !llmInference || isBusy) return;

      isBusy = true;
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      addMessage("user", text);
      const aiBubble = addMessage("ai", "...");

      try {
        let fullOutput = "";
        
        // 呼叫 LiteRT 的串流生成
        await llmInference.generateResponse(text, (partialResult, done) => {
          fullOutput += partialResult;
          aiBubble.textContent = fullOutput || "...";
          chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        if (!fullOutput) aiBubble.textContent = "(無回應)";
      } catch (err) {
        console.error(err);
        aiBubble.textContent = `推理錯誤：${err.message || err}`;
      } finally {
        isBusy = false;
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
