<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Gemma 3 1B WebGPU Chat V12.1</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
  background: #f5f5f7;
  color: #111;
}

body {
  height: 100dvh;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* =========================
   Header
========================= */

.header {
  flex: 0 0 auto;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 11px 13px;

  background: rgba(255,255,255,.94);
  border-bottom: 1px solid #dddde2;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  z-index: 10;
}

.title {
  font-size: 17px;
  font-weight: 700;
}

.subtitle {
  margin-top: 3px;
  font-size: 11px;
  color: #777;
}

.headerActions {
  display: flex;
  gap: 7px;
}

.headerBtn {
  width: 38px;
  height: 38px;

  border: 1px solid #dddde2;
  border-radius: 12px;

  background: white;
  color: #111;

  font-size: 17px;
}

.headerBtn:disabled {
  opacity: .35;
}

/* =========================
   Status
========================= */

.status {
  flex: 0 0 auto;

  min-height: 30px;

  padding: 7px 13px;

  background: #fafafa;
  border-bottom: 1px solid #e7e7eb;

  color: #777;

  font-size: 11px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status.ready {
  color: #147a4b;
}

.status.error {
  color: #d92d20;
}

/* =========================
   Chat
========================= */

.chat {
  flex: 1 1 auto;
  min-height: 0;

  overflow-y: auto;
  -webkit-overflow-scrolling: touch;

  padding: 15px 11px 20px;
}

.chatInner {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

/* =========================
   Welcome
========================= */

.welcome {
  text-align: center;
  padding: 34px 16px;
}

.logo {
  width: 62px;
  height: 62px;

  margin: 0 auto 15px;

  border-radius: 19px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #111;
  color: white;

  font-size: 28px;
  font-weight: 800;
}

.welcome h1 {
  margin: 0;
  font-size: 24px;
}

.welcome p {
  max-width: 430px;
  margin: 10px auto 0;

  color: #777;

  font-size: 14px;
  line-height: 1.6;
}

.features {
  margin-top: 22px;

  display: flex;
  flex-direction: column;
  gap: 8px;

  text-align: left;
}

.feature {
  padding: 11px 13px;

  background: white;
  border: 1px solid #dddde2;
  border-radius: 12px;

  font-size: 13px;
}

/* =========================
   Messages
========================= */

.messageRow {
  display: flex;
  margin: 9px 0;
}

.messageRow.user {
  justify-content: flex-end;
}

.messageRow.assistant {
  justify-content: flex-start;
}

.message {
  max-width: 87%;

  padding: 11px 13px;

  border-radius: 17px;

  font-size: 15px;
  line-height: 1.6;

  white-space: pre-wrap;
  word-break: break-word;
}

.message.user {
  background: #111;
  color: white;
  border-bottom-right-radius: 5px;
}

.message.assistant {
  background: #ededf1;
  color: #111;
  border-bottom-left-radius: 5px;
}

.meta {
  margin-top: 5px;
  font-size: 10px;
  color: #888;
}

/* =========================
   Typing
========================= */

.typing {
  display: flex;
  gap: 4px;
  height: 18px;
  align-items: center;
}

.typing span {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #777;

  animation: blink 1.2s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .30s;
}

@keyframes blink {
  0%,80%,100% {
    opacity: .25;
    transform: translateY(0);
  }

  40% {
    opacity: 1;
    transform: translateY(-2px);
  }
}

/* =========================
   Input
========================= */

.inputArea {
  flex: 0 0 auto;

  padding:
    8px
    9px
    max(9px, env(safe-area-inset-bottom))
    9px;

  background: rgba(255,255,255,.96);

  border-top: 1px solid #dddde2;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.inputInner {
  max-width: 760px;
  margin: 0 auto;

  display: flex;
  align-items: flex-end;

  gap: 8px;
}

textarea {
  flex: 1;
  min-width: 0;

  min-height: 45px;
  max-height: 130px;

  resize: none;

  padding: 11px 13px;

  border: 1px solid #d9d9de;
  border-radius: 15px;

  background: #f8f8fa;
  color: #111;

  outline: none;

  font-family: inherit;
  font-size: 16px;
  line-height: 1.45;
}

textarea:focus {
  background: white;
  border-color: #aaa;
}

textarea:disabled {
  opacity: .5;
}

.send {
  flex: 0 0 auto;

  width: 46px;
  height: 46px;

  border: 0;
  border-radius: 15px;

  background: #111;
  color: white;

  font-size: 19px;
}

.send:disabled {
  opacity: .35;
}

/* =========================
   Stop
========================= */

.stop {
  position: fixed;

  left: 50%;
  bottom:
    calc(
      74px +
      env(safe-area-inset-bottom)
    );

  transform: translateX(-50%);

  z-index: 30;

  display: none;

  padding: 9px 15px;

  border: 1px solid #dddde2;
  border-radius: 20px;

  background: rgba(255,255,255,.95);

  box-shadow: 0 4px 18px rgba(0,0,0,.12);

  font-size: 12px;
}

.stop.show {
  display: block;
}

/* =========================
   Loading
========================= */

.loading {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(245,245,247,.95);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.loading.hidden {
  display: none;
}

.loadingCard {
  width: min(420px, 100%);

  padding: 23px;

  border-radius: 20px;

  background: white;

  border: 1px solid #dddde2;

  box-shadow:
    0 20px 60px rgba(0,0,0,.12);
}

.loadingLogo {
  width: 50px;
  height: 50px;

  margin-bottom: 15px;

  border-radius: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #111;
  color: white;

  font-weight: 800;
  font-size: 22px;
}

.loadingTitle {
  font-size: 18px;
  font-weight: 700;
}

.loadingMessage {
  margin-top: 7px;

  min-height: 42px;

  color: #777;

  font-size: 13px;
  line-height: 1.5;
}

.progress {
  margin-top: 15px;

  height: 7px;

  border-radius: 10px;

  background: #e8e8ed;

  overflow: hidden;
}

.progressBar {
  width: 0%;
  height: 100%;

  background: #111;

  border-radius: inherit;

  transition: width .15s ease;
}

.progressText {
  margin-top: 7px;

  text-align: right;

  color: #888;

  font-size: 11px;
}

/* =========================
   Debug
========================= */

.debug {
  display: none;

  position: fixed;

  left: 10px;
  right: 10px;
  bottom: 75px;

  max-height: 45vh;

  overflow: auto;

  z-index: 200;

  padding: 12px;

  border-radius: 13px;

  background: rgba(15,15,15,.95);
  color: white;

  font: 11px/1.5 monospace;

  white-space: pre-wrap;
}

.debug.show {
  display: block;
}
</style>
</head>

<body>

<div class="app">

  <!-- Header -->

  <header class="header">

    <div>
      <div class="title">
        Gemma 3 1B
      </div>

      <div class="subtitle">
        WebGPU · 本機運算
      </div>
    </div>

    <div class="headerActions">

      <button
        id="debugBtn"
        class="headerBtn"
        type="button"
      >
        ⚙
      </button>

      <button
        id="clearBtn"
        class="headerBtn"
        type="button"
        disabled
      >
        ↺
      </button>

    </div>

  </header>


  <!-- Status -->

  <div
    id="status"
    class="status"
  >
    正在準備 Gemma…
  </div>


  <!-- Chat -->

  <main
    id="chat"
    class="chat"
  >

    <div
      id="chatInner"
      class="chatInner"
    >

      <div
        id="welcome"
        class="welcome"
      >

        <div class="logo">
          G
        </div>

        <h1>
          Gemma 3 1B
        </h1>

        <p>
          在 Safari 中直接使用 WebGPU
          執行 Gemma。
        </p>

        <div class="features">

          <div class="feature">
            ⚡ 純 WebGPU
          </div>

          <div class="feature">
            🔒 本機推論
          </div>

          <div class="feature">
            💬 多輪對話
          </div>

          <div class="feature">
            📱 iPhone Safari
          </div>

        </div>

      </div>

    </div>

  </main>


  <!-- Input -->

  <section class="inputArea">

    <div class="inputInner">

      <textarea
        id="input"
        placeholder="輸入訊息…"
        rows="1"
        disabled
      ></textarea>

      <button
        id="send"
        class="send"
        type="button"
        disabled
      >
        ↑
      </button>

    </div>

  </section>

</div>


<!-- Stop -->

<button
  id="stop"
  class="stop"
  type="button"
>
  ■ 停止生成
</button>


<!-- Loading -->

<div
  id="loading"
  class="loading"
>

  <div class="loadingCard">

    <div class="loadingLogo">
      G
    </div>

    <div class="loadingTitle">
      Gemma 3 1B
    </div>

    <div
      id="loadingMessage"
      class="loadingMessage"
    >
      正在載入…
    </div>

    <div class="progress">

      <div
        id="progressBar"
        class="progressBar"
      ></div>

    </div>

    <div
      id="progressText"
      class="progressText"
    >
      0%
    </div>

  </div>

</div>


<!-- Debug -->

<pre
  id="debug"
  class="debug"
></pre>


<script type="module">

/*
=========================================================
 GEMMA WEBGPU V12.1
=========================================================

 重要：

 這一版刻意保持與「成功測試版」相同的初始化方式。

 不做：
   navigator.gpu.requestAdapter()
   adapter.requestDevice()
   device.destroy()

 不使用：
   MediaPipe
   LiteRT
   Tasks GenAI
   .task
   ONNX Runtime
   IndexedDB
   Cache API
   Blob

 直接：
   gemma-webgpu
       ↓
   createGemmaEngine()
=========================================================
*/


const MODEL = "1b";

const CONTEXT_LENGTH = 2048;

const MAX_TOKENS = 256;

const TEMPERATURE = 0.7;

const TOP_P = 0.9;

const REP_PENALTY = 1.2;


/*
=========================================================
 DOM
=========================================================
*/

const statusEl =
  document.getElementById("status");

const chatEl =
  document.getElementById("chat");

const chatInner =
  document.getElementById("chatInner");

const welcomeEl =
  document.getElementById("welcome");

const inputEl =
  document.getElementById("input");

const sendEl =
  document.getElementById("send");

const clearEl =
  document.getElementById("clearBtn");

const stopEl =
  document.getElementById("stop");

const loadingEl =
  document.getElementById("loading");

const loadingMessageEl =
  document.getElementById("loadingMessage");

const progressBarEl =
  document.getElementById("progressBar");

const progressTextEl =
  document.getElementById("progressText");

const debugEl =
  document.getElementById("debug");

const debugBtn =
  document.getElementById("debugBtn");


/*
=========================================================
 STATE
=========================================================
*/

let engine = null;

let generating = false;

let abortController = null;

let debugLines = [];


/*
=========================================================
 DEBUG
=========================================================
*/

function debug(message) {

  const now =
    new Date().toLocaleTimeString();

  debugLines.push(
    `[${now}] ${message}`
  );

  if (debugLines.length > 150) {
    debugLines.shift();
  }

  debugEl.textContent =
    debugLines.join("\n");
}


window.addEventListener(
  "error",
  event => {

    debug(
      "JS ERROR: " +
      (
        event.error?.stack ||
        event.message
      )
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  event => {

    debug(
      "PROMISE ERROR: " +
      (
        event.reason?.stack ||
        event.reason?.message ||
        String(event.reason)
      )
    );

  }
);


/*
=========================================================
 STATUS
=========================================================
*/

function setStatus(
  text,
  type = ""
) {

  statusEl.textContent =
    text;

  statusEl.className =
    "status " + type;
}


/*
=========================================================
 PROGRESS
=========================================================
*/

function onProgress(p) {

  if (!p) {
    return;
  }


  if (p.status) {

    loadingMessageEl.textContent =
      p.status;

    setStatus(
      p.status
    );

  }


  if (
    typeof p.loaded === "number" &&
    typeof p.total === "number" &&
    p.total > 0
  ) {

    const percent =
      Math.max(
        0,
        Math.min(
          100,
          p.loaded / p.total * 100
        )
      );


    progressBarEl.style.width =
      percent.toFixed(1) + "%";


    progressTextEl.textContent =
      percent.toFixed(1) + "%";


    loadingMessageEl.textContent =
      (p.status || "載入模型…") +
      "\n" +
      formatBytes(p.loaded) +
      " / " +
      formatBytes(p.total);

  }

}


/*
=========================================================
 FORMAT BYTES
=========================================================
*/

function formatBytes(value) {

  if (!Number.isFinite(value)) {
    return "?";
  }

  if (value < 1024) {
    return value + " B";
  }

  if (value < 1024 * 1024) {

    return (
      (value / 1024).toFixed(1) +
      " KB"
    );

  }

  if (value < 1024 * 1024 * 1024) {

    return (
      (value / 1024 / 1024).toFixed(1) +
      " MB"
    );

  }

  return (
    (value / 1024 / 1024 / 1024).toFixed(2) +
    " GB"
  );

}


/*
=========================================================
 LOAD GEMMA
=========================================================

 注意：

 這裡故意沒有：

   requestAdapter()
   requestDevice()

 也沒有額外做 GPU 測試。

 直接讓 gemma-webgpu 自己初始化。

=========================================================
*/

async function loadGemma() {

  const started =
    performance.now();

  try {

    setStatus(
      "正在載入 Gemma WebGPU…"
    );

    loadingMessageEl.textContent =
      "正在載入 Gemma WebGPU runtime…";


    /*
     * 不鎖版本。
     *
     * 使用目前 package。
     */
    const {
      createGemmaEngine
    } = await import(
      "https://esm.sh/gemma-webgpu"
    );


    debug(
      "gemma-webgpu module loaded."
    );


    loadingMessageEl.textContent =
      "正在初始化 Gemma 3 1B…";


    /*
     * 這是整個 V12.1 最重要的地方。
     *
     * 保持最小初始化。
     */
    engine =
      await createGemmaEngine({

        model: MODEL,

        contextLength:
          CONTEXT_LENGTH,

        onProgress

      });


    const seconds =
      (
        performance.now() -
        started
      ) / 1000;


    debug(
      "Gemma ready: " +
      seconds.toFixed(2) +
      " sec"
    );


    /*
     * 完成載入
     */
    loadingEl.classList.add(
      "hidden"
    );


    inputEl.disabled = false;

    sendEl.disabled = false;

    clearEl.disabled = false;


    setStatus(
      "Gemma 3 1B 已就緒 · WebGPU",
      "ready"
    );


    /*
     * 保留歡迎畫面。
     * 不額外呼叫 engine.generate。
     */
    inputEl.focus();


  } catch (error) {

    console.error(error);


    debug(
      "INIT ERROR:\n" +
      (
        error?.stack ||
        error?.message ||
        String(error)
      )
    );


    loadingEl.classList.add(
      "hidden"
    );


    setStatus(
      "Gemma 初始化失敗",
      "error"
    );


    addAssistantMessage(
      "❌ Gemma 初始化失敗\n\n" +
      (
        error?.message ||
        String(error)
      )
    );

  }

}


/*
=========================================================
 ADD USER MESSAGE
=========================================================
*/

function addUserMessage(text) {

  removeWelcome();


  const row =
    document.createElement("div");

  row.className =
    "messageRow user";


  const bubble =
    document.createElement("div");

  bubble.className =
    "message user";

  bubble.textContent =
    text;


  row.appendChild(bubble);

  chatInner.appendChild(row);


  scrollBottom();

}


/*
=========================================================
 ADD ASSISTANT
=========================================================
*/

function createAssistantMessage() {

  removeWelcome();


  const row =
    document.createElement("div");

  row.className =
    "messageRow assistant";


  const bubble =
    document.createElement("div");

  bubble.className =
    "message assistant";


  row.appendChild(bubble);

  chatInner.appendChild(row);


  scrollBottom();


  return {
    row,
    bubble
  };

}


/*
=========================================================
 WELCOME
=========================================================
*/

function removeWelcome() {

  const existing =
    document.getElementById(
      "welcome"
    );

  if (existing) {
    existing.remove();
  }

}


/*
=========================================================
 SCROLL
=========================================================
*/

function scrollBottom() {

  requestAnimationFrame(() => {

    chatEl.scrollTop =
      chatEl.scrollHeight;

  });

}


/*
=========================================================
 SEND
=========================================================
*/

async function sendMessage() {

  if (!engine) {
    return;
  }

  if (generating) {
    return;
  }


  const text =
    inputEl.value.trim();


  if (!text) {
    return;
  }


  inputEl.value = "";

  resizeInput();


  addUserMessage(text);


  /*
   * 官方 gemma-webgpu multi-turn API。
   */
  engine.addUserMessage(text);


  const message =
    createAssistantMessage();


  /*
   * Loading dots
   */
  message.bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;


  generating = true;


  sendEl.disabled = true;

  clearEl.disabled = true;

  inputEl.disabled = true;

  stopEl.classList.add("show");


  setStatus(
    "Gemma 正在生成…"
  );


  abortController =
    new AbortController();


  let result = "";

  let tokens = 0;

  const started =
    performance.now();


  try {

    /*
     * 官方 AsyncGenerator API。
     */
    for await (
      const token of
      engine.generate({

        temperature:
          TEMPERATURE,

        topP:
          TOP_P,

        repPenalty:
          REP_PENALTY,

        maxTokens:
          MAX_TOKENS,

        signal:
          abortController.signal

      })
    ) {

      if (tokens === 0) {

        message.bubble.textContent =
          "";

      }


      result += token;

      tokens++;


      message.bubble.textContent =
        result;


      if (
        tokens % 8 === 0
      ) {

        scrollBottom();

      }

    }


    scrollBottom();


    const seconds =
      (
        performance.now() -
        started
      ) / 1000;


    const speed =
      seconds > 0
        ? tokens / seconds
        : 0;


    const meta =
      document.createElement("div");

    meta.className =
      "meta";

    meta.textContent =
      tokens +
      " tokens · " +
      seconds.toFixed(2) +
      " 秒 · " +
      speed.toFixed(1) +
      " tok/s";


    message.row.appendChild(meta);


    setStatus(
      "完成 · " +
      speed.toFixed(1) +
      " tok/s",
      "ready"
    );


    debug(
      "Generation: " +
      tokens +
      " tokens / " +
      seconds.toFixed(2) +
      " sec"
    );


  } catch (error) {

    if (
      abortController &&
      abortController.signal.aborted
    ) {

      message.bubble.textContent =
        result ||
        "（已停止）";


      setStatus(
        "已停止生成"
      );

    } else {

      console.error(error);


      debug(
        "GENERATE ERROR:\n" +
        (
          error?.stack ||
          error?.message ||
          String(error)
        )
      );


      message.bubble.textContent =
        "❌ 生成失敗\n\n" +
        (
          error?.message ||
          String(error)
        );


      setStatus(
        "生成失敗",
        "error"
      );

    }

  } finally {

    generating = false;

    abortController = null;


    stopEl.classList.remove(
      "show"
    );


    sendEl.disabled = false;

    clearEl.disabled = false;

    inputEl.disabled = false;


    inputEl.focus();

  }

}


/*
=========================================================
 STOP
=========================================================
*/

function stopGeneration() {

  if (!generating) {
    return;
  }


  debug(
    "Stopping generation..."
  );


  if (abortController) {

    abortController.abort();

  }

}


/*
=========================================================
 RESET
=========================================================
*/

function resetChat() {

  if (!engine) {
    return;
  }

  if (generating) {
    return;
  }


  engine.resetConversation();


  chatInner.innerHTML = `
    <div
      id="welcome"
      class="welcome"
    >

      <div class="logo">
        G
      </div>

      <h1>
        Gemma 3 1B
      </h1>

      <p>
        新對話已開始。
      </p>

    </div>
  `;


  setStatus(
    "新對話 · Gemma 3 1B 已就緒",
    "ready"
  );


  inputEl.focus();


  debug(
    "Conversation reset."
  );

}


/*
=========================================================
 TEXTAREA
=========================================================
*/

function resizeInput() {

  inputEl.style.height =
    "auto";

  inputEl.style.height =
    Math.min(
      inputEl.scrollHeight,
      130
    ) + "px";

}


inputEl.addEventListener(
  "input",
  resizeInput
);


/*
=========================================================
 ENTER
=========================================================
*/

inputEl.addEventListener(
  "keydown",
  event => {

    /*
     * iPhone 不攔 Enter，
     * 保留換行行為。
     *
     * Desktop:
     * Enter = send
     * Shift+Enter = newline
     */

    if (
      window.innerWidth >= 700 &&
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/*
=========================================================
 BUTTONS
=========================================================
*/

sendEl.addEventListener(
  "click",
  sendMessage
);


stopEl.addEventListener(
  "click",
  stopGeneration
);


clearEl.addEventListener(
  "click",
  resetChat
);


debugBtn.addEventListener(
  "click",
  () => {

    debugEl.classList.toggle(
      "show"
    );

  }
);


/*
=========================================================
 PAGE VISIBILITY
=========================================================
*/

document.addEventListener(
  "visibilitychange",
  () => {

    debug(
      "visibility: " +
      document.visibilityState
    );

  }
);


/*
=========================================================
 START
=========================================================
*/

debug(
  "Gemma WebGPU V12.1 starting..."
);

debug(
  "UA: " +
  navigator.userAgent
);


/*
 * 直接初始化。
 *
 * 注意：
 * 不做任何 requestAdapter/device。
 */
loadGemma();

</script>
