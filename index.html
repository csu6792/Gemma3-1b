<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<meta name="theme-color" content="#111827">
<title>iPhone Lite LLM Chat - Qwen + Gemma</title>

<style>
  :root {
    --bg: #0b1020;
    --panel: #111827;
    --panel2: #182235;
    --border: #263247;
    --text: #eef2ff;
    --muted: #9ca3af;
    --accent: #60a5fa;
    --user: #2563eb;
    --assistant: #1f2937;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "SF Pro Text",
      "SF Pro Display",
      "Helvetica Neue",
      Arial,
      sans-serif;
  }

  body {
    overflow: hidden;
  }

  button,
  select,
  input,
  textarea {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    padding:
      calc(env(safe-area-inset-top) + 12px)
      14px
      12px;
    background: rgba(11, 16, 32, 0.96);
    border-bottom: 1px solid var(--border);
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .title {
    font-size: 17px;
    font-weight: 700;
  }

  .badge {
    padding: 4px 8px;
    border-radius: 999px;
    background: #172033;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }

  .controls {
    margin-top: 10px;
    display: grid;
    gap: 8px;
  }

  select,
  input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    padding: 10px 11px;
    outline: none;
  }

  select:focus,
  input:focus,
  textarea:focus {
    border-color: var(--accent);
  }

  .row {
    display: flex;
    gap: 8px;
  }

  .row > * {
    flex: 1;
    min-width: 0;
  }

  button {
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--accent);
    color: #07111f;
    font-weight: 700;
    cursor: pointer;
  }

  button.secondary {
    background: #243047;
    color: var(--text);
  }

  button.danger {
    background: var(--danger);
    color: white;
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .status {
    margin-top: 8px;
    min-height: 18px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
  }

  .status.success {
    color: var(--success);
  }

  .status.warning {
    color: var(--warning);
  }

  .status.error {
    color: #fca5a5;
  }

  .progress-wrap {
    margin-top: 7px;
    display: none;
  }

  .progress-wrap.show {
    display: block;
  }

  progress {
    width: 100%;
    height: 7px;
    border: 0;
    border-radius: 999px;
    overflow: hidden;
  }

  .hint {
    margin-top: 6px;
    color: #7f8aa0;
    font-size: 11px;
    line-height: 1.45;
  }

  .chat {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
  }

  .message {
    display: flex;
    margin-bottom: 12px;
  }

  .message.user {
    justify-content: flex-end;
  }

  .bubble {
    max-width: 88%;
    padding: 10px 12px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
    font-size: 15px;
  }

  .message.user .bubble {
    background: var(--user);
    color: white;
    border-bottom-right-radius: 5px;
  }

  .message.assistant .bubble {
    background: var(--assistant);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
  }

  .message.system {
    justify-content: center;
  }

  .message.system .bubble {
    max-width: 95%;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  .composer {
    flex: 0 0 auto;
    padding:
      10px
      12px
      calc(env(safe-area-inset-bottom) + 10px);
    background: rgba(11, 16, 32, 0.98);
    border-top: 1px solid var(--border);
  }

  textarea {
    width: 100%;
    min-height: 48px;
    max-height: 130px;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    color: var(--text);
    padding: 11px 12px;
    outline: none;
    line-height: 1.45;
  }

  .composer-row {
    margin-top: 8px;
    display: flex;
    gap: 8px;
  }

  .composer-row button:first-child {
    flex: 1;
  }

  .small {
    font-size: 11px;
    color: var(--muted);
  }

  .hidden {
    display: none !important;
  }

  .diagnostic {
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid #3a2d14;
    border-radius: 8px;
    background: #19150d;
    color: #d6b36a;
    font-size: 11px;
    line-height: 1.45;
  }

  @media (min-width: 700px) {
    header {
      padding-left: 24px;
      padding-right: 24px;
    }

    .controls {
      grid-template-columns: 1fr auto;
    }

    .chat {
      padding-left: 24px;
      padding-right: 24px;
    }

    .composer {
      padding-left: 24px;
      padding-right: 24px;
    }

    .bubble {
      max-width: 75%;
    }
  }
</style>
</head>

<body>

<div class="app">

  <header>
    <div class="title-row">
      <div class="title">📱 iPhone Lite LLM Chat</div>
      <div class="badge">Qwen + Gemma</div>
    </div>

    <div class="controls">

      <div>
        <select id="modelSelect">
          <option value="qwen">Qwen 2.5 0.5B</option>
          <option value="gemma">Gemma 3 1B</option>
        </select>

        <div
          id="gemmaTokenWrap"
          class="hidden"
          style="margin-top:8px;"
        >
          <input
            id="hfToken"
            type="password"
            autocomplete="off"
            placeholder="Gemma Hugging Face Token（需要時才填）"
          >
        </div>

        <div class="hint">
          iPhone 低記憶體模式：一次只初始化一個模型。
          下載完成後直接從 OPFS 串流給 MediaPipe，不建立 Blob URL。
        </div>
      </div>

      <div class="row">
        <button id="downloadBtn">下載模型</button>
        <button id="initBtn" class="secondary" disabled>
          初始化
        </button>
      </div>

    </div>

    <div id="status" class="status">
      尚未載入模型
    </div>

    <div id="progressWrap" class="progress-wrap">
      <progress id="progress" value="0" max="100"></progress>
      <div id="progressText" class="small"></div>
    </div>

    <div id="diagnostic" class="diagnostic hidden"></div>
  </header>

  <main id="chat" class="chat"></main>

  <div class="composer">
    <textarea
      id="prompt"
      placeholder="輸入訊息..."
      autocomplete="off"
      autocorrect="on"
      autocapitalize="sentences"
      spellcheck="true"
    ></textarea>

    <div class="composer-row">
      <button id="sendBtn" disabled>送出</button>
      <button id="stopBtn" class="danger" disabled>停止</button>
      <button id="clearBtn" class="secondary">清除</button>
    </div>
  </div>

</div>

<script type="module">

/* =========================================================
   MediaPipe Tasks GenAI
   ========================================================= */

import {
  FilesetResolver,
  LlmInference
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29/+esm";


/* =========================================================
   Model definitions
   ========================================================= */

const MODELS = {

  qwen: {
    id: "qwen",

    name: "Qwen 2.5 0.5B",

    fileName:
      "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

    url:
      "https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

    /*
     * Qwen repo currently provides the q8 task at about 547 MB.
     */
    expectedSizeMB: 547,

    /*
     * Keep generation conservative on iPhone.
     */
    maxTokens: 96,

    topK: 20,

    temperature: 0.7
  },

  gemma: {
    id: "gemma",

    name: "Gemma 3 1B",

    /*
     * Low-memory variant:
     * dynamic int4 / q4, multi-prefill, KV cache 2048.
     *
     * This is considerably smaller than the 700 MB
     * gemma3-1b-it-int4-web.task.
     */
    fileName:
      "Gemma3-1B-IT_multi-prefill-seq_q4_ekv2048.task",

    url:
      "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/Gemma3-1B-IT_multi-prefill-seq_q4_ekv2048.task",

    expectedSizeMB: 555,

    maxTokens: 96,

    topK: 20,

    temperature: 0.7
  }

};


/* =========================================================
   DOM
   ========================================================= */

const modelSelect =
  document.getElementById("modelSelect");

const gemmaTokenWrap =
  document.getElementById("gemmaTokenWrap");

const hfTokenInput =
  document.getElementById("hfToken");

const downloadBtn =
  document.getElementById("downloadBtn");

const initBtn =
  document.getElementById("initBtn");

const sendBtn =
  document.getElementById("sendBtn");

const stopBtn =
  document.getElementById("stopBtn");

const clearBtn =
  document.getElementById("clearBtn");

const promptInput =
  document.getElementById("prompt");

const chat =
  document.getElementById("chat");

const statusEl =
  document.getElementById("status");

const progressWrap =
  document.getElementById("progressWrap");

const progress =
  document.getElementById("progress");

const progressText =
  document.getElementById("progressText");

const diagnostic =
  document.getElementById("diagnostic");


/* =========================================================
   State
   ========================================================= */

let currentModelId = "qwen";

let llm = null;

let genaiFileset = null;

let isInitializing = false;

let isGenerating = false;

let abortController = null;

let currentReader = null;


/* =========================================================
   Session diagnostics
   ========================================================= */

const INIT_MARKER =
  "iphone_llm_last_init_attempt";

const INIT_MODEL_MARKER =
  "iphone_llm_last_init_model";

const INIT_TIME_MARKER =
  "iphone_llm_last_init_time";


function markInitStarted(modelId) {
  try {
    sessionStorage.setItem(
      INIT_MARKER,
      "1"
    );

    sessionStorage.setItem(
      INIT_MODEL_MARKER,
      modelId
    );

    sessionStorage.setItem(
      INIT_TIME_MARKER,
      new Date().toISOString()
    );
  } catch (_) {}
}


function clearInitMarker() {
  try {
    sessionStorage.removeItem(INIT_MARKER);
    sessionStorage.removeItem(INIT_MODEL_MARKER);
    sessionStorage.removeItem(INIT_TIME_MARKER);
  } catch (_) {}
}


function checkPreviousCrash() {

  try {

    const marker =
      sessionStorage.getItem(INIT_MARKER);

    if (!marker) return;

    const model =
      sessionStorage.getItem(INIT_MODEL_MARKER)
      || "unknown";

    const time =
      sessionStorage.getItem(INIT_TIME_MARKER)
      || "";

    diagnostic.classList.remove("hidden");

    diagnostic.textContent =
      "⚠️ 偵測到上一次頁面是在「模型初始化」階段中斷。" +
      " 如果 Safari 當時直接重載，通常代表 WebKit / WASM / GPU 初始化階段的記憶體或底層資源壓力。" +
      " 本版已改成直接串流模型，且不再建立 Blob URL。" +
      (time ? ` 上次模型：${model}。` : "");

  } catch (_) {}
}


/* =========================================================
   UI helpers
   ========================================================= */

function setStatus(
  text,
  type = ""
) {
  statusEl.textContent = text;
  statusEl.className =
    "status" +
    (type ? ` ${type}` : "");
}


function showProgress(show) {

  if (show) {
    progressWrap.classList.add("show");
  } else {
    progressWrap.classList.remove("show");
  }
}


function setProgress(
  value,
  text = ""
) {

  progress.value = value;

  progressText.textContent = text;
}


function addMessage(
  role,
  text
) {

  const row =
    document.createElement("div");

  row.className =
    `message ${role}`;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  row.appendChild(bubble);

  chat.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;

  return bubble;
}


function updateLastAssistant(
  bubble,
  text
) {

  bubble.textContent = text;

  chat.scrollTop =
    chat.scrollHeight;
}


function updateModelUI() {

  currentModelId =
    modelSelect.value;

  const model =
    MODELS[currentModelId];

  gemmaTokenWrap.classList.toggle(
    "hidden",
    currentModelId !== "gemma"
  );

  setStatus(
    `${model.name}：請先下載模型`
  );

  initBtn.disabled = true;

  sendBtn.disabled = true;
}


/* =========================================================
   OPFS
   ========================================================= */

async function getOPFSRoot() {

  if (!("storage" in navigator)) {
    throw new Error(
      "此瀏覽器沒有 navigator.storage。"
    );
  }

  if (!("getDirectory" in navigator.storage)) {
    throw new Error(
      "此瀏覽器不支援 OPFS。"
    );
  }

  return await navigator.storage.getDirectory();
}


async function getModelFileHandle(
  model
) {

  const root =
    await getOPFSRoot();

  return await root.getFileHandle(
    model.fileName,
    {
      create: false
    }
  );
}


async function modelExists(
  model
) {

  try {

    await getModelFileHandle(model);

    return true;

  } catch (_) {

    return false;

  }
}


async function getStoredModelSize(
  model
) {

  try {

    const handle =
      await getModelFileHandle(model);

    const file =
      await handle.getFile();

    return file.size;

  } catch (_) {

    return 0;

  }
}


/* =========================================================
   Download
   ========================================================= */

async function downloadModel(
  model
) {

  if (!navigator.onLine) {
    throw new Error(
      "目前離線，無法下載模型。"
    );
  }

  const root =
    await getOPFSRoot();

  const oldHandle =
    await root.getFileHandle(
      model.fileName,
      {
        create: true
      }
    );

  /*
   * createWritable() directly writes into OPFS.
   * We intentionally do NOT use chunks[].
   */
  const writable =
    await oldHandle.createWritable();

  let response;

  try {

    const headers = {};

    const token =
      hfTokenInput.value.trim();

    if (
      model.id === "gemma" &&
      token
    ) {
      headers.Authorization =
        `Bearer ${token}`;
    }

    response =
      await fetch(
        model.url,
        {
          method: "GET",
          headers,
          cache: "no-store",
          redirect: "follow"
        }
      );

    if (!response.ok) {

      if (
        response.status === 401 ||
        response.status === 403
      ) {
        throw new Error(
          "Gemma 下載被 Hugging Face 拒絕。請確認已接受 Gemma 授權，並確認 Token 有權限。"
        );
      }

      throw new Error(
        `下載失敗：HTTP ${response.status}`
      );
    }

    if (!response.body) {
      throw new Error(
        "瀏覽器沒有提供下載串流。"
      );
    }

    const total =
      Number(
        response.headers.get(
          "content-length"
        )
      ) || 0;

    const reader =
      response.body.getReader();

    let received = 0;

    while (true) {

      const {
        value,
        done
      } = await reader.read();

      if (done) break;

      if (value) {

        await writable.write(value);

        received += value.byteLength;

        if (total > 0) {

          const pct =
            Math.min(
              100,
              (received / total) * 100
            );

          setProgress(
            pct,
            `${formatBytes(received)} / ${formatBytes(total)}`
          );

        } else {

          setProgress(
            0,
            `已下載 ${formatBytes(received)}`
          );

        }

      }
    }

    await writable.close();

    return received;

  } catch (error) {

    try {
      await writable.abort();
    } catch (_) {}

    /*
     * If download failed, delete the incomplete file.
     */
    try {
      await root.removeEntry(
        model.fileName
      );
    } catch (_) {}

    throw error;
  }
}


/* =========================================================
   Initialize LiteRT
   ========================================================= */

async function ensureFileset() {

  if (genaiFileset) {
    return genaiFileset;
  }

  setStatus(
    "載入 MediaPipe WASM..."
  );

  genaiFileset =
    await FilesetResolver.forGenAiTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29/wasm"
    );

  return genaiFileset;
}


async function closeLLM() {

  if (!llm) return;

  const old =
    llm;

  llm = null;

  try {

    if (
      typeof old.close === "function"
    ) {
      old.close();
    }

  } catch (_) {}

  /*
   * Give Safari / WebKit one event-loop turn
   * to release references before another model
   * is initialized.
   */
  await new Promise(
    resolve =>
      setTimeout(resolve, 250)
  );
}


async function initializeModel() {

  if (isInitializing) {
    return;
  }

  const model =
    MODELS[currentModelId];

  isInitializing = true;

  downloadBtn.disabled = true;
  initBtn.disabled = true;
  sendBtn.disabled = true;

  /*
   * Very important:
   * do not keep a Blob, File object, ArrayBuffer,
   * or Object URL around while LiteRT initializes.
   */
  currentReader = null;

  await closeLLM();

  markInitStarted(
    currentModelId
  );

  try {

    const exists =
      await modelExists(model);

    if (!exists) {

      setStatus(
        "找不到已下載模型，請先下載。",
        "warning"
      );

      return;
    }

    const fileSize =
      await getStoredModelSize(model);

    setStatus(
      `正在準備 ${model.name}…`
    );

    /*
     * IMPORTANT:
     *
     * We do NOT do:
     *
     *   URL.createObjectURL(file)
     *
     * and we do NOT do:
     *
     *   await file.arrayBuffer()
     *
     * Instead, pass the OPFS stream reader directly
     * into MediaPipe's modelAssetBuffer.
     */
    const handle =
      await getModelFileHandle(model);

    const file =
      await handle.getFile();

    if (
      !fileSize ||
      file.size < 1024 * 1024
    ) {
      throw new Error(
        "模型檔案大小異常，可能是下載未完成。"
      );
    }

    setStatus(
      `${model.name}：開始低記憶體初始化…`
    );

    /*
     * Create the reader immediately before
     * createFromOptions().
     */
    const reader =
      file.stream().getReader();

    currentReader =
      reader;

    /*
     * The local "file" variable is intentionally
     * not stored globally.
     *
     * createFromOptions consumes the reader.
     */
    const fileset =
      await ensureFileset();

    /*
     * Let Safari finish the previous async work
     * before entering WASM/GPU initialization.
     */
    await new Promise(
      resolve =>
        setTimeout(resolve, 300)
    );

    /*
     * This follows the current official MediaPipe
     * Web sample pattern:
     *
     *   baseOptions.modelAssetBuffer = modelStream
     *
     * instead of using modelAssetPath/ObjectURL.
     */
    const instance =
      await LlmInference.createFromOptions(
        fileset,
        {
          baseOptions: {
            modelAssetBuffer: reader,
            delegate: "GPU"
          },

          maxTokens:
            model.maxTokens,

          topK:
            model.topK,

          temperature:
            model.temperature,

          randomSeed: 42
        }
      );

    /*
     * Initialization succeeded.
     */
    llm =
      instance;

    currentReader =
      null;

    clearInitMarker();

    setStatus(
      `${model.name} 初始化完成，可以開始聊天。`,
      "success"
    );

    addMessage(
      "system",
      `${model.name} 已啟用。`
    );

    sendBtn.disabled = false;

  } catch (error) {

    currentReader =
      null;

    /*
     * If this is a normal JS/WASM rejection,
     * show it.
     *
     * If Safari/WebKit kills the content process,
     * JS never reaches this catch block; the
     * sessionStorage marker lets us detect that
     * on the next page load.
     */
    console.error(
      "LLM initialization failed:",
      error
    );

    setStatus(
      `初始化失敗：${getErrorMessage(error)}`,
      "error"
    );

    addMessage(
      "system",
      "模型初始化失敗。若 Safari 直接重新整理頁面，請不要連續重試；這通常發生在 WebKit / WASM / GPU 初始化階段。"
    );

    /*
     * Keep the marker so that a reload can report
     * that the previous attempt died during init.
     */
  } finally {

    isInitializing =
      false;

    downloadBtn.disabled = false;

    /*
     * Only enable init again if LLM wasn't created.
     */
    initBtn.disabled =
      !!llm;

  }
}


/* =========================================================
   Generate
   ========================================================= */

async function generateResponse() {

  if (!llm) {

    addMessage(
      "system",
      "請先初始化模型。"
    );

    return;
  }

  if (isGenerating) {
    return;
  }

  const text =
    promptInput.value.trim();

  if (!text) {
    return;
  }

  promptInput.value = "";

  isGenerating = true;

  sendBtn.disabled = true;
  stopBtn.disabled = false;

  addMessage(
    "user",
    text
  );

  const assistantBubble =
    addMessage(
      "assistant",
      "..."
    );

  let output = "";

  abortController =
    new AbortController();

  try {

    /*
     * Gemma 3 simple turn template.
     * Qwen also accepts ordinary instruction text.
     */
    let query;

    if (currentModelId === "gemma") {

      query =
        "<start_of_turn>user\n" +
        text +
        "<end_of_turn>\n" +
        "<start_of_turn>model\n";

    } else {

      query =
        text;

    }

    /*
     * MediaPipe JS LlmInference API.
     */
    await new Promise(
      (resolve, reject) => {

        let completed = false;

        const finish = () => {

          if (completed) return;

          completed = true;

          resolve();

        };

        try {

          llm.generateResponse(
            query,
            (
              partial,
              done
            ) => {

              if (partial) {

                output +=
                  partial;

                updateLastAssistant(
                  assistantBubble,
                  output
                );

              }

              if (done) {
                finish();
              }

            }
          );

        } catch (error) {

          reject(error);

        }

      }
    );

  } catch (error) {

    console.error(
      "Generation failed:",
      error
    );

    const message =
      getErrorMessage(error);

    updateLastAssistant(
      assistantBubble,
      output
        ? `${output}\n\n[錯誤：${message}]`
        : `[錯誤：${message}]`
    );

  } finally {

    isGenerating = false;

    abortController =
      null;

    sendBtn.disabled =
      !llm;

    stopBtn.disabled =
      true;
  }
}


/* =========================================================
   Stop generation
   ========================================================= */

function stopGeneration() {

  if (!llm) {
    return;
  }

  try {

    if (
      typeof llm.cancelProcessing ===
      "function"
    ) {
      llm.cancelProcessing();
    }

  } catch (_) {}

  isGenerating = false;

  sendBtn.disabled =
    !llm;

  stopBtn.disabled =
    true;

  setStatus(
    "已停止生成。"
  );
}


/* =========================================================
   Delete model
   ========================================================= */

async function deleteCurrentModel() {

  const model =
    MODELS[currentModelId];

  await closeLLM();

  try {

    const root =
      await getOPFSRoot();

    await root.removeEntry(
      model.fileName
    );

    setStatus(
      `${model.name} 已刪除。`
    );

    initBtn.disabled = true;
    sendBtn.disabled = true;

  } catch (error) {

    setStatus(
      `刪除失敗：${getErrorMessage(error)}`,
      "error"
    );
  }
}


/* =========================================================
   Download button
   ========================================================= */

downloadBtn.addEventListener(
  "click",
  async () => {

    const model =
      MODELS[currentModelId];

    downloadBtn.disabled =
      true;

    initBtn.disabled =
      true;

    showProgress(true);

    setProgress(
      0,
      "準備下載…"
    );

    try {

      /*
       * If an old model is alive, close it first.
       */
      await closeLLM();

      setStatus(
        `正在下載 ${model.name}…`
      );

      const bytes =
        await downloadModel(model);

      setProgress(
        100,
        `${formatBytes(bytes)} 完成`
      );

      setStatus(
        `${model.name} 下載完成，可以初始化。`,
        "success"
      );

      initBtn.disabled =
        false;

      addMessage(
        "system",
        `${model.name} 已下載到此裝置。`
      );

    } catch (error) {

      console.error(
        "Download failed:",
        error
      );

      setStatus(
        `下載失敗：${getErrorMessage(error)}`,
        "error"
      );

    } finally {

      downloadBtn.disabled =
        false;

      setTimeout(
        () => showProgress(false),
        1000
      );

    }

  }
);


/* =========================================================
   Initialize button
   ========================================================= */

initBtn.addEventListener(
  "click",
  async () => {

    await initializeModel();

  }
);


/* =========================================================
   Model selector
   ========================================================= */

modelSelect.addEventListener(
  "change",
  async () => {

    /*
     * Switching models must release the previous
     * inference instance first.
     */
    await closeLLM();

    updateModelUI();

    const model =
      MODELS[currentModelId];

    const exists =
      await modelExists(model);

    if (exists) {

      const size =
        await getStoredModelSize(model);

      setStatus(
        `${model.name} 已下載 (${formatBytes(size)})，可以初始化。`,
        "success"
      );

      initBtn.disabled =
        false;

    } else {

      setStatus(
        `${model.name} 尚未下載。`
      );

    }

  }
);


/* =========================================================
   Send
   ========================================================= */

sendBtn.addEventListener(
  "click",
  generateResponse
);


/* =========================================================
   Stop
   ========================================================= */

stopBtn.addEventListener(
  "click",
  stopGeneration
);


/* =========================================================
   Clear
   ========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    chat.innerHTML = "";

  }
);


/* =========================================================
   Keyboard
   ========================================================= */

promptInput.addEventListener(
  "keydown",
  event => {

    /*
     * On iPhone this normally comes from
     * the return key, so don't force Enter to send.
     *
     * Desktop:
     * Cmd/Ctrl + Enter = send.
     */
    if (
      (event.metaKey ||
       event.ctrlKey) &&
      event.key === "Enter"
    ) {

      event.preventDefault();

      generateResponse();

    }

  }
);


/* =========================================================
   Page lifecycle
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "hidden"
    ) {

      /*
       * Do not automatically close the model here.
       *
       * Safari can temporarily background the page.
       * Automatically closing/reinitializing can itself
       * create additional memory churn.
       */
    }

  }
);


/* =========================================================
   Utility
   ========================================================= */

function formatBytes(bytes) {

  if (!Number.isFinite(bytes)) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  let value = bytes;
  let index = 0;

  while (
    value >= 1024 &&
    index < units.length - 1
  ) {

    value /= 1024;
    index++;

  }

  return `${value.toFixed(
    index === 0 ? 0 : 1
  )} ${units[index]}`;
}


function getErrorMessage(error) {

  if (!error) {
    return "未知錯誤";
  }

  if (
    typeof error === "string"
  ) {
    return error;
  }

  if (error.message) {
    return error.message;
  }

  try {
    return String(error);
  } catch (_) {
    return "未知錯誤";
  }
}


/* =========================================================
   Startup
   ========================================================= */

async function startup() {

  checkPreviousCrash();

  updateModelUI();

  addMessage(
    "system",
    "iPhone 低記憶體版已啟動。請先下載 Qwen 或 Gemma，再按「初始化」。"
  );

  /*
   * Check the default Qwen model.
   */
  try {

    const model =
      MODELS[currentModelId];

    const exists =
      await modelExists(model);

    if (exists) {

      const size =
        await getStoredModelSize(model);

      setStatus(
        `${model.name} 已存在 (${formatBytes(size)})，可以初始化。`,
        "success"
      );

      initBtn.disabled =
        false;

    }

  } catch (error) {

    console.warn(
      "OPFS startup check failed:",
      error
    );

  }

}


/* =========================================================
   Start
   ========================================================= */

startup();

</script>
