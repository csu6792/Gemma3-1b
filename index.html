<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#0b1020">

<title>iPhone Lite LLM V5.1</title>

<style>

:root {
  --bg: #0b1020;
  --panel: #111827;
  --border: #29354a;
  --text: #eef2ff;
  --muted: #9ca3af;
  --blue: #60a5fa;
  --green: #22c55e;
  --yellow: #f59e0b;
  --red: #ef4444;
  --user: #2563eb;
  --assistant: #1f2937;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body {
  overflow: hidden;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 10px 12px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.primary {
  background: var(--blue);
  color: #07111f;
}

.secondary {
  background: #263247;
  color: var(--text);
}

.danger {
  background: var(--red);
  color: white;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  outline: none;
}

input,
select {
  padding: 10px;
}

textarea {
  padding: 11px;
  min-height: 48px;
  max-height: 140px;
  resize: none;
  line-height: 1.45;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--blue);
}

.app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  flex: 0 0 auto;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    14px
    12px;

  border-bottom: 1px solid var(--border);
  background: rgba(11,16,32,.97);
}

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 17px;
  font-weight: 800;
}

.badge {
  font-size: 10px;
  color: var(--muted);
  background: #172033;
  padding: 4px 8px;
  border-radius: 999px;
}

.controls {
  margin-top: 10px;
  display: grid;
  gap: 8px;
}

.row {
  display: flex;
  gap: 8px;
}

.row > * {
  flex: 1;
}

.status {
  margin-top: 9px;
  min-height: 18px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.status.success {
  color: var(--green);
}

.status.warning {
  color: var(--yellow);
}

.status.error {
  color: #fca5a5;
}

.progress-wrap {
  display: none;
  margin-top: 8px;
}

.progress-wrap.show {
  display: block;
}

progress {
  width: 100%;
  height: 7px;
}

.progress-text {
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
}

.diagnostic {
  margin-top: 9px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #0e1525;
  font-size: 11px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.diagnostic.good {
  border-color: #1c5934;
}

.diagnostic.warn {
  border-color: #654b15;
}

.diagnostic.bad {
  border-color: #693030;
}

.hidden {
  display: none !important;
}

.chat {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px;
}

.message {
  display: flex;
  margin-bottom: 12px;
}

.message.user {
  justify-content: flex-end;
}

.message.system {
  justify-content: center;
}

.bubble {
  max-width: 88%;
  padding: 10px 12px;
  border-radius: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.55;
  font-size: 15px;
}

.message.user .bubble {
  background: var(--user);
  color: white;
  border-bottom-right-radius: 5px;
}

.message.assistant .bubble {
  background: var(--assistant);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
}

.message.system .bubble {
  max-width: 95%;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.composer {
  flex: 0 0 auto;

  padding:
    10px
    12px
    calc(env(safe-area-inset-bottom) + 10px);

  background: rgba(11,16,32,.98);
  border-top: 1px solid var(--border);
}

.composer-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.composer-row button:first-child {
  flex: 1;
}

.small {
  font-size: 11px;
  color: var(--muted);
}

</style>
</head>

<body>

<div class="app">

<header>

  <div class="title-row">

    <div class="title">
      📱 iPhone Lite LLM V5.1
    </div>

    <div class="badge">
      Qwen + Gemma
    </div>

  </div>


  <div class="controls">

    <select id="modelSelect">

      <option value="qwen">
        Qwen 2.5 0.5B
      </option>

      <option value="gemma">
        Gemma 3 1B
      </option>

    </select>


    <input
      id="hfToken"
      class="hidden"
      type="password"
      autocomplete="off"
      placeholder="Gemma Hugging Face Token（需要時填）"
    >


    <div class="row">

      <button
        id="downloadBtn"
        class="primary"
      >
        下載模型
      </button>

      <button
        id="diagnoseBtn"
        class="secondary"
      >
        GPU 診斷
      </button>

      <button
        id="initBtn"
        class="secondary"
        disabled
      >
        初始化
      </button>

    </div>

  </div>


  <div
    id="status"
    class="status"
  >
    正在啟動...
  </div>


  <div
    id="progressWrap"
    class="progress-wrap"
  >

    <progress
      id="progress"
      value="0"
      max="100"
    ></progress>

    <div
      id="progressText"
      class="progress-text"
    ></div>

  </div>


  <div
    id="diagnostic"
    class="diagnostic hidden"
  ></div>

</header>


<main
  id="chat"
  class="chat"
></main>


<div class="composer">

  <textarea
    id="prompt"
    placeholder="輸入訊息..."
    autocomplete="off"
    autocorrect="on"
    autocapitalize="sentences"
    spellcheck="true"
  ></textarea>


  <div class="composer-row">

    <button
      id="sendBtn"
      class="primary"
      disabled
    >
      送出
    </button>

    <button
      id="stopBtn"
      class="danger"
      disabled
    >
      停止
    </button>

    <button
      id="clearBtn"
      class="secondary"
    >
      清除
    </button>

  </div>

</div>

</div>


<script type="module">

/*
============================================================
 V5.1
 IMPORTANT:
 @mediapipe/tasks-genai stable = 0.10.29

 0.10.35 is NOT a published stable tasks-genai version.
============================================================
*/

import {
  FilesetResolver,
  LlmInference
} from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29/+esm";


/* =========================================================
   MODELS
   ========================================================= */

const MODELS = {

  qwen: {

    id: "qwen",

    name: "Qwen 2.5 0.5B",

    fileName:
      "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

    url:
      "https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

    maxTokens: 64,

    topK: 20,

    temperature: 0.7

  },


  gemma: {

    id: "gemma",

    name: "Gemma 3 1B",

    fileName:
      "Gemma3-1B-IT_multi-prefill-seq_q4_ekv2048.task",

    url:
      "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/Gemma3-1B-IT_multi-prefill-seq_q4_ekv2048.task",

    maxTokens: 64,

    topK: 20,

    temperature: 0.7

  }

};


/* =========================================================
   DOM
   ========================================================= */

const modelSelect =
  document.getElementById(
    "modelSelect"
  );

const hfToken =
  document.getElementById(
    "hfToken"
  );

const downloadBtn =
  document.getElementById(
    "downloadBtn"
  );

const diagnoseBtn =
  document.getElementById(
    "diagnoseBtn"
  );

const initBtn =
  document.getElementById(
    "initBtn"
  );

const sendBtn =
  document.getElementById(
    "sendBtn"
  );

const stopBtn =
  document.getElementById(
    "stopBtn"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );

const promptInput =
  document.getElementById(
    "prompt"
  );

const chat =
  document.getElementById(
    "chat"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const progressWrap =
  document.getElementById(
    "progressWrap"
  );

const progress =
  document.getElementById(
    "progress"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const diagnostic =
  document.getElementById(
    "diagnostic"
  );


/* =========================================================
   STATE
   ========================================================= */

let currentModelId =
  "qwen";

let llm =
  null;

let fileset =
  null;

let initializing =
  false;

let generating =
  false;


/* =========================================================
   ERROR HANDLER
   ========================================================= */

window.addEventListener(
  "error",
  event => {

    console.error(
      "Global error:",
      event.error || event.message
    );

    setStatus(
      "JavaScript 錯誤，請看診斷區。",
      "error"
    );

    showDiagnostic(
      "❌ JavaScript Error\n\n" +
      (
        event.error?.stack ||
        event.message ||
        "Unknown error"
      ),
      "bad"
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled rejection:",
      event.reason
    );

    setStatus(
      "JavaScript Promise 錯誤。",
      "error"
    );

    showDiagnostic(
      "❌ Unhandled Promise Rejection\n\n" +
      String(event.reason),
      "bad"
    );

  }
);


/* =========================================================
   UI
   ========================================================= */

function setStatus(
  text,
  type = ""
) {

  statusEl.textContent =
    text;

  statusEl.className =
    "status" +
    (
      type
        ? ` ${type}`
        : ""
    );

}


function showDiagnostic(
  text,
  type = ""
) {

  diagnostic.classList.remove(
    "hidden"
  );

  diagnostic.className =
    "diagnostic" +
    (
      type
        ? ` ${type}`
        : ""
    );

  diagnostic.textContent =
    text;

}


function addMessage(
  role,
  text
) {

  const row =
    document.createElement(
      "div"
    );

  row.className =
    `message ${role}`;

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  row.appendChild(
    bubble
  );

  chat.appendChild(
    row
  );

  chat.scrollTop =
    chat.scrollHeight;

  return bubble;

}


function formatBytes(
  bytes
) {

  if (
    !Number.isFinite(bytes)
  ) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  let value =
    bytes;

  let index =
    0;

  while (
    value >= 1024 &&
    index <
      units.length - 1
  ) {

    value /= 1024;

    index++;

  }

  return (
    value.toFixed(
      index === 0
        ? 0
        : 1
    )
    +
    " "
    +
    units[index]
  );

}


/* =========================================================
   OPFS
   ========================================================= */

async function getRoot() {

  if (
    !navigator.storage ||
    !navigator.storage.getDirectory
  ) {

    throw new Error(
      "此瀏覽器不支援 OPFS。"
    );

  }

  return (
    await navigator.storage.getDirectory()
  );

}


async function getHandle(
  model
) {

  const root =
    await getRoot();

  return (
    await root.getFileHandle(
      model.fileName,
      {
        create: false
      }
    )
  );

}


async function modelExists(
  model
) {

  try {

    await getHandle(model);

    return true;

  } catch (_) {

    return false;

  }

}


async function modelSize(
  model
) {

  try {

    const handle =
      await getHandle(model);

    const file =
      await handle.getFile();

    return file.size;

  } catch (_) {

    return 0;

  }

}


/* =========================================================
   DOWNLOAD
   ========================================================= */

async function downloadModel(
  model
) {

  const root =
    await getRoot();


  const handle =
    await root.getFileHandle(
      model.fileName,
      {
        create: true
      }
    );


  const writable =
    await handle.createWritable();


  try {

    const headers = {};

    const token =
      hfToken.value.trim();


    if (
      model.id === "gemma" &&
      token
    ) {

      headers.Authorization =
        `Bearer ${token}`;

    }


    setStatus(
      `連線到 Hugging Face...`
    );


    const response =
      await fetch(
        model.url,
        {
          method: "GET",
          headers,
          cache: "no-store",
          redirect: "follow"
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    if (!response.body) {

      throw new Error(
        "response.body 不存在。Safari 沒有提供下載串流。"
      );

    }


    const total =
      Number(
        response.headers.get(
          "content-length"
        )
      ) || 0;


    const reader =
      response.body.getReader();


    let received =
      0;


    while (true) {

      const {
        value,
        done
      } =
        await reader.read();


      if (done) {
        break;
      }


      if (!value) {
        continue;
      }


      await writable.write(
        value
      );


      received +=
        value.byteLength;


      if (total > 0) {

        const pct =
          (
            received /
            total
          ) * 100;


        progress.value =
          Math.min(
            100,
            pct
          );


        progressText.textContent =
          `${formatBytes(received)} / ${formatBytes(total)}`;


      } else {

        progressText.textContent =
          `已下載 ${formatBytes(received)}`;

      }

    }


    await writable.close();


    return received;


  } catch (error) {

    try {
      await writable.abort();
    } catch (_) {}


    try {
      await root.removeEntry(
        model.fileName
      );
    } catch (_) {}


    throw error;

  }

}


/* =========================================================
   DOWNLOAD BUTTON
   ========================================================= */

downloadBtn.addEventListener(
  "click",
  async () => {

    const model =
      MODELS[currentModelId];


    downloadBtn.disabled =
      true;

    diagnoseBtn.disabled =
      true;

    initBtn.disabled =
      true;


    progressWrap.classList.add(
      "show"
    );

    progress.value =
      0;

    progressText.textContent =
      "準備下載...";


    try {

      setStatus(
        `正在下載 ${model.name}...`
      );


      const bytes =
        await downloadModel(
          model
        );


      progress.value =
        100;


      progressText.textContent =
        `${formatBytes(bytes)} 完成`;


      setStatus(
        `${model.name} 下載完成。`,
        "success"
      );


      addMessage(
        "system",
        `✓ ${model.name} 下載完成。\n` +
        `檔案大小：${formatBytes(bytes)}`
      );


      initBtn.disabled =
        false;


    } catch (error) {

      console.error(
        "Download failed:",
        error
      );


      setStatus(
        `下載失敗：${error?.message || error}`,
        "error"
      );


      showDiagnostic(
        "❌ Download Error\n\n" +
        (
          error?.stack ||
          error?.message ||
          String(error)
        ),
        "bad"
      );


    } finally {

      downloadBtn.disabled =
        false;

      diagnoseBtn.disabled =
        false;


      setTimeout(
        () => {

          progressWrap.classList.remove(
            "show"
          );

        },
        1200
      );

    }

  }
);


/* =========================================================
   GPU DIAGNOSTIC
   ========================================================= */

diagnoseBtn.addEventListener(
  "click",
  async () => {

    diagnoseBtn.disabled =
      true;


    try {

      showDiagnostic(
        "正在檢查 WebGPU...",
        ""
      );


      setStatus(
        "正在檢查 WebGPU..."
      );


      if (
        !navigator.gpu
      ) {

        showDiagnostic(
          "❌ WebGPU 不存在\n\n" +
          "navigator.gpu = undefined\n\n" +
          "MediaPipe LLM 的 GPU backend 無法使用。",
          "bad"
        );


        setStatus(
          "此 Safari 沒有可用 WebGPU。",
          "error"
        );


        initBtn.disabled =
          true;


        return;

      }


      const adapter =
        await navigator.gpu.requestAdapter({
          powerPreference:
            "low-power"
        });


      if (!adapter) {

        showDiagnostic(
          "❌ requestAdapter() 回傳 null\n\n" +
          "Safari 找不到 WebGPU Adapter。",
          "bad"
        );


        setStatus(
          "找不到 WebGPU Adapter。",
          "error"
        );


        initBtn.disabled =
          true;


        return;

      }


      const limits =
        adapter.limits;


      const maxStorage =
        Number(
          limits.maxStorageBufferBindingSize
        ) || 0;


      const maxBuffer =
        Number(
          limits.maxBufferSize
        ) || 0;


      const features =
        Array.from(
          adapter.features || []
        );


      let adapterInfo =
        "無法取得 adapterInfo";


      /*
       * requestAdapterInfo is not assumed to exist.
       *
       * Some browsers removed/changed this API.
       */
      try {

        if (
          typeof adapter.requestAdapterInfo ===
          "function"
        ) {

          const info =
            await adapter.requestAdapterInfo();


          adapterInfo =
            [
              info.vendor,
              info.architecture,
              info.device,
              info.description
            ]
            .filter(Boolean)
            .join(" / ");

        }

      } catch (_) {}


      const minSafe =
        512 *
        1024 *
        1024;


      const storageOK =
        maxStorage >=
        minSafe;


      let text =
        "📱 WebGPU 診斷\n\n";


      text +=
        "WebGPU：✓\n";


      text +=
        `Adapter：${adapterInfo || "未知"}\n`;


      text +=
        `maxStorageBufferBindingSize：${formatBytes(maxStorage)}\n`;


      text +=
        `maxBufferSize：${formatBytes(maxBuffer)}\n`;


      text +=
        `Features：${
          features.length
            ? features.join(", ")
            : "無"
        }\n\n`;


      if (storageOK) {

        text +=
          "結果：✓ 通過基本安全檢查\n\n";


        text +=
          "現在可以按「初始化」。";


        showDiagnostic(
          text,
          "good"
        );


        setStatus(
          "WebGPU 診斷通過，可以初始化。",
          "success"
        );


        const model =
          MODELS[currentModelId];


        if (
          await modelExists(model)
        ) {

          initBtn.disabled =
            false;

        } else {

          initBtn.disabled =
            true;

          setStatus(
            "WebGPU 通過，但模型尚未下載。",
            "warning"
          );

        }


      } else {

        text +=
          "結果：❌ maxStorageBufferBindingSize 偏低\n\n";


        text +=
          "V5.1 不會進入 LLM 初始化，避免 Safari 在 GPU/WASM 階段直接中斷。";


        showDiagnostic(
          text,
          "bad"
        );


        setStatus(
          "WebGPU buffer capability 不足。",
          "warning"
        );


        initBtn.disabled =
          true;

      }


    } catch (error) {

      console.error(
        "GPU diagnostic failed:",
        error
      );


      showDiagnostic(
        "❌ WebGPU 診斷錯誤\n\n" +
        (
          error?.stack ||
          error?.message ||
          String(error)
        ),
        "bad"
      );


      setStatus(
        `GPU 診斷失敗：${error?.message || error}`,
        "error"
      );


      initBtn.disabled =
        true;


    } finally {

      diagnoseBtn.disabled =
        false;

    }

  }
);


/* =========================================================
   MEDIAPIPE FILESET
   ========================================================= */

async function getFileset() {

  if (fileset) {
    return fileset;
  }


  setStatus(
    "載入 MediaPipe WASM..."
  );


  fileset =
    await FilesetResolver.forGenAiTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29/wasm"
    );


  return fileset;

}


/* =========================================================
   CLOSE LLM
   ========================================================= */

async function closeLLM() {

  if (!llm) {
    return;
  }


  const old =
    llm;


  llm =
    null;


  try {

    if (
      typeof old.close ===
      "function"
    ) {

      old.close();

    }

  } catch (_) {}


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        300
      )
  );

}


/* =========================================================
   INITIALIZE
   ========================================================= */

initBtn.addEventListener(
  "click",
  async () => {

    if (initializing) {
      return;
    }


    const model =
      MODELS[currentModelId];


    initializing =
      true;


    initBtn.disabled =
      true;

    downloadBtn.disabled =
      true;

    diagnoseBtn.disabled =
      true;


    try {

      /*
       * First make sure WebGPU is actually available.
       */

      if (
        !navigator.gpu
      ) {

        throw new Error(
          "navigator.gpu 不存在。"
        );

      }


      /*
       * Check model.
       */

      if (
        !(await modelExists(model))
      ) {

        throw new Error(
          "找不到模型檔案，請先下載。"
        );

      }


      const size =
        await modelSize(model);


      if (
        size <
        100 *
        1024 *
        1024
      ) {

        throw new Error(
          `模型檔案異常：${formatBytes(size)}`
        );

      }


      setStatus(
        `正在初始化 ${model.name}...`
      );


      /*
       * Release any previous instance.
       */

      await closeLLM();


      /*
       * OPFS -> File -> stream reader
       *
       * No Blob.
       * No Object URL.
       * No arrayBuffer().
       */

      const handle =
        await getHandle(model);


      const file =
        await handle.getFile();


      const reader =
        file
          .stream()
          .getReader();


      /*
       * Load MediaPipe WASM.
       */

      const genai =
        await getFileset();


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            250
          )
      );


      /*
       * LLM initialization.
       */

      const instance =
        await LlmInference.createFromOptions(
          genai,
          {

            baseOptions: {

              modelAssetBuffer:
                reader,

              delegate:
                "GPU"

            },

            maxTokens:
              model.maxTokens,

            topK:
              model.topK,

            temperature:
              model.temperature,

            randomSeed:
              42

          }
        );


      llm =
        instance;


      setStatus(
        `${model.name} 初始化成功！`,
        "success"
      );


      addMessage(
        "system",
        `✓ ${model.name} 初始化成功，可以聊天。`
      );


      sendBtn.disabled =
        false;


    } catch (error) {

      console.error(
        "LLM initialization error:",
        error
      );


      setStatus(
        `初始化失敗：${error?.message || error}`,
        "error"
      );


      showDiagnostic(
        "❌ LLM Initialization Error\n\n" +
        (
          error?.stack ||
          error?.message ||
          String(error)
        ),
        "bad"
      );


      addMessage(
        "system",
        "模型初始化失敗。\n\n" +
        (
          error?.message ||
          String(error)
        )
      );


    } finally {

      initializing =
        false;

      downloadBtn.disabled =
        false;

      diagnoseBtn.disabled =
        false;

      initBtn.disabled =
        !!llm;

    }

  }
);


/* =========================================================
   MODEL SWITCH
   ========================================================= */

modelSelect.addEventListener(
  "change",
  async () => {

    await closeLLM();


    currentModelId =
      modelSelect.value;


    hfToken.classList.toggle(
      "hidden",
      currentModelId !== "gemma"
    );


    initBtn.disabled =
      true;

    sendBtn.disabled =
      true;


    const model =
      MODELS[currentModelId];


    if (
      await modelExists(model)
    ) {

      const size =
        await modelSize(model);


      setStatus(
        `${model.name} 已下載 (${formatBytes(size)})。請先 GPU 診斷。`,
        "success"
      );


    } else {

      setStatus(
        `${model.name} 尚未下載。`
      );

    }

  }
);


/* =========================================================
   SEND
   ========================================================= */

sendBtn.addEventListener(
  "click",
  async () => {

    if (
      !llm ||
      generating
    ) {
      return;
    }


    const text =
      promptInput.value.trim();


    if (!text) {
      return;
    }


    promptInput.value =
      "";


    generating =
      true;


    sendBtn.disabled =
      true;

    stopBtn.disabled =
      false;


    addMessage(
      "user",
      text
    );


    const bubble =
      addMessage(
        "assistant",
        "..."
      );


    let output =
      "";


    try {

      await new Promise(
        (resolve, reject) => {

          let finished =
            false;


          const finish =
            () => {

              if (finished) {
                return;
              }

              finished =
                true;

              resolve();

            };


          try {

            llm.generateResponse(
              text,
              (
                partial,
                done
              ) => {

                if (partial) {

                  output +=
                    partial;

                  bubble.textContent =
                    output;

                  chat.scrollTop =
                    chat.scrollHeight;

                }


                if (done) {

                  finish();

                }

              }
            );


          } catch (error) {

            reject(error);

          }

        }
      );


    } catch (error) {

      bubble.textContent =
        output
          ? `${output}\n\n[錯誤：${error?.message || error}]`
          : `[錯誤：${error?.message || error}]`;

    } finally {

      generating =
        false;

      sendBtn.disabled =
        !llm;

      stopBtn.disabled =
        true;

    }

  }
);


/* =========================================================
   STOP
   ========================================================= */

stopBtn.addEventListener(
  "click",
  () => {

    try {

      if (
        llm &&
        typeof llm.cancelProcessing ===
        "function"
      ) {

        llm.cancelProcessing();

      }

    } catch (_) {}


    generating =
      false;


    sendBtn.disabled =
      !llm;

    stopBtn.disabled =
      true;


    setStatus(
      "已停止生成。"
    );

  }
);


/* =========================================================
   CLEAR
   ========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    chat.innerHTML =
      "";

  }
);


/* =========================================================
   STARTUP
   ========================================================= */

async function startup() {

  /*
   * IMPORTANT:
   * Don't call WebGPU or MediaPipe automatically.
   *
   * Safari iPhone gets a user gesture only after
   * the user taps the button.
   */

  hfToken.classList.add(
    "hidden"
  );


  addMessage(
    "system",
    "V5.1 已啟動。\n" +
    "請先按「GPU 診斷」，再按「下載模型」或「初始化」。"
  );


  try {

    const model =
      MODELS[currentModelId];


    if (
      await modelExists(model)
    ) {

      const size =
        await modelSize(model);


      setStatus(
        `${model.name} 已存在 (${formatBytes(size)})。`,
        "success"
      );


    } else {

      setStatus(
        `${model.name} 尚未下載。`
      );

    }


  } catch (error) {

    setStatus(
      `啟動檢查失敗：${error?.message || error}`,
      "error"
    );


    showDiagnostic(
      "Startup Error\n\n" +
      (
        error?.stack ||
        error?.message ||
        String(error)
      ),
      "bad"
    );

  }

}


/* =========================================================
   START
   ========================================================= */

startup();

</script>
