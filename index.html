<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta name="theme-color" content="#111827">

<title>V9 · Qwen 0.5B Init Diagnostic</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111827;
  color: #f9fafb;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}

main {
  width: min(760px, 100%);
  margin: auto;

  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    calc(30px + env(safe-area-inset-bottom));
}

h1 {
  margin: 0 0 6px;
  font-size: 22px;
}

.subtitle {
  color: #9ca3af;
  font-size: 13px;
  line-height: 1.55;
  margin-bottom: 18px;
}

.card {
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 14px;

  padding: 15px;
  margin-bottom: 12px;
}

.title {
  font-weight: 700;
  margin-bottom: 8px;
}

.status {
  white-space: pre-wrap;
  word-break: break-word;

  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;

  border: 0;
  border-radius: 11px;

  padding: 13px 14px;
  margin-top: 9px;

  background: #374151;
  color: white;

  font-size: 15px;
  font-weight: 600;

  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .45;
}

.primary {
  background: #2563eb;
}

.green {
  background: #166534;
}

.orange {
  background: #92400e;
}

.red {
  background: #7f1d1d;
}

.log {
  background: #030712;

  border-radius: 10px;

  padding: 12px;

  min-height: 260px;
  max-height: 500px;

  overflow: auto;

  white-space: pre-wrap;
  word-break: break-word;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  font-size: 12px;
  line-height: 1.55;
}

.ok {
  color: #86efac;
}

.warn {
  color: #fcd34d;
}

.err {
  color: #fca5a5;
}

.info {
  color: #93c5fd;
}

.small {
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.5;
}

</style>
</head>

<body>

<main>

<h1>V9 · Qwen 0.5B 初始化診斷</h1>

<div class="subtitle">
只測 Qwen 0.5B。<br>
不載入 Gemma、不建立聊天、不使用 OPFS。<br>
目的：區分 modelPath 載入問題，與 modelBuffer / GPU 初始化問題。
</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div class="card">

  <div class="title">
    狀態
  </div>

  <div id="status" class="status">
V9 準備完成。
  </div>

</div>


<!-- =====================================================
     BUTTONS
===================================================== -->

<div class="card">

  <div class="title">
    診斷
  </div>


  <button
    id="gpuBtn"
    class="primary"
  >
    ① WebGPU 診斷
  </button>


  <button
    id="mpBtn"
  >
    ② MediaPipe / WASM
  </button>


  <button
    id="pathBtn"
    class="green"
  >
    ③ A：createFromModelPath
  </button>


  <button
    id="bufferBtn"
    class="orange"
  >
    ④ B：fetch + modelAssetBuffer
  </button>


  <button
    id="resetBtn"
    class="red"
  >
    清除 Marker
  </button>

</div>


<!-- =====================================================
     LOG
===================================================== -->

<div class="card">

  <div class="title">
    診斷紀錄
  </div>

  <div
    id="log"
    class="log"
  ></div>

</div>


<!-- =====================================================
     INFO
===================================================== -->

<div class="card">

  <div class="small">

    MediaPipe:
    @mediapipe/tasks-genai@0.10.29

    <br><br>

    Model:
    Qwen2.5-0.5B-Instruct

    <br><br>

    A 測試：
    createFromModelPath()

    <br>

    B 測試：
    fetch() → ReadableStreamDefaultReader →
    createFromOptions()

  </div>

</div>

</main>


<script type="module">

/* =========================================================
   CONFIG
========================================================= */

const MP_VERSION =
  "0.10.29";


const MP_MODULE_URL =
  `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VERSION}/+esm`;


const WASM_URL =
  `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VERSION}/wasm`;


const QWEN_URL =
  "https://huggingface.co/litert-community/" +
  "Qwen2.5-0.5B-Instruct/resolve/main/" +
  "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task";


/* =========================================================
   DOM
========================================================= */

const statusEl =
  document.getElementById("status");

const logEl =
  document.getElementById("log");

const gpuBtn =
  document.getElementById("gpuBtn");

const mpBtn =
  document.getElementById("mpBtn");

const pathBtn =
  document.getElementById("pathBtn");

const bufferBtn =
  document.getElementById("bufferBtn");

const resetBtn =
  document.getElementById("resetBtn");


/* =========================================================
   MEDIAPIPE STATE
========================================================= */

let FilesetResolver = null;
let LlmInference = null;

let genai = null;
let llm = null;


/* =========================================================
   MARKER
========================================================= */

const MARKER_KEY =
  "v9_marker";

const MARKER_TIME =
  "v9_marker_time";


function marker(name) {

  try {

    localStorage.setItem(
      MARKER_KEY,
      name
    );

    localStorage.setItem(
      MARKER_TIME,
      String(Date.now())
    );

  } catch (_) {}

}


function clearMarker() {

  try {

    localStorage.removeItem(
      MARKER_KEY
    );

    localStorage.removeItem(
      MARKER_TIME
    );

  } catch (_) {}

}


function previousMarker() {

  try {

    const m =
      localStorage.getItem(
        MARKER_KEY
      );

    const t =
      localStorage.getItem(
        MARKER_TIME
      );

    if (!m) {
      return;
    }

    let age = "";

    if (t) {

      age =
        `\n${Math.round(
          (Date.now() - Number(t)) / 1000
        )} 秒前`;

    }

    log(
      "⚠️ 上一輪沒有正常完成：\n" +
      m +
      age,
      "warn"
    );

    setStatus(
      "⚠️ 偵測到上一輪 Safari 可能在以下階段終止：\n\n" +
      m +
      age
    );

  } catch (_) {}

}


/* =========================================================
   LOG
========================================================= */

function now() {

  return new Date()
    .toLocaleTimeString();

}


function log(
  message,
  type = ""
) {

  const div =
    document.createElement("div");

  div.textContent =
    `[${now()}] ${message}`;

  if (type) {
    div.className = type;
  }

  logEl.appendChild(div);

  logEl.scrollTop =
    logEl.scrollHeight;

  console.log(message);

}


function setStatus(
  message
) {

  statusEl.textContent =
    message;

}


function errText(error) {

  if (!error) {
    return "Unknown error";
  }

  return String(
    error.stack ||
    error.message ||
    error
  );

}


/* =========================================================
   LOAD MEDIAPIPE
========================================================= */

async function loadMediaPipe() {

  if (
    FilesetResolver &&
    LlmInference
  ) {

    return;

  }


  log(
    `載入 MediaPipe ${MP_VERSION}...`
  );


  const mod =
    await import(
      MP_MODULE_URL
    );


  FilesetResolver =
    mod.FilesetResolver;

  LlmInference =
    mod.LlmInference;


  if (
    !FilesetResolver ||
    !LlmInference
  ) {

    throw new Error(
      "MediaPipe API 不完整"
    );

  }


  log(
    "MediaPipe JS module ✓",
    "ok"
  );

}


/* =========================================================
   GPU
========================================================= */

gpuBtn.onclick =
async () => {

  gpuBtn.disabled = true;

  try {

    marker(
      "GPU · requestAdapter"
    );


    setStatus(
      "正在檢查 WebGPU..."
    );


    log(
      "========== GPU =========="
    );


    if (!navigator.gpu) {

      throw new Error(
        "navigator.gpu 不存在"
      );

    }


    const adapter =
      await navigator.gpu
        .requestAdapter();


    if (!adapter) {

      throw new Error(
        "requestAdapter() = null"
      );

    }


    log(
      "GPU Adapter ✓",
      "ok"
    );


    log(
      "maxBufferSize = " +
      bytes(
        adapter.limits.maxBufferSize
      )
    );


    log(
      "maxStorageBufferBindingSize = " +
      bytes(
        adapter.limits
          .maxStorageBufferBindingSize
      )
    );


    log(
      "features = " +
      Array.from(
        adapter.features || []
      ).join(", ")
    );


    clearMarker();


    setStatus(
      "✓ WebGPU 診斷成功"
    );


  } catch (e) {

    clearMarker();

    setStatus(
      "WebGPU error"
    );

    log(
      errText(e),
      "err"
    );

  } finally {

    gpuBtn.disabled = false;

  }

};


/* =========================================================
   MEDIAPIPE
========================================================= */

mpBtn.onclick =
async () => {

  mpBtn.disabled = true;

  try {

    log(
      "========== MEDIAPIPE =========="
    );


    marker(
      "MP · import"
    );


    setStatus(
      "載入 MediaPipe..."
    );


    await loadMediaPipe();


    marker(
      "MP · FilesetResolver"
    );


    log(
      "建立 GenAI Fileset..."
    );


    genai =
      await FilesetResolver
        .forGenAiTasks(
          WASM_URL
        );


    clearMarker();


    log(
      "GenAI Fileset ✓",
      "ok"
    );


    setStatus(
      "✓ MediaPipe / WASM 測試成功"
    );


  } catch (e) {

    clearMarker();

    setStatus(
      "MediaPipe error"
    );

    log(
      errText(e),
      "err"
    );

  } finally {

    mpBtn.disabled = false;

  }

};


/* =========================================================
   A — MODEL PATH
========================================================= */

pathBtn.onclick =
async () => {

  pathBtn.disabled = true;

  gpuBtn.disabled = true;
  mpBtn.disabled = true;
  bufferBtn.disabled = true;


  try {

    log(
      "========== A · MODEL PATH =========="
    );


    setStatus(
      "A 測試\n\n" +
      "createFromModelPath()\n\n" +
      "如果 Safari 在這裡整頁重載，" +
      "Marker 會指出這個階段。"
    );


    /* ---------------------------------------------
       A1
    --------------------------------------------- */

    marker(
      "A1 · load MediaPipe"
    );


    await loadMediaPipe();


    /* ---------------------------------------------
       A2
    --------------------------------------------- */

    marker(
      "A2 · FilesetResolver"
    );


    if (!genai) {

      genai =
        await FilesetResolver
          .forGenAiTasks(
            WASM_URL
          );

    }


    /* ---------------------------------------------
       A3
    --------------------------------------------- */

    marker(
      "A3 · createFromModelPath"
    );


    log(
      "⚠️ 即將執行 createFromModelPath()",
      "warn"
    );


    log(
      "Model URL："
    );


    log(
      QWEN_URL
    );


    /*
     * 官方 Web LLM README 使用這條 API。
     */


    llm =
      await LlmInference
        .createFromModelPath(
          genai,
          QWEN_URL
        );


    /* ---------------------------------------------
       SUCCESS
    --------------------------------------------- */

    clearMarker();


    log(
      "A SUCCESS ✓",
      "ok"
    );


    setStatus(
      "🎉 A：createFromModelPath 成功！\n\n" +
      "Qwen 0.5B 已完成 LLM 初始化。"
    );


  } catch (e) {

    clearMarker();


    setStatus(
      "A 發生 JavaScript error"
    );


    log(
      errText(e),
      "err"
    );


  } finally {

    pathBtn.disabled = false;

    gpuBtn.disabled = false;
    mpBtn.disabled = false;
    bufferBtn.disabled = false;

  }

};


/* =========================================================
   B — FETCH + MODEL BUFFER
========================================================= */

bufferBtn.onclick =
async () => {

  bufferBtn.disabled = true;

  gpuBtn.disabled = true;
  mpBtn.disabled = true;
  pathBtn.disabled = true;


  try {

    log(
      "========== B · MODEL BUFFER =========="
    );


    setStatus(
      "B 測試\n\n" +
      "fetch Qwen → ReadableStream → " +
      "createFromOptions()\n\n" +
      "這次不使用 createFromModelPath。"
    );


    /* ---------------------------------------------
       B1
    --------------------------------------------- */

    marker(
      "B1 · load MediaPipe"
    );


    await loadMediaPipe();


    /* ---------------------------------------------
       B2
    --------------------------------------------- */

    marker(
      "B2 · FilesetResolver"
    );


    if (!genai) {

      genai =
        await FilesetResolver
          .forGenAiTasks(
            WASM_URL
          );

    }


    log(
      "GenAI Fileset ✓",
      "ok"
    );


    /* ---------------------------------------------
       B3
    --------------------------------------------- */

    marker(
      "B3 · fetch Qwen"
    );


    setStatus(
      "B3 / 4\n\n" +
      "正在從 Hugging Face 串流 Qwen..."
    );


    log(
      "開始 fetch Qwen..."
    );


    const response =
      await fetch(
        QWEN_URL,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status} ${response.statusText}`
      );

    }


    if (!response.body) {

      throw new Error(
        "response.body 不存在"
      );

    }


    const total =
      Number(
        response.headers
          .get("content-length") || 0
      );


    log(
      total
        ? "Content-Length = " +
          bytes(total)
        : "Content-Length 未提供"
    );


    /* ---------------------------------------------
       B4
    --------------------------------------------- */

    marker(
      "B4 · createFromOptions"
    );


    const reader =
      response.body
        .getReader();


    log(
      "ReadableStreamDefaultReader ✓",
      "ok"
    );


    setStatus(
      "B4 / 4\n\n" +
      "⚠️ 即將進入 createFromOptions()\n\n" +
      "如果 Safari 整頁重載，" +
      "表示問題不是 OPFS。"
    );


    log(
      "⚠️ 即將執行 createFromOptions()",
      "warn"
    );


    llm =
      await LlmInference
        .createFromOptions(
          genai,
          {
            baseOptions: {
              modelAssetBuffer:
                reader,

              delegate:
                "GPU"
            },

            maxTokens:
              64,

            topK:
              1,

            temperature:
              0,

            randomSeed:
              1
          }
        );


    /* ---------------------------------------------
       SUCCESS
    --------------------------------------------- */

    clearMarker();


    log(
      "B SUCCESS ✓",
      "ok"
    );


    setStatus(
      "🎉 B：modelAssetBuffer 成功！\n\n" +
      "Qwen 0.5B 已完成 GPU 初始化。"
    );


  } catch (e) {

    clearMarker();


    setStatus(
      "B 發生 JavaScript error"
    );


    log(
      errText(e),
      "err"
    );


  } finally {

    bufferBtn.disabled = false;

    gpuBtn.disabled = false;
    mpBtn.disabled = false;
    pathBtn.disabled = false;

  }

};


/* =========================================================
   RESET
========================================================= */

resetBtn.onclick =
() => {

  clearMarker();

  logEl.innerHTML = "";

  llm = null;
  genai = null;


  setStatus(
    "Marker 已清除。\n\n" +
    "建議先跑：\n" +
    "① WebGPU\n" +
    "② MediaPipe\n" +
    "③ A\n\n" +
    "如果 A 重載，再重新開頁後跑 ④ B。"
  );


  log(
    "V9 reset",
    "info"
  );

};


/* =========================================================
   FORMAT
========================================================= */

function bytes(n) {

  if (
    !Number.isFinite(n)
  ) {

    return "unknown";

  }


  if (
    n >=
    1024 * 1024 * 1024
  ) {

    return (
      n /
      1024 /
      1024 /
      1024
    ).toFixed(2) +
    " GB";

  }


  return (
    n /
    1024 /
    1024
  ).toFixed(1) +
  " MB";

}


/* =========================================================
   START
========================================================= */

previousMarker();


if (
  !localStorage.getItem(
    MARKER_KEY
  )
) {

  setStatus(
    "V9 已準備。\n\n" +
    "建議順序：\n\n" +
    "① WebGPU\n" +
    "② MediaPipe / WASM\n" +
    "③ A：createFromModelPath\n\n" +
    "如果 ③ 重載，重新進入頁面後再測 ④。"
  );

}


log(
  "V9 ready.",
  "info"
);

log(
  `MediaPipe: ${MP_VERSION}`
);

log(
  "Qwen: 0.5B q8"
);

</script>

</body>
</html>
