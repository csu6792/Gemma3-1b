<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>iPhone Local AI Chat</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0f14;
    color: #f4f4f5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;
}

body {
    overflow: hidden;
}

#app {
    height: 100dvh;
    height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

/* =========================
   Header
========================= */

header {
    flex: 0 0 auto;
    padding: 14px 16px 12px;
    border-bottom: 1px solid #252a32;
    background: rgba(11, 15, 20, 0.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}

.title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.title h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
}

.device-badge {
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 999px;
    background: #17202b;
    color: #9ecbff;
    white-space: nowrap;
}

.controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    margin-top: 10px;
}

select,
button,
textarea {
    font: inherit;
}

select {
    width: 100%;
    min-height: 42px;
    border: 1px solid #343b45;
    border-radius: 11px;
    background: #151a21;
    color: white;
    padding: 0 12px;
}

button {
    border: 0;
    border-radius: 11px;
    min-height: 42px;
    padding: 0 15px;
    background: #2d7ff9;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: default;
}

/* =========================
   Status
========================= */

.status {
    margin-top: 9px;
    min-height: 20px;
    font-size: 12px;
    color: #9ca3af;
    line-height: 1.45;
}

.progress-wrap {
    display: none;
    margin-top: 8px;
}

.progress-bg {
    width: 100%;
    height: 5px;
    border-radius: 99px;
    overflow: hidden;
    background: #202630;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #2d7ff9;
    transition: width 0.15s linear;
}

.progress-text {
    margin-top: 4px;
    font-size: 11px;
    color: #7d8794;
}

/* =========================
   Chat
========================= */

#messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 14px 20px;
}

.message {
    max-width: 88%;
    margin-bottom: 14px;
    padding: 11px 13px;
    border-radius: 15px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.user {
    margin-left: auto;
    background: #1f5fbf;
    border-bottom-right-radius: 5px;
}

.message.ai {
    margin-right: auto;
    background: #171c23;
    border: 1px solid #272e38;
    border-bottom-left-radius: 5px;
}

.message.system {
    max-width: 100%;
    margin: 0 auto 12px;
    background: transparent;
    color: #8993a0;
    font-size: 12px;
    text-align: center;
}

/* =========================
   Composer
========================= */

.composer {
    flex: 0 0 auto;
    padding: 10px 12px;
    border-top: 1px solid #252a32;
    background: rgba(11, 15, 20, 0.97);
}

.composer-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

textarea {
    flex: 1;
    min-width: 0;
    max-height: 130px;
    min-height: 44px;
    resize: none;
    border: 1px solid #343b45;
    border-radius: 13px;
    padding: 11px 12px;
    background: #151a21;
    color: white;
    outline: none;
    line-height: 1.4;
}

textarea:focus {
    border-color: #2d7ff9;
}

.send {
    min-width: 64px;
}

/* =========================
   iPhone warning
========================= */

.iphone-tip {
    display: none;
    margin-top: 7px;
    padding: 8px 10px;
    border-radius: 9px;
    background: #1c2631;
    color: #b8c7d9;
    font-size: 11px;
    line-height: 1.5;
}

body.ios .iphone-tip {
    display: block;
}

/* =========================
   Small screens
========================= */

@media (max-width: 500px) {
    header {
        padding-left: 12px;
        padding-right: 12px;
    }

    .message {
        max-width: 92%;
    }
}
</style>
</head>

<body>

<div id="app">

    <header>

        <div class="title">
            <h1>📱 Local AI Chat</h1>
            <div id="deviceBadge" class="device-badge">
                Browser
            </div>
        </div>

        <div class="controls">

            <select id="modelSelect">
                <option value="qwen05">
                    Qwen 2.5 0.5B — iPhone 推薦
                </option>

                <option value="gemma1b">
                    Gemma 3 1B — 較大
                </option>
            </select>

            <button id="loadBtn">
                載入
            </button>

        </div>

        <div id="status" class="status">
            尚未載入模型
        </div>

        <div id="progressWrap" class="progress-wrap">
            <div class="progress-bg">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div id="progressText" class="progress-text">
                準備下載...
            </div>
        </div>

        <div class="iphone-tip">
            iPhone 模式：優先使用較小模型、避免一次建立多份模型副本，
            並限制輸出長度以降低 Safari 記憶體壓力。
        </div>

    </header>

    <main id="messages">

        <div class="message system">
            選擇模型後按「載入」。模型會保存在瀏覽器 Cache，
            下次開啟可直接使用。
        </div>

    </main>

    <div class="composer">

        <div class="composer-row">

            <textarea
                id="input"
                rows="1"
                placeholder="輸入訊息..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="sentences"
                spellcheck="false"
            ></textarea>

            <button
                id="sendBtn"
                class="send"
                disabled
            >
                發送
            </button>

        </div>

    </div>

</div>

<script type="module">

/* ============================================================
   MediaPipe Tasks GenAI
============================================================ */

import {
    FilesetResolver,
    LlmInference
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29/+esm";


/* ============================================================
   Model definitions
============================================================ */

const MODELS = {

    qwen05: {
        name: "Qwen 2.5 0.5B",

        url:
            "https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/" +
            "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

        approxMB: 547,

        iphoneRecommended: true,

        maxTokensDesktop: 384,
        maxTokensIOS: 256
    },

    gemma1b: {
        name: "Gemma 3 1B",

        url:
            "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/" +
            "gemma3-1b-it-int4-web.task",

        approxMB: 700,

        iphoneRecommended: false,

        maxTokensDesktop: 384,
        maxTokensIOS: 192
    }

};


/* ============================================================
   DOM
============================================================ */

const modelSelect =
    document.getElementById("modelSelect");

const loadBtn =
    document.getElementById("loadBtn");

const sendBtn =
    document.getElementById("sendBtn");

const input =
    document.getElementById("input");

const messages =
    document.getElementById("messages");

const statusEl =
    document.getElementById("status");

const progressWrap =
    document.getElementById("progressWrap");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const deviceBadge =
    document.getElementById("deviceBadge");


/* ============================================================
   Device detection
============================================================ */

const isIOS =
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (
        navigator.platform === "MacIntel" &&
        navigator.maxTouchPoints > 1
    );

const isSafari =
    /^((?!chrome|android).)*safari/i.test(
        navigator.userAgent
    );

const hasWebGPU =
    !!navigator.gpu;

if (isIOS) {
    document.body.classList.add("ios");
    deviceBadge.textContent = "iPhone / iPad";
} else if (hasWebGPU) {
    deviceBadge.textContent = "WebGPU";
} else {
    deviceBadge.textContent = "Web";
}


/* ============================================================
   iPhone default model
============================================================ */

if (isIOS) {
    modelSelect.value = "qwen05";
}


/* ============================================================
   LiteRT state
============================================================ */

let llm = null;

let currentModelKey = null;

let currentObjectURL = null;

let isLoading = false;

let isGenerating = false;


/* ============================================================
   Cache
============================================================ */

const CACHE_NAME =
    "local-ai-model-cache-v2";


/* ============================================================
   Messages
============================================================ */

function addMessage(
    text,
    type = "ai"
) {

    const el =
        document.createElement("div");

    el.className =
        `message ${type}`;

    el.textContent = text;

    messages.appendChild(el);

    messages.scrollTop =
        messages.scrollHeight;

    return el;
}


/* ============================================================
   Status
============================================================ */

function setStatus(text) {
    statusEl.textContent = text;
}


/* ============================================================
   Progress
============================================================ */

function showProgress() {
    progressWrap.style.display = "block";
}

function hideProgress() {
    progressWrap.style.display = "none";
}

function setProgress(
    percent,
    text
) {

    progressBar.style.width =
        `${Math.max(0, Math.min(100, percent))}%`;

    progressText.textContent =
        text || `${percent}%`;
}


/* ============================================================
   WebGPU test
============================================================ */

async function checkWebGPU() {

    if (!navigator.gpu) {
        throw new Error(
            "這個瀏覽器沒有 WebGPU。請更新 iPhone / Safari。"
        );
    }

    let adapter = null;

    try {
        adapter =
            await navigator.gpu.requestAdapter();
    } catch (e) {
        adapter = null;
    }

    if (!adapter) {
        throw new Error(
            "Safari 找不到可用的 WebGPU GPU Adapter。"
        );
    }

    return true;
}


/* ============================================================
   Cache lookup
============================================================ */

async function getCachedModel(url) {

    if (!("caches" in window)) {
        return null;
    }

    try {

        const cache =
            await caches.open(CACHE_NAME);

        const response =
            await cache.match(url);

        if (!response) {
            return null;
        }

        if (!response.ok) {
            return null;
        }

        return response;

    } catch (error) {

        console.warn(
            "Cache read failed:",
            error
        );

        return null;
    }
}


/* ============================================================
   Download model
============================================================ */

async function downloadModel(
    model
) {

    setStatus(
        `下載 ${model.name}...`
    );

    showProgress();

    setProgress(
        0,
        `準備下載 ${model.approxMB} MB 左右`
    );


    /*
     * IMPORTANT:
     *
     * 不使用：
     *
     * const chunks = [];
     *
     * reader.read()
     *
     * chunks.push(...)
     *
     * 因為 iPhone Safari 會因此在 JS heap
     * 留住大量 Uint8Array。
     *
     * 這裡讓瀏覽器自己處理 Response body。
     */

    const response =
        await fetch(
            model.url,
            {
                method: "GET",
                mode: "cors",
                credentials: "omit",
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            `模型下載失敗：HTTP ${response.status}`
        );
    }


    /*
     * 優先讓 Cache Storage 保存 Response。
     *
     * clone() 不會建立 JS chunks[]。
     */

    if ("caches" in window) {

        try {

            const cache =
                await caches.open(CACHE_NAME);

            /*
             * 不阻塞整個模型初始化。
             *
             * Cache 寫入在背景進行。
             */

            cache.put(
                model.url,
                response.clone()
            ).catch(
                err =>
                    console.warn(
                        "Cache write failed:",
                        err
                    )
            );

        } catch (error) {

            console.warn(
                "Cache open failed:",
                error
            );
        }
    }


    /*
     * 直接由 browser 建立 Blob。
     *
     * 不使用 chunks[]。
     */

    const blob =
        await response.blob();


    hideProgress();

    return blob;
}


/* ============================================================
   Load model from Cache or network
============================================================ */

async function getModelBlob(model) {

    /*
     * 1. Cache
     */

    const cached =
        await getCachedModel(
            model.url
        );

    if (cached) {

        setStatus(
            `${model.name} 已存在本機 Cache，準備啟動...`
        );

        try {

            const blob =
                await cached.blob();

            return blob;

        } catch (error) {

            console.warn(
                "Cached blob failed:",
                error
            );
        }
    }


    /*
     * 2. Download
     */

    return await downloadModel(model);
}


/* ============================================================
   Release old model
============================================================ */

async function releaseCurrentModel() {

    sendBtn.disabled = true;

    if (llm) {

        try {

            /*
             * 不同版本 API 行為可能不同。
             * 有 close 就使用 close。
             */

            if (
                typeof llm.close === "function"
            ) {
                await llm.close();
            }

        } catch (error) {

            console.warn(
                "LLM close warning:",
                error
            );
        }

        llm = null;
    }


    /*
     * 釋放 Object URL
     */

    if (currentObjectURL) {

        try {
            URL.revokeObjectURL(
                currentObjectURL
            );
        } catch (e) {}

        currentObjectURL = null;
    }


    currentModelKey = null;


    /*
     * 給 Safari 一點時間釋放 WebAssembly /
     * GPU / Blob 資源。
     */

    await new Promise(
        resolve =>
            setTimeout(resolve, 150)
    );
}


/* ============================================================
   Create LLM
============================================================ */

async function createLLM(
    model,
    blob
) {

    setStatus(
        `${model.name} 正在啟動 WebGPU...`
    );


    /*
     * Blob URL
     */

    currentObjectURL =
        URL.createObjectURL(blob);


    /*
     * Blob 本身不再需要由 JS 保留。
     */

    blob = null;


    const wasmFileset =
        await FilesetResolver.forGenAiTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29/wasm"
        );


    /*
     * iPhone 使用比較小的 maxTokens。
     */

    const maxTokens =
        isIOS
            ? model.maxTokensIOS
            : model.maxTokensDesktop;


    llm =
        await LlmInference.createFromOptions(
            wasmFileset,
            {
                baseOptions: {
                    modelAssetPath:
                        currentObjectURL,

                    delegate:
                        "GPU"
                },

                maxTokens,

                temperature:
                    0.7,

                topK:
                    40
            }
        );


    currentModelKey =
        Object.keys(MODELS)
            .find(
                key =>
                    MODELS[key] === model
            );


    setStatus(
        `${model.name} 已載入，可以開始聊天。`
    );

    sendBtn.disabled = false;
}


/* ============================================================
   Load selected model
============================================================ */

async function loadSelectedModel() {

    if (isLoading) {
        return;
    }

    if (isGenerating) {
        addMessage(
            "目前正在產生回答，請稍候。",
            "system"
        );
        return;
    }


    const key =
        modelSelect.value;

    const model =
        MODELS[key];

    if (!model) {
        return;
    }


    /*
     * iPhone + 大模型警告
     */

    if (
        isIOS &&
        !model.iphoneRecommended
    ) {

        const ok =
            confirm(
                "這個模型比較大，在 iPhone Safari 上記憶體壓力較高。\n\n" +
                "建議使用 Qwen 0.5B。\n\n" +
                "仍然要載入 Gemma 3 1B 嗎？"
            );

        if (!ok) {

            modelSelect.value =
                "qwen05";

            return;
        }
    }


    isLoading = true;

    loadBtn.disabled = true;

    modelSelect.disabled = true;

    sendBtn.disabled = true;


    try {

        /*
         * WebGPU
         */

        setStatus(
            "檢查 WebGPU..."
        );

        await checkWebGPU();


        /*
         * 釋放舊模型
         */

        if (llm) {

            setStatus(
                "釋放上一個模型..."
            );

            await releaseCurrentModel();
        }


        /*
         * 取得 Blob
         */

        const blob =
            await getModelBlob(
                model
            );


        /*
         * 啟動模型
         */

        await createLLM(
            model,
            blob
        );


        /*
         * 強制移除 JS 參照
         */

        setStatus(
            `${model.name} 已就緒。`
        );


    } catch (error) {

        console.error(
            error
        );

        hideProgress();

        await releaseCurrentModel();


        let message =
            error?.message ||
            String(error);


        if (
            message.includes("401") ||
            message.includes("403")
        ) {

            message +=
                "\n\n如果是 Gemma，請確認 Hugging Face 已接受 Gemma license。";
        }


        addMessage(
            "模型載入失敗：\n" +
            message,
            "system"
        );

        setStatus(
            "模型載入失敗"
        );


    } finally {

        isLoading = false;

        loadBtn.disabled = false;

        modelSelect.disabled = false;
    }
}


/* ============================================================
   Generate
============================================================ */

async function generate() {

    if (!llm) {

        addMessage(
            "請先載入模型。",
            "system"
        );

        return;
    }

    if (isGenerating) {
        return;
    }


    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    isGenerating = true;

    sendBtn.disabled = true;

    input.disabled = true;


    addMessage(
        text,
        "user"
    );

    input.value = "";


    const outputEl =
        addMessage(
            "",
            "ai"
        );


    try {

        /*
         * MediaPipe LLM Inference API
         */

        const result =
            await llm.generateResponse(
                text
            );

        outputEl.textContent =
            result || "(沒有產生文字)";


        messages.scrollTop =
            messages.scrollHeight;


    } catch (error) {

        console.error(
            error
        );

        outputEl.textContent =
            "產生回答時發生錯誤：\n" +
            (
                error?.message ||
                String(error)
            );

    } finally {

        isGenerating = false;

        sendBtn.disabled = false;

        input.disabled = false;

        input.focus();
    }
}


/* ============================================================
   Events
============================================================ */

loadBtn.addEventListener(
    "click",
    loadSelectedModel
);


sendBtn.addEventListener(
    "click",
    generate
);


input.addEventListener(
    "keydown",
    event => {

        /*
         * 桌面：
         * Enter = 發送
         *
         * iPhone：
         * 保留 Enter 作換行，
         * 避免鍵盤操作不舒服。
         */

        if (
            !isIOS &&
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            generate();
        }
    }
);


/* ============================================================
   Auto resize textarea
============================================================ */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                130
            ) + "px";
    }
);


/* ============================================================
   iOS visibility handling
============================================================ */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            /*
             * 不在背景執行新的工作。
             */

            console.log(
                "Page hidden"
            );
        }
    }
);


/* ============================================================
   Prevent accidental unload during loading
============================================================ */

window.addEventListener(
    "beforeunload",
    event => {

        if (isLoading) {

            event.preventDefault();

            event.returnValue = "";
        }
    }
);


/* ============================================================
   Startup
============================================================ */

(async function startup() {

    if (!navigator.gpu) {

        setStatus(
            "目前瀏覽器沒有 WebGPU，請使用支援 WebGPU 的 Safari。"
        );

        return;
    }


    if (isIOS) {

        setStatus(
            "iPhone 模式：建議使用 Qwen 2.5 0.5B。"
        );

    } else {

        setStatus(
            "WebGPU 可用，請選擇模型後按「載入」。"
        );
    }

})();
</script>

</body>
</html>
