<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>V7 · Qwen GPU Initialization Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111827;
  color: #f9fafb;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}

main {
  width: min(760px, 100%);
  margin: auto;
  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    calc(30px + env(safe-area-inset-bottom));
}

h1 {
  font-size: 22px;
  margin: 0 0 6px;
}

.sub {
  color: #9ca3af;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.card {
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 11px;
  padding: 13px 14px;
  margin-top: 9px;
  background: #374151;
  color: white;
  font-size: 15px;
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .45;
}

button.primary {
  background: #2563eb;
}

button.danger {
  background: #7f1d1d;
}

.status {
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}

.log {
  background: #030712;
  border-radius: 10px;
  padding: 12px;
  min-height: 220px;
  max-height: 420px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  line-height: 1.55;
}

.ok {
  color: #86efac;
}

.warn {
  color: #fcd34d;
}

.err {
  color: #fca5a5;
}

.small {
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.5;
}
</style>
</head>

<body>

<main>

  <h1>V7 · Qwen 0.5B GPU Initialization Test</h1>

  <div class="sub">
    iPhone / Safari 專用診斷版。<br>
    這一版故意不建立聊天介面、不載入 Gemma、不使用 Blob、
    IndexedDB、Cache API。
  </div>

  <div class="card">
    <div class="status" id="status">
等待測試。
    </div>

    <button id="gpuBtn" class="primary">
      ① GPU 診斷
    </button>

    <button id="downloadBtn">
      ② 下載 Qwen 0.5B
    </button>

    <button id="initBtn" disabled>
      ③ 初始化 Qwen GPU
    </button>

    <button id="remoteBtn">
      ④ 直接測試 Hugging Face 初始化
    </button>

    <button id="clearBtn" class="danger">
      清除本次診斷狀態
    </button>
  </div>

  <div class="card">
    <div class="small">
      最後執行紀錄
    </div>

    <div id="log" class="log"></div>
  </div>

</main>

<script type="module">

/* =========================================================
   V7
   ========================================================= */

const MP_VERSION = "0.10.29";

const WASM_URL =
  `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VERSION}/wasm`;

const MP_MODULE_URL =
  `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VERSION}/+esm`;

/*
 * Qwen 0.5B
 * 約 547 MB
 */
const QWEN_URL =
  "https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/" +
  "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task";

const OPFS_NAME = "v7-qwen-05b.task";

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

const gpuBtn = document.getElementById("gpuBtn");
const downloadBtn = document.getElementById("downloadBtn");
const initBtn = document.getElementById("initBtn");
const remoteBtn = document.getElementById("remoteBtn");
const clearBtn = document.getElementById("clearBtn");

let LlmInference = null;
let FilesetResolver = null;

let llm = null;
let genai = null;

let initialized = false;


/* =========================================================
   LOG
   ========================================================= */

function now() {
  return new Date().toLocaleTimeString();
}

function log(msg, type = "") {

  const line =
    `[${now()}] ${msg}`;

  const div = document.createElement("div");
  div.textContent = line;

  if (type === "ok") {
    div.className = "ok";
  }

  if (type === "warn") {
    div.className = "warn";
  }

  if (type === "err") {
    div.className = "err";
  }

  logEl.appendChild(div);

  logEl.scrollTop = logEl.scrollHeight;

  console.log(line);
}


function status(msg) {
  statusEl.textContent = msg;
}


function fail(msg) {
  status(msg);
  log(msg, "err");
}


/* =========================================================
   CRASH MARKER
   ========================================================= */

const CRASH_KEY = "v7_qwen_init_in_progress";

function markInitStart(mode) {

  try {

    localStorage.setItem(
      CRASH_KEY,
      JSON.stringify({
        mode,
        time: Date.now()
      })
    );

  } catch (_) {}
}


function markInitDone() {

  try {
    localStorage.removeItem(CRASH_KEY);
  } catch (_) {}
}


function checkPreviousCrash() {

  try {

    const raw =
      localStorage.getItem(CRASH_KEY);

    if (!raw) return;

    const data = JSON.parse(raw);

    const age =
      Date.now() - Number(data.time || 0);

    if (age < 30 * 60 * 1000) {

      status(
        "⚠️ 偵測到上一輪 Safari 可能在初始化期間被終止。\n" +
        `上一輪模式：${data.mode}\n` +
        "如果你剛剛看到 Safari 整頁重新載入，這個標記就是用來確認該情況。"
      );

      log(
        `上一輪初始化沒有正常完成：${data.mode}`,
        "warn"
      );
    }

  } catch (_) {}
}


/* =========================================================
   LOAD MEDIAPIPE
   ========================================================= */

async function loadMediaPipe() {

  if (LlmInference && FilesetResolver) {
    return;
  }

  log(
    `載入 @mediapipe/tasks-genai@${MP_VERSION} ...`
  );

  status(
    "正在載入 MediaPipe Tasks GenAI..."
  );

  try {

    const mod =
      await import(MP_MODULE_URL);

    FilesetResolver =
      mod.FilesetResolver;

    LlmInference =
      mod.LlmInference;

    if (!FilesetResolver ||
        !LlmInference) {

      throw new Error(
        "MediaPipe module 載入成功，但找不到 FilesetResolver / LlmInference"
      );
    }

    log(
      "MediaPipe JS module ✓",
      "ok"
    );

  } catch (err) {

    fail(
      "MediaPipe module 載入失敗\n\n" +
      String(err?.stack || err)
    );

    throw err;
  }
}


/* =========================================================
   GPU TEST
   ========================================================= */

gpuBtn.onclick = async () => {

  gpuBtn.disabled = true;

  try {

    log("開始 WebGPU 診斷...");
    status("正在檢查 WebGPU...");

    if (!("gpu" in navigator)) {

      throw new Error(
        "navigator.gpu 不存在"
      );
    }

    log("navigator.gpu ✓", "ok");

    const adapter =
      await navigator.gpu.requestAdapter();

    if (!adapter) {

      throw new Error(
        "requestAdapter() 回傳 null"
      );
    }

    log("GPU Adapter ✓", "ok");

    const limits =
      adapter.limits;

    log(
      "maxStorageBufferBindingSize = " +
      formatBytes(limits.maxStorageBufferBindingSize)
    );

    log(
      "maxBufferSize = " +
      formatBytes(limits.maxBufferSize)
    );

    const features =
      Array.from(adapter.features || []);

    log(
      "Features:\n" +
      (features.length
        ? features.join(", ")
        : "(none)")
    );

    /*
     * 故意不呼叫 adapter.requestAdapterInfo()
     *
     * Safari/WebKit 某些版本可能沒有正常提供
     * requestAdapterInfo()。
     */

    status(
      "✓ WebGPU 基本診斷通過\n\n" +
      "下一步可以按「下載 Qwen 0.5B」。"
    );

    log(
      "GPU 基本檢查完成 ✓",
      "ok"
    );

  } catch (err) {

    fail(
      "WebGPU 診斷失敗\n\n" +
      String(err?.stack || err)
    );

  } finally {

    gpuBtn.disabled = false;
  }
};


/* =========================================================
   FORMAT BYTES
   ========================================================= */

function formatBytes(n) {

  if (!Number.isFinite(n)) {
    return "unknown";
  }

  const gb =
    n / 1024 / 1024 / 1024;

  if (gb >= 1) {
    return gb.toFixed(2) + " GB";
  }

  return (
    n / 1024 / 1024
  ).toFixed(1) + " MB";
}


/* =========================================================
   OPFS
   ========================================================= */

async function getOPFSFile() {

  if (!("storage" in navigator) ||
      !navigator.storage.getDirectory) {

    throw new Error(
      "這個 Safari 不支援 OPFS"
    );
  }

  const root =
    await navigator.storage.getDirectory();

  return await root.getFileHandle(
    OPFS_NAME,
    { create: false }
  );
}


async function getOrCreateOPFSFile() {

  const root =
    await navigator.storage.getDirectory();

  return await root.getFileHandle(
    OPFS_NAME,
    { create: true }
  );
}


/* =========================================================
   CHECK LOCAL MODEL
   ========================================================= */

async function checkLocalModel() {

  try {

    const handle =
      await getOPFSFile();

    const file =
      await handle.getFile();

    if (file.size > 100 * 1024 * 1024) {

      log(
        "本地 Qwen 模型存在：" +
        formatBytes(file.size),
        "ok"
      );

      return true;
    }

  } catch (_) {}

  return false;
}


/* =========================================================
   DOWNLOAD
   ========================================================= */

downloadBtn.onclick = async () => {

  downloadBtn.disabled = true;

  try {

    status(
      "正在下載 Qwen 0.5B...\n" +
      "請不要切換 App。"
    );

    log("開始下載 Qwen 0.5B...");
    log(QWEN_URL);

    const response =
      await fetch(QWEN_URL, {
        cache: "no-store"
      });

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status} ${response.statusText}`
      );
    }

    if (!response.body) {

      throw new Error(
        "response.body 不存在，無法串流下載"
      );
    }

    const total =
      Number(
        response.headers.get("content-length") || 0
      );

    log(
      "HTTP response ✓" +
      (total
        ? `，Content-Length ${formatBytes(total)}`
        : "")
    );

    const handle =
      await getOrCreateOPFSFile();

    const writable =
      await handle.createWritable();

    const reader =
      response.body.getReader();

    let received = 0;
    let lastShown = 0;

    try {

      while (true) {

        const {
          done,
          value
        } = await reader.read();

        if (done) break;

        if (!value) continue;

        await writable.write(value);

        received += value.byteLength;

        const mb =
          received / 1024 / 1024;

        if (
          mb - lastShown >= 10 ||
          received === value.byteLength
        ) {

          lastShown = mb;

          const percent =
            total
              ? ` ${((received / total) * 100).toFixed(1)}%`
              : "";

          status(
            `正在下載 Qwen 0.5B...\n` +
            `${mb.toFixed(1)} MB${percent}`
          );
        }
      }

      await writable.close();

    } catch (err) {

      try {
        await writable.abort();
      } catch (_) {}

      throw err;
    }

    const file =
      await handle.getFile();

    log(
      `下載完成：${formatBytes(file.size)}`,
      "ok"
    );

    if (file.size < 100 * 1024 * 1024) {

      throw new Error(
        "模型檔案異常地小，可能沒有下載完整"
      );
    }

    initBtn.disabled = false;

    status(
      "✓ Qwen 已下載完成\n\n" +
      "現在可以按「③ 初始化 Qwen GPU」。"
    );

  } catch (err) {

    fail(
      "下載失敗\n\n" +
      String(err?.stack || err)
    );

  } finally {

    downloadBtn.disabled = false;
  }
};


/* =========================================================
   INITIALIZE LOCAL OPFS MODEL
   ========================================================= */

initBtn.onclick = async () => {

  if (initialized) {

    status(
      "Qwen 已經初始化成功。"
    );

    return;
  }

  initBtn.disabled = true;
  remoteBtn.disabled = true;
  downloadBtn.disabled = true;
  gpuBtn.disabled = true;

  markInitStart("local-opfs");

  try {

    log("========== LOCAL INIT ==========");
    log("STEP 1 / 5：載入 MediaPipe");

    status(
      "初始化 1 / 5\n" +
      "載入 MediaPipe..."
    );

    await loadMediaPipe();

    log(
      "STEP 1 OK",
      "ok"
    );


    /* -----------------------------------------------------
       STEP 2
       ----------------------------------------------------- */

    log("STEP 2 / 5：建立 GenAI Fileset");

    status(
      "初始化 2 / 5\n" +
      "建立 GenAI Fileset..."
    );

    genai =
      await FilesetResolver.forGenAiTasks(
        WASM_URL
      );

    log(
      "STEP 2 OK：GenAI Fileset",
      "ok"
    );


    /* -----------------------------------------------------
       STEP 3
       ----------------------------------------------------- */

    log("STEP 3 / 5：取得 OPFS Qwen 檔案");

    status(
      "初始化 3 / 5\n" +
      "開啟 OPFS Qwen 模型..."
    );

    const handle =
      await getOPFSFile();

    const file =
      await handle.getFile();

    log(
      "Qwen file = " +
      formatBytes(file.size),
      "ok"
    );


    /* -----------------------------------------------------
       STEP 4
       ----------------------------------------------------- */

    log(
      "STEP 4 / 5：建立 model stream reader"
    );

    status(
      "初始化 4 / 5\n" +
      "建立模型串流...\n\n" +
      "下一步會進入 LiteRT / GPU 初始化。\n" +
      "這是本次測試最重要的步驟。"
    );

    /*
     * MediaPipe 官方 JS sample 使用的方式：
     *
     * const modelStream =
     *   file.stream().getReader();
     *
     * modelAssetBuffer:
     *   modelStream
     *
     * 不把整個模型轉成 ArrayBuffer。
     */
    const reader =
      file.stream().getReader();

    log(
      "ReadableStreamDefaultReader ✓",
      "ok"
    );


    /* -----------------------------------------------------
       STEP 5
       ----------------------------------------------------- */

    log(
      "STEP 5 / 5：開始 LlmInference.createFromOptions()"
    );

    log(
      "⚠️ 現在進入 LiteRT / WebGPU 初始化..."
    );

    status(
      "初始化 5 / 5\n\n" +
      "正在建立 Qwen 0.5B GPU LLM...\n\n" +
      "如果 Safari 在這裡整頁重新載入，" +
      "就代表 crash 發生在這個 native/WASM/GPU 路徑。"
    );

    /*
     * 重要：
     *
     * 不使用 Blob
     * 不使用 ObjectURL
     * 不使用 ArrayBuffer
     * 不使用 IndexedDB
     * 不使用 Cache API
     *
     * 直接把 OPFS file stream reader
     * 交給 MediaPipe。
     */

    llm =
      await LlmInference.createFromOptions(
        genai,
        {
          baseOptions: {
            modelAssetBuffer: reader,
            delegate: "GPU"
          },

          /*
           * 故意壓低，避免初始化後
           * KV cache 再增加太多記憶體。
           */
          maxTokens: 64,

          topK: 1,

          temperature: 0.0,

          randomSeed: 1
        }
      );


    /* -----------------------------------------------------
       SUCCESS
       ----------------------------------------------------- */

    initialized = true;

    markInitDone();

    log(
      "========== INITIALIZATION SUCCESS ==========",
      "ok"
    );

    status(
      "🎉 Qwen 0.5B GPU 初始化成功！\n\n" +
      "這代表：\n" +
      "✓ MediaPipe\n" +
      "✓ WASM\n" +
      "✓ model stream\n" +
      "✓ LiteRT\n" +
      "✓ WebGPU delegate\n" +
      "至少已經成功完成初始化。"
    );

  } catch (err) {

    markInitDone();

    /*
     * 注意：
     *
     * 如果 Safari 整頁直接重載，
     * JavaScript 不會有機會跑到這裡。
     *
     * 所以這個 catch 只負責真正的 JS exception。
     */

    fail(
      "Qwen 初始化 JavaScript 例外\n\n" +
      String(err?.stack || err)
    );

  } finally {

    initBtn.disabled = initialized;
    remoteBtn.disabled = false;
    downloadBtn.disabled = false;
    gpuBtn.disabled = false;
  }
};


/* =========================================================
   REMOTE TEST
   ========================================================= */

remoteBtn.onclick = async () => {

  remoteBtn.disabled = true;
  initBtn.disabled = true;
  downloadBtn.disabled = true;
  gpuBtn.disabled = true;

  markInitStart("remote-url");

  try {

    log("========== REMOTE URL TEST ==========");

    status(
      "Remote 測試\n\n" +
      "這次不使用 OPFS。\n" +
      "直接把 Hugging Face URL 交給 MediaPipe。"
    );

    await loadMediaPipe();

    log(
      "建立 GenAI Fileset..."
    );

    genai =
      await FilesetResolver.forGenAiTasks(
        WASM_URL
      );

    log(
      "GenAI Fileset ✓",
      "ok"
    );

    log(
      "開始 createFromModelPath()..."
    );

    log(
      "⚠️ 如果 Safari 在這裡整頁重載，" +
      "就可以排除 OPFS stream 本身。"
    );

    status(
      "Remote 測試\n\n" +
      "正在直接初始化 Qwen URL..."
    );

    llm =
      await LlmInference.createFromModelPath(
        genai,
        QWEN_URL
      );

    initialized = true;

    markInitDone();

    log(
      "Remote initialization SUCCESS",
      "ok"
    );

    status(
      "🎉 Remote Qwen 初始化成功！\n\n" +
      "這代表 MediaPipe + LiteRT + GPU 路徑本身可以工作。\n\n" +
      "如果 Local OPFS 失敗、Remote 成功，" +
      "下一版就應該只處理本地模型供應方式。"
    );

  } catch (err) {

    markInitDone();

    fail(
      "Remote 初始化 JS error\n\n" +
      String(err?.stack || err)
    );

  } finally {

    remoteBtn.disabled = false;
    initBtn.disabled = initialized;
    downloadBtn.disabled = false;
    gpuBtn.disabled = false;
  }
};


/* =========================================================
   CLEAR
   ========================================================= */

clearBtn.onclick = () => {

  try {
    localStorage.removeItem(CRASH_KEY);
  } catch (_) {}

  logEl.innerHTML = "";

  initialized = false;
  llm = null;
  genai = null;

  initBtn.disabled = true;

  status(
    "診斷狀態已清除。\n\n" +
    "請重新依序：\n" +
    "① GPU 診斷\n" +
    "② 下載 Qwen\n" +
    "③ 初始化 Qwen GPU"
  );

  log(
    "V7 reset"
  );
};


/* =========================================================
   STARTUP
   ========================================================= */

checkPreviousCrash();

(async () => {

  try {

    const exists =
      await checkLocalModel();

    if (exists) {

      initBtn.disabled = false;

      if (
        !statusEl.textContent ||
        statusEl.textContent === "等待測試。"
      ) {

        status(
          "偵測到 Qwen 0.5B 已存在於 OPFS。\n\n" +
          "可以直接按「③ 初始化 Qwen GPU」。"
        );
      }

    } else {

      if (
        !statusEl.textContent ||
        statusEl.textContent === "等待測試。"
      ) {

        status(
          "V7 就緒。\n\n" +
          "建議先按「① GPU 診斷」。"
        );
      }
    }

  } catch (err) {

    log(
      "啟動檢查失敗：" +
      String(err)
    );
  }

})();

</script>

</body>
</html>
