<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#0b1020">

<title>iPhone Lite LLM Chat V5</title>

<style>

:root {
  --bg: #0b1020;
  --panel: #111827;
  --panel2: #182235;
  --border: #29354a;
  --text: #eef2ff;
  --muted: #9ca3af;
  --blue: #60a5fa;
  --green: #22c55e;
  --yellow: #f59e0b;
  --red: #ef4444;
  --user: #2563eb;
  --assistant: #1f2937;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body {
  overflow: hidden;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
  border: 0;
  border-radius: 10px;
  padding: 10px 12px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .42;
  cursor: not-allowed;
}

button.primary {
  background: var(--blue);
  color: #07111f;
}

button.secondary {
  background: #263247;
  color: var(--text);
}

button.danger {
  background: var(--red);
  color: white;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  outline: none;
}

input,
select {
  padding: 10px 11px;
}

textarea {
  padding: 11px 12px;
  min-height: 48px;
  max-height: 140px;
  resize: none;
  line-height: 1.45;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--blue);
}

.app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  flex: 0 0 auto;
  padding:
    calc(env(safe-area-inset-top) + 12px)
    14px
    12px;

  border-bottom: 1px solid var(--border);
  background: rgba(11, 16, 32, .97);
}

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.title {
  font-size: 17px;
  font-weight: 800;
}

.badge {
  font-size: 10px;
  color: var(--muted);
  background: #172033;
  padding: 4px 8px;
  border-radius: 999px;
}

.controls {
  margin-top: 10px;
  display: grid;
  gap: 8px;
}

.row {
  display: flex;
  gap: 8px;
}

.row > * {
  flex: 1;
}

.status {
  margin-top: 9px;
  min-height: 18px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.status.success {
  color: var(--green);
}

.status.warning {
  color: var(--yellow);
}

.status.error {
  color: #fca5a5;
}

.progress-wrap {
  display: none;
  margin-top: 7px;
}

.progress-wrap.show {
  display: block;
}

progress {
  width: 100%;
  height: 7px;
}

.progress-text {
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
}

.diagnostic {
  margin-top: 9px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #0e1525;
  font-size: 11px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.diagnostic.good {
  border-color: #1c5934;
}

.diagnostic.warn {
  border-color: #654b15;
}

.diagnostic.bad {
  border-color: #693030;
}

.hidden {
  display: none !important;
}

.chat {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px;
}

.message {
  display: flex;
  margin-bottom: 12px;
}

.message.user {
  justify-content: flex-end;
}

.message.system {
  justify-content: center;
}

.bubble {
  max-width: 88%;
  padding: 10px 12px;
  border-radius: 14px;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.55;
  font-size: 15px;
}

.message.user .bubble {
  background: var(--user);
  color: white;
  border-bottom-right-radius: 5px;
}

.message.assistant .bubble {
  background: var(--assistant);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
}

.message.system .bubble {
  max-width: 95%;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.composer {
  flex: 0 0 auto;
  padding:
    10px
    12px
    calc(env(safe-area-inset-bottom) + 10px);

  background: rgba(11,16,32,.98);
  border-top: 1px solid var(--border);
}

.composer-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.composer-row button:first-child {
  flex: 1;
}

.small {
  font-size: 11px;
  color: var(--muted);
}

@media (min-width: 700px) {

  header {
    padding-left: 24px;
    padding-right: 24px;
  }

  .chat {
    padding-left: 24px;
    padding-right: 24px;
  }

  .composer {
    padding-left: 24px;
    padding-right: 24px;
  }

  .bubble {
    max-width: 75%;
  }

</head>

<body>

<div class="app">

<header>

  <div class="title-row">

    <div class="title">
      📱 iPhone Lite LLM V5
    </div>

    <div class="badge">
      WebGPU Safe Init

  <div class="controls">

<main

></main>


<div class="composer">

    autocorrect="on"

  <div class="composer-row">

    <button
      id="sendBtn"
      class="primary"

      送出
    </button>

    <button
      id="stopBtn"
      class="danger"
      disabled

      停止
    </button>

    <button
      id="clearBtn"

      清除
    </button>

</div>

</div>


<script type="module">


/* =========================================================
   MediaPipe
   ========================================================= */

import {
  FilesetResolver,
  LlmInference
} from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.35/+esm";


/* =========================================================
   Models
   ========================================================= */

const MODELS = {

  qwen: {

    id: "qwen",

    name: "Qwen 2.5 0.5B",

    fileName:
      "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

    url:
      "https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

    /*
     * Current repository file is about 547 MB.
     */
    sizeMB: 547,

    maxTokens: 64,

    topK: 20,

    temperature: 0.7
  },


  gemma: {

    id: "gemma",

    name: "Gemma 3 1B",

    /*
     * Current repository:
     * Gemma3-1B-IT_multi-prefill-seq_q4_ekv2048.task
     *
     * About 555 MB.
     */
    fileName:
      "Gemma3-1B-IT_multi-prefill-seq_q4_ekv2048.task",

    url:
      "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/Gemma3-1B-IT_multi-prefill-seq_q4_ekv2048.task",

    sizeMB: 555,

    maxTokens: 64,

    topK: 20,

    temperature: 0.7
  }

};


/* =========================================================
   DOM
   ========================================================= */

const modelSelect =
  document.getElementById(
    "modelSelect"
  );

const hfToken =
  document.getElementById(
    "hfToken"
  );

const downloadBtn =
  document.getElementById(
    "downloadBtn"
  );

const diagnoseBtn =
  document.getElementById(
    "diagnoseBtn"
  );

const initBtn =
  document.getElementById(
    "initBtn"
  );

const sendBtn =
  document.getElementById(
    "sendBtn"
  );

const stopBtn =
  document.getElementById(
    "stopBtn"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );

const promptInput =
  document.getElementById(
    "prompt"
  );

const chat =
  document.getElementById(
    "chat"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const progressWrap =
  document.getElementById(
    "progressWrap"
  );

const progress =
  document.getElementById(
    "progress"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const diagnostic =
  document.getElementById(
    "diagnostic"
  );


/* =========================================================
   State
   ========================================================= */

let currentModelId =
  "qwen";

let llm =
  null;

let fileset =
  null;

let gpuReport =
  null;

let initializing =
  false;

let generating =
  false;

let currentReader =
  null;


/* =========================================================
   Session crash marker
   ========================================================= */

const INIT_MARKER =
  "llm_v5_init_started";

const INIT_MODEL =
  "llm_v5_init_model";


function markInit(
  modelId
) {

  try {

    sessionStorage.setItem(
      INIT_MARKER,
      "1"
    );

    sessionStorage.setItem(
      INIT_MODEL,
      modelId
    );

  } catch (_) {}

}


function clearInitMarker() {

  try {

    sessionStorage.removeItem(
      INIT_MARKER
    );

    sessionStorage.removeItem(
      INIT_MODEL
    );

  } catch (_) {}

}


function checkPreviousCrash() {

  try {

    const marker =
      sessionStorage.getItem(
        INIT_MARKER
      );

    if (!marker) {
      return;
    }

    const model =
      sessionStorage.getItem(
        INIT_MODEL
      ) || "unknown";

    diagnostic.classList.remove(
      "hidden"
    );

    diagnostic.className =
      "diagnostic warn";

    diagnostic.textContent =
      "⚠️ 上一次頁面是在模型初始化階段中斷。\n\n" +
      `模型：${model}\n\n` +
      "如果 Safari 是直接重新載入，而不是顯示 JavaScript error，" +
      "代表錯誤可能發生在 WASM / WebGPU / GPU process 層級，" +
      "一般 try/catch 不一定能攔截。";

  } catch (_) {}

}


/* =========================================================
   UI
   ========================================================= */

function setStatus(
  text,
  type = ""
) {

  statusEl.textContent =
    text;

  statusEl.className =
    "status" +
    (
      type
        ? ` ${type}`
        : ""
    );

}


function addMessage(
  role,
  text
) {

  const row =
    document.createElement(
      "div"
    );

  row.className =
    `message ${role}`;

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  row.appendChild(
    bubble
  );

  chat.appendChild(
    row
  );

  chat.scrollTop =
    chat.scrollHeight;

  return bubble;
}


function updateAssistant(
  bubble,
  text
) {

  bubble.textContent =
    text;

  chat.scrollTop =
    chat.scrollHeight;

}


function formatBytes(
  bytes
) {

  if (
    !Number.isFinite(bytes)
  ) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  let value =
    bytes;

  let index =
    0;

  while (
    value >= 1024 &&
    index < units.length - 1
  ) {

    value /= 1024;
    index++;

  }

  return (
    value.toFixed(
      index === 0
        ? 0
        : 1
    )
    +
    " "
    +
    units[index]
  );

}


/* =========================================================
   OPFS
   ========================================================= */

async function getRoot() {

  if (
    !navigator.storage ||
    !navigator.storage.getDirectory
  ) {

    throw new Error(
      "此 Safari 不支援 OPFS。"
    );

  }

  return (
    await navigator.storage.getDirectory()
  );

}


async function getHandle(
  model
) {

  const root =
    await getRoot();

  return (
    await root.getFileHandle(
      model.fileName,
      {
        create: false
      }
    )
  );

}


async function exists(
  model
) {

  try {

    await getHandle(
      model
    );

    return true;

  } catch (_) {

    return false;

  }

}


async function storedSize(
  model
) {

  try {

    const handle =
      await getHandle(
        model
      );

    const file =
      await handle.getFile();

    return file.size;

  } catch (_) {

    return 0;

  }

}


/* =========================================================
   Download
   ========================================================= */

async function downloadModel(
  model
) {

  const root =
    await getRoot();

  const handle =
    await root.getFileHandle(
      model.fileName,
      {
        create: true
      }
    );

  const writable =
    await handle.createWritable();

  try {

    const headers = {};

    const token =
      hfToken.value.trim();

    if (
      model.id === "gemma" &&
      token
    ) {

      headers.Authorization =
        `Bearer ${token}`;

    }

    const response =
      await fetch(
        model.url,
        {
          headers,
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    if (!response.body) {

      throw new Error(
        "瀏覽器沒有提供下載串流。"
      );

    }

    const total =
      Number(
        response.headers.get(
          "content-length"
        )
      ) || 0;

    const reader =
      response.body.getReader();

    let received =
      0;

    while (true) {

      const {
        value,
        done
      } =
        await reader.read();

      if (done) {
        break;
      }

      if (!value) {
        continue;
      }

      await writable.write(
        value
      );

      received +=
        value.byteLength;

      if (total > 0) {

        const pct =
          (
            received /
            total
          ) * 100;

        progress.value =
          Math.min(
            100,
            pct
          );

        progressText.textContent =
          `${formatBytes(received)} / ${formatBytes(total)}`;

      } else {

        progressText.textContent =
          `已下載 ${formatBytes(received)}`;

      }

    }

    await writable.close();

    return received;

  } catch (error) {

    try {
      await writable.abort();
    } catch (_) {}

    try {
      await root.removeEntry(
        model.fileName
      );
    } catch (_) {}

    throw error;

  }

}


/* =========================================================
   WebGPU diagnostics
   ========================================================= */

async function diagnoseWebGPU() {

  diagnostic.classList.remove(
    "hidden"
  );

  diagnostic.className =
    "diagnostic";

  diagnostic.textContent =
    "正在檢查 WebGPU...";

  gpuReport =
    null;

  if (
    !("gpu" in navigator)
  ) {

    gpuReport = {
      ok: false,
      reason:
        "navigator.gpu 不存在"
    };

    diagnostic.className =
      "diagnostic bad";

    diagnostic.textContent =
      "❌ WebGPU 不存在\n\n" +
      "這個頁面無法安全啟動 MediaPipe GPU LLM。";

    return gpuReport;

  }


  let adapter;

  try {

    adapter =
      await navigator.gpu.requestAdapter({
        powerPreference:
          "low-power"
      });

  } catch (error) {

    gpuReport = {
      ok: false,
      reason:
        error?.message ||
        String(error)
    };

    diagnostic.className =
      "diagnostic bad";

    diagnostic.textContent =
      "❌ WebGPU Adapter 建立失敗\n\n" +
      gpuReport.reason;

    return gpuReport;

  }


  if (!adapter) {

    gpuReport = {
      ok: false,
      reason:
        "requestAdapter() 回傳 null"
    };

    diagnostic.className =
      "diagnostic bad";

    diagnostic.textContent =
      "❌ 找不到 WebGPU Adapter";

    return gpuReport;

  }


  const limits =
    adapter.limits;

  const maxStorage =
    Number(
      limits.maxStorageBufferBindingSize
    ) || 0;

  const maxBuffer =
    Number(
      limits.maxBufferSize
    ) || 0;


  const storageMB =
    maxStorage /
    1024 /
    1024;

  const bufferMB =
    maxBuffer /
    1024 /
    1024;


  const features =
    Array.from(
      adapter.features || []
    );


  /*
   * This is a conservative safety gate.
   *
   * We don't claim this is an exact model-specific
   * requirement. It simply avoids entering the
   * LLM initialization path on adapters that clearly
   * expose a very small storage-buffer limit.
   */
  const SAFE_MIN_STORAGE =
    512 *
    1024 *
    1024;


  const storageOK =
    maxStorage >=
    SAFE_MIN_STORAGE;


  gpuReport = {

    ok:
      storageOK,

    adapter,

    maxStorage,

    maxBuffer,

    storageMB,

    bufferMB,

    features,

    reason:
      storageOK
        ? "WebGPU capability passed safety gate."
        : "maxStorageBufferBindingSize 太小。"

  };


  let text =
    "📱 WebGPU 診斷\n\n";

  text +=
    "WebGPU：✓\n";

  text +=
    `maxStorageBufferBindingSize：${formatBytes(maxStorage)}\n`;

  text +=
    `maxBufferSize：${formatBytes(maxBuffer)}\n`;

  text +=
    `安全檢查門檻：${formatBytes(SAFE_MIN_STORAGE)}\n`;

  text +=
    `Features：${features.length ? features.join(", ") : "無法取得"}\n\n`;


  if (storageOK) {

    text +=
      "結果：✓ 通過安全初始化檢查\n\n";

    text +=
      "可以嘗試進入 LiteRT / WASM / GPU 初始化。";

    diagnostic.className =
      "diagnostic good";

  } else {

    text +=
      "結果：❌ 不通過安全初始化檢查\n\n";

    text +=
      "為了避免 Safari 在 createFromOptions() 階段直接中斷，" +
      "V5 不會自動啟動模型。";

    diagnostic.className =
      "diagnostic bad";

  }


  diagnostic.textContent =
    text;


  return gpuReport;

}


/* =========================================================
   Load MediaPipe WASM
   ========================================================= */

async function getFileset() {

  if (fileset) {
    return fileset;
  }

  setStatus(
    "載入 MediaPipe WASM..."
  );

  fileset =
    await FilesetResolver.forGenAiTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.35/wasm"
    );

  return fileset;

}


/* =========================================================
   Close LLM
   ========================================================= */

async function closeLLM() {

  if (!llm) {
    return;
  }

  const old =
    llm;

  llm =
    null;

  try {

    if (
      typeof old.close ===
      "function"
    ) {

      old.close();

    }

  } catch (_) {}

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        300
      )
  );

}


/* =========================================================
   Safe initialization
   ========================================================= */

async function initializeModel() {

  if (initializing) {
    return;
  }

  const model =
    MODELS[currentModelId];

  initializing =
    true;

  initBtn.disabled =
    true;

  downloadBtn.disabled =
    true;

  sendBtn.disabled =
    true;


  try {

    /*
     * -------------------------------------------------------
     * STEP 1
     * WebGPU diagnostic
     * -------------------------------------------------------
     */

    setStatus(
      "第一階段：檢查 iPhone WebGPU..."
    );

    const report =
      await diagnoseWebGPU();


    if (!report.ok) {

      setStatus(
        "停止初始化：WebGPU 安全檢查未通過。",
        "warning"
      );

      addMessage(
        "system",
        "⚠️ V5 已阻止 createFromOptions()。\n" +
        "這是刻意的：避免再次讓 Safari 在 GPU / WASM 初始化階段直接中斷。"
      );

      return;

    }


    /*
     * -------------------------------------------------------
     * STEP 2
     * Check OPFS model
     * -------------------------------------------------------
     */

    const existsNow =
      await exists(model);

    if (!existsNow) {

      setStatus(
        "模型尚未下載。",
        "warning"
      );

      return;

    }


    const size =
      await storedSize(model);


    if (
      size <
      100 *
      1024 *
      1024
    ) {

      throw new Error(
        "OPFS 模型檔案大小異常，可能沒有完整下載。"
      );

    }


    /*
     * -------------------------------------------------------
     * STEP 3
     * Release old LLM
     * -------------------------------------------------------
     */

    setStatus(
      "第二階段：釋放舊模型..."
    );

    await closeLLM();


    /*
     * -------------------------------------------------------
     * STEP 4
     * Mark before entering native/WASM path
     * -------------------------------------------------------
     */

    markInit(
      currentModelId
    );


    /*
     * -------------------------------------------------------
     * STEP 5
     * Get OPFS stream
     * -------------------------------------------------------
     */

    setStatus(
      `第三階段：準備 ${model.name} 串流...`
    );

    const handle =
      await getHandle(model);

    const file =
      await handle.getFile();

    const reader =
      file.stream().getReader();

    currentReader =
      reader;


    /*
     * -------------------------------------------------------
     * STEP 6
     * MediaPipe fileset
     * -------------------------------------------------------
     */

    const genaiFileset =
      await getFileset();


    /*
     * Give Safari one event-loop turn.
     */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          250
        )
    );


    /*
     * -------------------------------------------------------
     * STEP 7
     * IMPORTANT
     *
     * No:
     *   Blob
     *   ObjectURL
     *   arrayBuffer()
     *   chunks[]
     *
     * Direct:
     *   OPFS -> ReadableStreamDefaultReader
     *          -> modelAssetBuffer
     * -------------------------------------------------------
     */

    setStatus(
      `第四階段：初始化 ${model.name} GPU...`
    );


    const newLLM =
      await LlmInference.createFromOptions(
        genaiFileset,
        {

          baseOptions: {

            modelAssetBuffer:
              reader,

            delegate:
              "GPU"

          },

          /*
           * Keep this deliberately small.
           *
           * It mainly affects generation rather
           * than model loading, but keeps runtime
           * memory conservative.
           */
          maxTokens:
            model.maxTokens,

          topK:
            model.topK,

          temperature:
            model.temperature,

          randomSeed:
            42

        }
      );


    /*
     * -------------------------------------------------------
     * SUCCESS
     * -------------------------------------------------------
     */

    llm =
      newLLM;

    currentReader =
      null;

    clearInitMarker();

    setStatus(
      `${model.name} 初始化成功，可以聊天。`,
      "success"
    );

    addMessage(
      "system",
      `✓ ${model.name} 初始化成功。`
    );

    sendBtn.disabled =
      false;


  } catch (error) {

    currentReader =
      null;

    console.error(
      "V5 initialization error:",
      error
    );


    /*
     * IMPORTANT:
     *
     * If Safari/WebKit process itself dies,
     * execution may never reach this catch.
     *
     * If we arrive here, it was a JS/WASM
     * rejection that can be displayed.
     */

    const message =
      error?.message ||
      String(error);


    setStatus(
      `初始化失敗：${message}`,
      "error"
    );


    diagnostic.classList.remove(
      "hidden"
    );

    diagnostic.className =
      "diagnostic bad";

    diagnostic.textContent +=
      "\n\n初始化錯誤：\n" +
      message;


    addMessage(
      "system",
      "❌ LiteRT 初始化失敗。\n\n" +
      message
    );


  } finally {

    initializing =
      false;

    downloadBtn.disabled =
      false;

    initBtn.disabled =
      !!llm;

  }

}


/* =========================================================
   Download
   ========================================================= */

downloadBtn.addEventListener(
  "click",
  async () => {

    const model =
      MODELS[currentModelId];

    downloadBtn.disabled =
      true;

    initBtn.disabled =
      true;

    progressWrap.classList.add(
      "show"
    );

    progress.value =
      0;

    progressText.textContent =
      "準備下載...";


    try {

      await closeLLM();

      setStatus(
        `正在下載 ${model.name}...`
      );


      const bytes =
        await downloadModel(
          model
        );


      progress.value =
        100;

      progressText.textContent =
        `${formatBytes(bytes)} 完成`;


      setStatus(
        `${model.name} 下載完成。請先執行 GPU 診斷。`,
        "success"
      );


      addMessage(
        "system",
        `${model.name} 已下載到 OPFS。\n下一步請按「GPU 診斷」。`
      );


      initBtn.disabled =
        true;


    } catch (error) {

      console.error(
        "Download error:",
        error
      );

      setStatus(
        `下載失敗：${error?.message || error}`,
        "error"
      );


    } finally {

      downloadBtn.disabled =
        false;

      setTimeout(
        () => {
          progressWrap.classList.remove(
            "show"
          );
        },
        1200
      );

    }

  }
);


/* =========================================================
   GPU diagnostic button
   ========================================================= */

diagnoseBtn.addEventListener(
  "click",
  async () => {

    diagnoseBtn.disabled =
      true;

    try {

      const report =
        await diagnoseWebGPU();

      const model =
        MODELS[currentModelId];

      if (
        report.ok &&
        await exists(model)
      ) {

        initBtn.disabled =
          false;

        setStatus(
          "WebGPU 通過，模型也已存在，可以初始化。",
          "success"
        );

      } else if (
        report.ok
      ) {

        initBtn.disabled =
          true;

        setStatus(
          "WebGPU 通過，但模型尚未下載。",
          "warning"
        );

      } else {

        initBtn.disabled =
          true;

        setStatus(
          "WebGPU 未通過安全檢查。",
          "warning"
        );

      }

    } finally {

      diagnoseBtn.disabled =
        false;

    }

  }
);


/* =========================================================
   Initialize button
   ========================================================= */

initBtn.addEventListener(
  "click",
  async () => {

    await initializeModel();

  }
);


/* =========================================================
   Model switch
   ========================================================= */

modelSelect.addEventListener(
  "change",
  async () => {

    await closeLLM();

    llm =
      null;

    currentModelId =
      modelSelect.value;


    hfToken.classList.toggle(
      "hidden",
      currentModelId !== "gemma"
    );


    initBtn.disabled =
      true;

    sendBtn.disabled =
      true;


    const model =
      MODELS[currentModelId];


    const existsNow =
      await exists(model);


    if (existsNow) {

      const size =
        await storedSize(model);

      setStatus(
        `${model.name} 已下載 (${formatBytes(size)})。請執行 GPU 診斷。`,
        "success"
      );

    } else {

      setStatus(
        `${model.name} 尚未下載。`
      );

    }

  }
);


/* =========================================================
   Generate
   ========================================================= */

sendBtn.addEventListener(
  "click",
  async () => {

    if (
      !llm ||
      generating
    ) {
      return;
    }


    const text =
      promptInput.value.trim();


    if (!text) {
      return;
    }


    promptInput.value =
      "";


    generating =
      true;


    sendBtn.disabled =
      true;

    stopBtn.disabled =
      false;


    addMessage(
      "user",
      text
    );


    const bubble =
      addMessage(
        "assistant",
        "..."
      );


    let output =
      "";


    try {

      let query;


      if (
        currentModelId ===
        "gemma"
      ) {

        query =
          "<start_of_turn>user\n" +
          text +
          "<end_of_turn>\n" +
          "<start_of_turn>model\n";

      } else {

        query =
          text;

      }


      await new Promise(
        (resolve, reject) => {

          let doneOnce =
            false;


          const finish =
            () => {

              if (doneOnce) {
                return;
              }

              doneOnce =
                true;

              resolve();

            };


          try {

            llm.generateResponse(
              query,
              (
                partial,
                done
              ) => {

                if (partial) {

                  output +=
                    partial;

                  updateAssistant(
                    bubble,
                    output
                  );

                }


                if (done) {
                  finish();
                }

              }
            );

          } catch (error) {

            reject(error);

          }

        }
      );


    } catch (error) {

      const message =
        error?.message ||
        String(error);


      updateAssistant(
        bubble,
        output
          ? `${output}\n\n[錯誤：${message}]`
          : `[錯誤：${message}]`
      );


    } finally {

      generating =
        false;

      sendBtn.disabled =
        !llm;

      stopBtn.disabled =
        true;

    }

  }
);


/* =========================================================
   Stop
   ========================================================= */

stopBtn.addEventListener(
  "click",
  () => {

    if (!llm) {
      return;
    }


    try {

      if (
        typeof llm.cancelProcessing ===
        "function"
      ) {

        llm.cancelProcessing();

      }

    } catch (_) {}


    generating =
      false;

    sendBtn.disabled =
      false;

    stopBtn.disabled =
      true;

    setStatus(
      "已停止生成。"
    );

  }
);


/* =========================================================
   Clear
   ========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    chat.innerHTML =
      "";

  }
);


/* =========================================================
   Keyboard
   ========================================================= */

promptInput.addEventListener(
  "keydown",
  event => {

    if (
      (event.metaKey ||
       event.ctrlKey) &&
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      sendBtn.click();

    }

  }
);


/* =========================================================
   Startup
   ========================================================= */

async function startup() {

  checkPreviousCrash();


  currentModelId =
    modelSelect.value;


  hfToken.classList.add(
    "hidden"
  );


  addMessage(
    "system",
    "V5 啟動。\n" +
    "請先「GPU 診斷」，確認通過後再初始化模型。"
  );


  try {

    const model =
      MODELS[currentModelId];


    const existsNow =
      await exists(model);


    if (existsNow) {

      const size =
        await storedSize(model);


      setStatus(
        `${model.name} 已存在 (${formatBytes(size)})。請執行 GPU 診斷。`,
        "success"
      );

    } else {

      setStatus(
        `${model.name} 尚未下載。`
      );

    }

  } catch (error) {

    setStatus(
      `OPFS 檢查失敗：${error?.message || error}`,
      "error"
    );

  }

}


/* =========================================================
   Start
   ========================================================= */

startup();

</script>
