<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta name="theme-color" content="#111827">

<title>V8 · Qwen 0.5B Safari GPU Diagnostic</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111827;
  color: #f9fafb;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}

main {
  width: min(760px, 100%);
  margin: auto;

  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    calc(30px + env(safe-area-inset-bottom));
}

h1 {
  margin: 0 0 6px;
  font-size: 22px;
}

.subtitle {
  color: #9ca3af;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.card {
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
}

.status {
  white-space: pre-wrap;
  word-break: break-word;

  font-size: 14px;
  line-height: 1.6;
}

button {
  width: 100%;

  border: 0;
  border-radius: 11px;

  padding: 13px 14px;
  margin-top: 9px;

  background: #374151;
  color: white;

  font-size: 15px;
  font-weight: 600;

  -webkit-tap-highlight-color: transparent;
}

button.primary {
  background: #2563eb;
}

button.green {
  background: #166534;
}

button.orange {
  background: #92400e;
}

button.red {
  background: #7f1d1d;
}

button:disabled {
  opacity: .45;
}

.log {
  background: #030712;

  border-radius: 10px;

  padding: 12px;

  min-height: 260px;
  max-height: 500px;

  overflow: auto;

  white-space: pre-wrap;
  word-break: break-word;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  font-size: 12px;
  line-height: 1.55;
}

.ok {
  color: #86efac;
}

.warn {
  color: #fcd34d;
}

.error {
  color: #fca5a5;
}

.info {
  color: #93c5fd;
}

.small {
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.5;
}

.section-title {
  font-weight: 700;
  margin-bottom: 8px;
}

</style>
</head>

<body>

<main>

<h1>V8 · Qwen 0.5B GPU Diagnostic</h1>

<div class="subtitle">
這一版只測 Qwen 0.5B。<br>
不載入 Gemma、不建立聊天、不進行推論。<br>
目的：確認 iPhone Safari 是否能完成 MediaPipe + LiteRT + WebGPU 初始化。
</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div class="card">

  <div class="section-title">
    目前狀態
  </div>

  <div id="status" class="status">
V8 已準備。
  </div>

</div>


<!-- =====================================================
     TEST BUTTONS
===================================================== -->

<div class="card">

  <div class="section-title">
    測試
  </div>

  <button
    id="gpuBtn"
    class="primary"
  >
    ① WebGPU 診斷
  </button>


  <button
    id="mpBtn"
  >
    ② MediaPipe / WASM 診斷
  </button>


  <button
    id="remoteBtn"
    class="green"
  >
    ③ 遠端 Qwen GPU 初始化
  </button>


  <button
    id="localBtn"
    class="orange"
  >
    ④ 本地 OPFS Qwen GPU 初始化
  </button>


  <button
    id="resetBtn"
    class="red"
  >
    清除診斷 Marker
  </button>

</div>


<!-- =====================================================
     LOG
===================================================== -->

<div class="card">

  <div class="section-title">
    診斷紀錄
  </div>

  <div id="log" class="log"></div>

</div>


<!-- =====================================================
     MODEL INFO
===================================================== -->

<div class="card">

  <div class="small">

    MediaPipe:
    @mediapipe/tasks-genai@0.10.29

    <br><br>

    Qwen:
    Qwen2.5-0.5B-Instruct

    <br><br>

    V8 不會自動下載模型。

    <br>

    本地測試需要先從 V7/V8 下載好的 OPFS
    Qwen 模型。

  </div>

</div>


</main>


<script type="module">

/* =========================================================
   CONFIG
========================================================= */

const MP_VERSION = "0.10.29";

const MP_MODULE_URL =
  `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VERSION}/+esm`;

const WASM_URL =
  `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VERSION}/wasm`;


const QWEN_URL =
  "https://huggingface.co/litert-community/" +
  "Qwen2.5-0.5B-Instruct/resolve/main/" +
  "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task";


const OPFS_NAME =
  "v7-qwen-05b.task";


/* =========================================================
   DOM
========================================================= */

const statusEl =
  document.getElementById("status");

const logEl =
  document.getElementById("log");

const gpuBtn =
  document.getElementById("gpuBtn");

const mpBtn =
  document.getElementById("mpBtn");

const remoteBtn =
  document.getElementById("remoteBtn");

const localBtn =
  document.getElementById("localBtn");

const resetBtn =
  document.getElementById("resetBtn");


/* =========================================================
   STATE
========================================================= */

let FilesetResolver = null;
let LlmInference = null;

let genai = null;
let llm = null;


/* =========================================================
   MARKERS
========================================================= */

const MARKER_KEY =
  "v8_init_marker";

const MARKER_TIME =
  "v8_init_time";


/* =========================================================
   LOG
========================================================= */

function timeString() {

  return new Date().toLocaleTimeString();

}


function log(message, type = "") {

  const div =
    document.createElement("div");

  div.textContent =
    `[${timeString()}] ${message}`;

  if (type) {
    div.className = type;
  }

  logEl.appendChild(div);

  logEl.scrollTop =
    logEl.scrollHeight;

  console.log(message);
}


function setStatus(message) {

  statusEl.textContent =
    message;

}


function errorMessage(error) {

  if (!error) {
    return "Unknown error";
  }

  return String(
    error.stack ||
    error.message ||
    error
  );

}


/* =========================================================
   MARKER
========================================================= */

function setMarker(name) {

  try {

    localStorage.setItem(
      MARKER_KEY,
      name
    );

    localStorage.setItem(
      MARKER_TIME,
      String(Date.now())
    );

  } catch (_) {}

}


function clearMarker() {

  try {

    localStorage.removeItem(
      MARKER_KEY
    );

    localStorage.removeItem(
      MARKER_TIME
    );

  } catch (_) {}

}


function showPreviousMarker() {

  try {

    const marker =
      localStorage.getItem(
        MARKER_KEY
      );

    const time =
      localStorage.getItem(
        MARKER_TIME
      );

    if (!marker) {
      return;
    }

    let ageText = "";

    if (time) {

      const age =
        Date.now() -
        Number(time);

      ageText =
        `\n時間：${Math.round(age / 1000)} 秒前`;
    }

    log(
      `⚠️ 偵測到上一輪未完成：${marker}${ageText}`,
      "warn"
    );

    setStatus(
      "⚠️ 上一輪 Safari 可能在這個階段終止：\n\n" +
      marker +
      ageText +
      "\n\n" +
      "請依照按鈕重新測試。"
    );

  } catch (_) {}

}


/* =========================================================
   LOAD MEDIAPIPE
========================================================= */

async function loadMediaPipe() {

  if (
    FilesetResolver &&
    LlmInference
  ) {

    return;
  }


  log(
    `載入 MediaPipe ${MP_VERSION}...`
  );


  const module =
    await import(MP_MODULE_URL);


  FilesetResolver =
    module.FilesetResolver;

  LlmInference =
    module.LlmInference;


  if (
    !FilesetResolver ||
    !LlmInference
  ) {

    throw new Error(
      "找不到 FilesetResolver / LlmInference"
    );
  }


  log(
    "MediaPipe JS module ✓",
    "ok"
  );

}


/* =========================================================
   GPU DIAGNOSTIC
========================================================= */

gpuBtn.onclick = async () => {

  gpuBtn.disabled = true;

  try {

    setStatus(
      "正在檢查 WebGPU..."
    );

    log(
      "========== GPU TEST =========="
    );


    if (
      !navigator.gpu
    ) {

      throw new Error(
        "navigator.gpu 不存在"
      );
    }


    log(
      "navigator.gpu ✓",
      "ok"
    );


    const adapter =
      await navigator.gpu.requestAdapter();


    if (!adapter) {

      throw new Error(
        "requestAdapter() = null"
      );
    }


    log(
      "GPU Adapter ✓",
      "ok"
    );


    const limits =
      adapter.limits;


    log(
      "maxBufferSize = " +
      formatBytes(
        limits.maxBufferSize
      )
    );


    log(
      "maxStorageBufferBindingSize = " +
      formatBytes(
        limits.maxStorageBufferBindingSize
      )
    );


    const features =
      Array.from(
        adapter.features || []
      );


    log(
      "Features:\n" +
      (
        features.length
          ? features.join(", ")
          : "(none)"
      )
    );


    /*
     * 故意不使用：
     *
     * adapter.requestAdapterInfo()
     *
     * 避免 Safari / WebKit 相容性問題。
     */


    setStatus(
      "✓ WebGPU 基本診斷成功。\n\n" +
      "可以繼續測試 ② MediaPipe / WASM。"
    );


    log(
      "GPU TEST PASS ✓",
      "ok"
    );


  } catch (error) {

    setStatus(
      "WebGPU 診斷失敗"
    );

    log(
      errorMessage(error),
      "error"
    );

  } finally {

    gpuBtn.disabled = false;

  }

};


/* =========================================================
   MEDIAPIPE / WASM TEST
========================================================= */

mpBtn.onclick = async () => {

  mpBtn.disabled = true;

  try {

    setStatus(
      "正在測試 MediaPipe / WASM..."
    );


    log(
      "========== MEDIAPIPE TEST =========="
    );


    setMarker(
      "STEP 1 · importing MediaPipe"
    );


    await loadMediaPipe();


    setMarker(
      "STEP 2 · creating GenAI Fileset"
    );


    log(
      "建立 FilesetResolver..."
    );


    genai =
      await FilesetResolver.forGenAiTasks(
        WASM_URL
      );


    clearMarker();


    log(
      "GenAI Fileset ✓",
      "ok"
    );


    setStatus(
      "✓ MediaPipe / WASM 初始化成功。\n\n" +
      "這表示 WASM 本身至少可以啟動。"
    );


    log(
      "MEDIAPIPE TEST PASS ✓",
      "ok"
    );


  } catch (error) {

    clearMarker();


    setStatus(
      "MediaPipe / WASM JS error"
    );


    log(
      errorMessage(error),
      "error"
    );

  } finally {

    mpBtn.disabled = false;

  }

};


/* =========================================================
   REMOTE QWEN TEST
========================================================= */

remoteBtn.onclick = async () => {

  remoteBtn.disabled = true;

  gpuBtn.disabled = true;
  mpBtn.disabled = true;
  localBtn.disabled = true;


  try {

    log(
      "========== REMOTE QWEN TEST =========="
    );


    setStatus(
      "Remote Qwen 測試\n\n" +
      "這次完全不使用 OPFS。\n\n" +
      "直接讓 MediaPipe 從 Hugging Face 載入 Qwen。"
    );


    /* ---------------------------------------------
       STEP A
    --------------------------------------------- */

    setMarker(
      "REMOTE 1 · loading MediaPipe"
    );


    log(
      "REMOTE 1：load MediaPipe"
    );


    await loadMediaPipe();


    log(
      "REMOTE 1 PASS",
      "ok"
    );


    /* ---------------------------------------------
       STEP B
    --------------------------------------------- */

    setMarker(
      "REMOTE 2 · creating GenAI Fileset"
    );


    log(
      "REMOTE 2：create GenAI Fileset"
    );


    genai =
      await FilesetResolver.forGenAiTasks(
        WASM_URL
      );


    log(
      "REMOTE 2 PASS",
      "ok"
    );


    /* ---------------------------------------------
       STEP C
    --------------------------------------------- */

    setMarker(
      "REMOTE 3 · createFromModelPath"
    );


    log(
      "REMOTE 3：即將進入 LlmInference.createFromModelPath()",
      "warn"
    );


    setStatus(
      "⚠️ Remote Qwen GPU 初始化中\n\n" +
      "如果 Safari 現在整頁重新載入，" +
      "代表 crash 發生在 MediaPipe / LiteRT / GPU 路徑。\n\n" +
      "請不要重複按按鈕。"
    );


    /*
     * 官方 README 使用的路徑：
     *
     * LlmInference.createFromModelPath(
     *   genai,
     *   MODEL_URL
     * )
     *
     * 這次不碰 OPFS。
     */


    llm =
      await LlmInference.createFromModelPath(
        genai,
        QWEN_URL
      );


    /* ---------------------------------------------
       SUCCESS
    --------------------------------------------- */

    clearMarker();


    log(
      "REMOTE 4：Qwen LLM 建立成功 ✓",
      "ok"
    );


    setStatus(
      "🎉 Remote Qwen GPU 初始化成功！\n\n" +
      "這是非常重要的結果：\n\n" +
      "✓ MediaPipe\n" +
      "✓ WASM\n" +
      "✓ LiteRT\n" +
      "✓ WebGPU\n" +
      "✓ Qwen 0.5B\n\n" +
      "都已經可以完成初始化。"
    );


  } catch (error) {

    clearMarker();


    setStatus(
      "Remote Qwen 發生 JavaScript error"
    );


    log(
      errorMessage(error),
      "error"
    );


  } finally {

    remoteBtn.disabled = false;

    gpuBtn.disabled = false;
    mpBtn.disabled = false;
    localBtn.disabled = false;

  }

};


/* =========================================================
   LOCAL OPFS TEST
========================================================= */

localBtn.onclick = async () => {

  localBtn.disabled = true;

  gpuBtn.disabled = true;
  mpBtn.disabled = true;
  remoteBtn.disabled = true;


  try {

    log(
      "========== LOCAL OPFS TEST =========="
    );


    setStatus(
      "Local OPFS Qwen 測試\n\n" +
      "這次使用你之前下載好的 Qwen 模型。"
    );


    /* ---------------------------------------------
       STEP A
    --------------------------------------------- */

    setMarker(
      "LOCAL 1 · loading MediaPipe"
    );


    log(
      "LOCAL 1：load MediaPipe"
    );


    await loadMediaPipe();


    log(
      "LOCAL 1 PASS",
      "ok"
    );


    /* ---------------------------------------------
       STEP B
    --------------------------------------------- */

    setMarker(
      "LOCAL 2 · creating GenAI Fileset"
    );


    log(
      "LOCAL 2：create GenAI Fileset"
    );


    genai =
      await FilesetResolver.forGenAiTasks(
        WASM_URL
      );


    log(
      "LOCAL 2 PASS",
      "ok"
    );


    /* ---------------------------------------------
       STEP C
    --------------------------------------------- */

    setMarker(
      "LOCAL 3 · opening OPFS"
    );


    log(
      "LOCAL 3：開啟 OPFS"
    );


    if (
      !navigator.storage ||
      !navigator.storage.getDirectory
    ) {

      throw new Error(
        "此 Safari 不支援 OPFS"
      );
    }


    const root =
      await navigator.storage.getDirectory();


    const handle =
      await root.getFileHandle(
        OPFS_NAME,
        {
          create: false
        }
      );


    const file =
      await handle.getFile();


    log(
      "OPFS Qwen size = " +
      formatBytes(file.size),
      "ok"
    );


    if (
      file.size <
      100 * 1024 * 1024
    ) {

      throw new Error(
        "Qwen OPFS 檔案大小異常"
      );
    }


    /* ---------------------------------------------
       STEP D
    --------------------------------------------- */

    setMarker(
      "LOCAL 4 · creating stream reader"
    );


    log(
      "LOCAL 4：建立 ReadableStream reader"
    );


    const reader =
      file
        .stream()
        .getReader();


    log(
      "ReadableStreamDefaultReader ✓",
      "ok"
    );


    /* ---------------------------------------------
       STEP E
    --------------------------------------------- */

    setMarker(
      "LOCAL 5 · createFromOptions GPU"
    );


    log(
      "LOCAL 5：即將進入 createFromOptions()",
      "warn"
    );


    setStatus(
      "⚠️ Local Qwen GPU 初始化中\n\n" +
      "這是本次 Local 測試最後一個階段。\n\n" +
      "如果 Safari 整頁重新載入，" +
      "代表 crash 發生在這裡附近。"
    );


    llm =
      await LlmInference.createFromOptions(
        genai,
        {
          baseOptions: {
            modelAssetBuffer: reader,
            delegate: "GPU"
          },

          maxTokens: 64,

          topK: 1,

          temperature: 0,

          randomSeed: 1
        }
      );


    /* ---------------------------------------------
       SUCCESS
    --------------------------------------------- */

    clearMarker();


    log(
      "LOCAL Qwen initialization SUCCESS ✓",
      "ok"
    );


    setStatus(
      "🎉 Local OPFS Qwen GPU 初始化成功！\n\n" +
      "代表本地模型串流也可以正常交給 MediaPipe。"
    );


  } catch (error) {

    clearMarker();


    setStatus(
      "Local Qwen JavaScript error"
    );


    log(
      errorMessage(error),
      "error"
    );


  } finally {

    localBtn.disabled = false;

    gpuBtn.disabled = false;
    mpBtn.disabled = false;
    remoteBtn.disabled = false;

  }

};


/* =========================================================
   RESET
========================================================= */

resetBtn.onclick = () => {

  clearMarker();

  logEl.innerHTML = "";

  llm = null;
  genai = null;

  setStatus(
    "V8 診斷 Marker 已清除。\n\n" +
    "建議先按 ①，再按 ②，最後按 ③。"
  );

  log(
    "Marker cleared."
  );

};


/* =========================================================
   FORMAT BYTES
========================================================= */

function formatBytes(bytes) {

  if (
    !Number.isFinite(bytes)
  ) {

    return "unknown";
  }


  if (
    bytes >=
    1024 * 1024 * 1024
  ) {

    return (
      bytes /
      1024 /
      1024 /
      1024
    ).toFixed(2) + " GB";
  }


  return (
    bytes /
    1024 /
    1024
  ).toFixed(1) + " MB";

}


/* =========================================================
   STARTUP
========================================================= */

showPreviousMarker();


if (
  !localStorage.getItem(
    MARKER_KEY
  )
) {

  setStatus(
    "V8 已準備。\n\n" +
    "建議測試順序：\n\n" +
    "① WebGPU\n" +
    "② MediaPipe / WASM\n" +
    "③ 遠端 Qwen GPU 初始化\n" +
    "④ 本地 OPFS Qwen GPU 初始化"
  );

}


log(
  "V8 ready.",
  "info"
);

log(
  `MediaPipe version: ${MP_VERSION}`
);

log(
  "Qwen URL: " + QWEN_URL
);

</script>

</body>
</html>
