<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gemma WebGPU iPhone Test</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f7;
    color: #111;
  }

  .box {
    max-width: 720px;
    margin: auto;
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
  }

  h1 {
    font-size: 22px;
    margin-top: 0;
  }

  #status {
    white-space: pre-wrap;
    background: #f0f0f2;
    border-radius: 12px;
    padding: 12px;
    min-height: 100px;
    margin-bottom: 15px;
    font-size: 14px;
  }

  textarea {
    width: 100%;
    min-height: 100px;
    resize: vertical;
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 12px;
    font-size: 16px;
  }

  button {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 600;
  }

  button:disabled {
    opacity: .4;
  }

  #output {
    margin-top: 15px;
    padding: 15px;
    background: #f0f0f2;
    border-radius: 12px;
    white-space: pre-wrap;
    min-height: 100px;
  }
</style>
</head>

<body>

<div class="box">

  <h1>Gemma 3 1B · WebGPU Test</h1>

  <div id="status">正在檢查 WebGPU…</div>

  <textarea id="prompt"
    placeholder="輸入問題，例如：用一句話介紹台灣。"></textarea>

  <button id="loadBtn">
    載入 Gemma 3 1B
  </button>

  <button id="runBtn" disabled>
    開始生成
  </button>

  <div id="output"></div>

</div>

<script type="module">

const statusEl = document.getElementById("status");
const outputEl = document.getElementById("output");
const loadBtn = document.getElementById("loadBtn");
const runBtn = document.getElementById("runBtn");
const promptEl = document.getElementById("prompt");

let engine = null;

function log(text) {
  statusEl.textContent += "\\n" + text;
}

function setStatus(text) {
  statusEl.textContent = text;
}

async function checkGPU() {

  setStatus("檢查 WebGPU…");

  if (!navigator.gpu) {
    throw new Error(
      "這個 Safari 沒有 navigator.gpu，WebGPU 不可用。"
    );
  }

  const adapter = await navigator.gpu.requestAdapter();

  if (!adapter) {
    throw new Error(
      "navigator.gpu 存在，但 requestAdapter() 失敗。"
    );
  }

  log("✓ WebGPU adapter");

  const device = await adapter.requestDevice();

  if (!device) {
    throw new Error(
      "requestDevice() 失敗。"
    );
  }

  log("✓ WebGPU device");

  log(
    "maxBufferSize = " +
    Number(device.limits.maxBufferSize) / 1024 / 1024 +
    " MB"
  );

  log(
    "maxStorageBufferBindingSize = " +
    Number(device.limits.maxStorageBufferBindingSize) / 1024 / 1024 +
    " MB"
  );

  device.destroy();

  log("✓ WebGPU 基本測試完成");
}


async function loadGemma() {

  loadBtn.disabled = true;

  try {

    setStatus("開始初始化…");

    await checkGPU();

    log("");
    log("載入 gemma-webgpu…");

    /*
     * 使用官方 npm package 的 ESM CDN。
     *
     * 這裡刻意不使用：
     * - MediaPipe
     * - LiteRT
     * - WASM LLM runtime
     * - Transformers.js
     * - ONNX Runtime
     */

    const {
      createGemmaEngine
    } = await import(
      "https://esm.sh/gemma-webgpu"
    );

    log("✓ gemma-webgpu JS 載入完成");

    log("");
    log("開始載入 Gemma 3 1B…");
    log("第一次需要下載約 1 GB，請保持 Safari 前景。");

    engine = await createGemmaEngine({

      model: "1b",

      contextLength: 1024,

      onProgress: (p) => {

        if (!p) return;

        let text = "";

        if (p.status) {
          text += p.status;
        }

        if (
          typeof p.loaded === "number" &&
          typeof p.total === "number" &&
          p.total > 0
        ) {

          const percent =
            p.loaded / p.total * 100;

          text +=
            "\\n" +
            (percent).toFixed(1) +
            "% (" +
            (p.loaded / 1024 / 1024).toFixed(0) +
            " / " +
            (p.total / 1024 / 1024).toFixed(0) +
            " MB)";
        }

        statusEl.textContent = text;
      }
    });

    log("");
    log("✓ Gemma 3 1B 初始化成功");

    if (engine.config) {
      log("");
      log(
        "Model config:\\n" +
        JSON.stringify(engine.config, null, 2)
      );
    }

    runBtn.disabled = false;

  } catch (err) {

    console.error(err);

    statusEl.textContent +=
      "\\n\\n❌ 初始化失敗\\n" +
      (err?.stack || err?.message || String(err));

    loadBtn.disabled = false;
  }
}


async function generate() {

  if (!engine) {
    return;
  }

  const prompt = promptEl.value.trim();

  if (!prompt) {
    alert("請先輸入問題");
    return;
  }

  runBtn.disabled = true;

  outputEl.textContent = "";

  try {

    engine.addUserMessage(prompt);

    let result = "";

    const start = performance.now();

    for await (
      const token of engine.generate({
        temperature: 0.7,
        topP: 0.9,
        maxTokens: 128
      })
    ) {

      result += token;

      outputEl.textContent = result;
    }

    const seconds =
      (performance.now() - start) / 1000;

    outputEl.textContent +=
      "\\n\\n---\\n" +
      "生成時間：" +
      seconds.toFixed(2) +
      " 秒";

  } catch (err) {

    console.error(err);

    outputEl.textContent =
      "❌ 生成失敗\\n\\n" +
      (err?.stack || err?.message || String(err));

  } finally {

    runBtn.disabled = false;
  }
}


loadBtn.addEventListener(
  "click",
  loadGemma
);

runBtn.addEventListener(
  "click",
  generate
);


/*
 * 頁面一開始只做 GPU 檢查。
 * 不自動載入 1GB 模型。
 */

(async () => {

  try {

    await checkGPU();

    log("");
    log(
      "請按「載入 Gemma 3 1B」開始測試。"
    );

  } catch (err) {

    statusEl.textContent =
      "❌ WebGPU 檢查失敗\\n\\n" +
      (err?.stack || err?.message || String(err));
  }

})();

</script>

</body>
</html>
