<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe Web LLM 离线/在线运行测试</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 20px; color: #333; }
        .box { border: 1px solid #e0e0e0; padding: 20px; border-radius: 10px; margin-bottom: 20px; background: #fafafa; }
        textarea { width: 100%; height: 100px; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        button { padding: 10px 20px; border-radius: 6px; border: none; background: #007bff; color: white; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #output { white-space: pre-wrap; background: #1e1e1e; color: #00ff66; padding: 15px; border-radius: 8px; min-height: 120px; font-family: monospace; font-size: 14px; }
        .tip { background: #e7f5ff; border-left: 4px solid #1c7ed6; padding: 10px 15px; margin-bottom: 15px; border-radius: 4px; font-size: 13px; color: #1971c2; }
    </style>
</head>
<body>

    <h2>🤖 MediaPipe Web LLM (本地免 401 报错版)</h2>

    <div class="tip">
        <strong>💡 解决 401 报错建议：</strong><br>
        请在 Hugging Face 或其他渠道将模型文件（如 <code>.task</code> / <code>.bin</code> / <code>.litertlm</code>）下载到电脑，然后选择 <strong>【方式一：选择本地模型文件】</strong> 载入，即可彻底绕过网络权限限制！
    </div>

    <!-- 模型加载配置区 -->
    <div class="box">
        <h3>1. 选择模型加载方式</h3>
        
        <div style="margin-bottom: 15px;">
            <label><input type="radio" name="loadMode" value="local" checked onclick="switchMode('local')"> <strong>方式一：选择本地模型文件 (推荐)</strong></label><br>
            <label><input type="radio" name="loadMode" value="online" onclick="switchMode('online')"> 方式二：在线 URL 下载 (需配置 HF Access Token)</label>
        </div>

        <!-- 本地文件选择区 -->
        <div id="localSection">
            <label>选择已下载的模型文件 (.task / .bin / .litertlm)：</label><br><br>
            <input type="file" id="localFileInput" accept=".task,.bin,.litertlm,.tflite">
        </div>

        <!-- 在线链接区 -->
        <div id="onlineSection" style="display: none;">
            <label>模型 Direct URL：</label><br>
            <input type="text" id="modelUrl" style="width:100%; margin-top:5px; padding:6px;" placeholder="https://huggingface.co/..." value="https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/qwen2.5-0.5b-instruct-gpu-int4.task"><br><br>
            
            <label>Hugging Face Access Token (用于解决 401 权限报错)：</label><br>
            <input type="password" id="hfToken" style="width:100%; margin-top:5px; padding:6px;" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx">
        </div>

        <br>
        <button id="loadBtn" onclick="initModel()">开始加载模型</button>
        <span id="statusMsg" style="margin-left: 15px; font-weight: bold; font-size: 14px;"></span>
    </div>

    <!-- 对话控制区 -->
    <div class="box">
        <h3>2. 提示词对话</h3>
        <textarea id="promptInput" placeholder="请输入提问内容...">你好，请用简短的话介绍一下你自己。</textarea><br><br>
        <button id="sendBtn" onclick="sendQuery()" disabled>发送并生成回复</button>
    </div>

    <h3>生成结果：</h3>
    <div id="output">等待模型加载...</div>

    <script type="module">
        import { FilesetResolver, LlmInference } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@latest';

        let llmInference = null;

        // 切换加载模式面板
        window.switchMode = function(mode) {
            document.getElementById('localSection').style.display = mode === 'local' ? 'block' : 'none';
            document.getElementById('onlineSection').style.display = mode === 'online' ? 'block' : 'none';
        };

        // 初始化/装载大模型
        window.initModel = async function() {
            const statusMsg = document.getElementById('statusMsg');
            const loadBtn = document.getElementById('loadBtn');
            const sendBtn = document.getElementById('sendBtn');
            const mode = document.querySelector('input[name="loadMode"]:checked').value;

            statusMsg.style.color = '#333';
            statusMsg.textContent = "⏳ 正在初始化 WebGPU/WASM 引擎...";
            loadBtn.disabled = true;

            try {
                // 1. 初始化引擎 WASM 依赖
                const genaiFileset = await FilesetResolver.forGenAiTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@latest/wasm'
                );

                let finalModelPath = '';

                if (mode === 'local') {
                    const fileInput = document.getElementById('localFileInput');
                    if (!fileInput.files || fileInput.files.length === 0) {
                        alert("请先点击【选择文件】选择本地的大模型文件！");
                        loadBtn.disabled = false;
                        statusMsg.textContent = "";
                        return;
                    }
                    const file = fileInput.files[0];
                    statusMsg.textContent = `⏳ 读取本地模型 (${(file.size / (1024 * 1024)).toFixed(1)} MB)...`;
                    
                    // 将本地文件对象转换为浏览器内存 Blob URL
                    finalModelPath = URL.createObjectURL(file);

                } else {
                    const url = document.getElementById('modelUrl').value.trim();
                    const token = document.getElementById('hfToken').value.trim();

                    if (!url) {
                        alert("请输入模型下载链接！");
                        loadBtn.disabled = false;
                        statusMsg.textContent = "";
                        return;
                    }

                    statusMsg.textContent = "⏳ 正在通过网络下载模型文件...";

                    // 如果填写了 Token，带 Authorization 标头进行 Fetch，防止 401 报错
                    if (token) {
                        const response = await fetch(url, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (!response.ok) {
                            throw new Error(`HTTP 请求失败, 状态码: ${response.status} (${response.statusText})`);
                        }
                        const blob = await response.blob();
                        finalModelPath = URL.createObjectURL(blob);
                    } else {
                        finalModelPath = url;
                    }
                }

                statusMsg.textContent = "⚙️ 正在将模型载入 GPU/WASM 内存，请稍等...";

                // 2. 创建 LLM 实例
                llmInference = await LlmInference.createFromOptions(genaiFileset, {
                    modelAssetPath: finalModelPath,
                    maxTokens: 512,
                    temperature: 0.7,
                    topK: 40,
                });

                statusMsg.style.color = 'green';
                statusMsg.textContent = "✅ 模型加载成功！可以开始对话";
                sendBtn.disabled = false;
                document.getElementById('output').textContent = "模型已准备就绪，请输入问题并点击【发送并生成回复】。";

            } catch (err) {
                console.error("加载详细报错：", err);
                statusMsg.style.color = 'red';
                statusMsg.textContent = "❌ 模型加载失败";
                document.getElementById('output').textContent = `报错详情:\n${err.stack || err.message}\n\n建议排查：\n1. 如果是在线模式，建议切换为【选择本地模型文件】的方式。\n2. 检查浏览器控制台 (F12) Console 是否有 WebGPU 显存溢出报错。`;
            } finally {
                loadBtn.disabled = false;
            }
        };

        // 提交生成对话
        window.sendQuery = async function() {
            if (!llmInference) return;

            const prompt = document.getElementById('promptInput').value;
            const outputEl = document.getElementById('output');
            const sendBtn = document.getElementById('sendBtn');

            outputEl.textContent = "🤖 正在生成回答中...\n";
            sendBtn.disabled = true;

            try {
                // 支持流式打字机输出
                llmInference.generateResponse(prompt, (partialResult, done) => {
                    if (partialResult) {
                        outputEl.textContent = partialResult;
                    }
                    if (done) {
                        sendBtn.disabled = false;
                    }
                });
            } catch (err) {
                outputEl.textContent = "生成回答出错: " + err.message;
                sendBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
