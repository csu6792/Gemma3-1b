<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V10 · iPhone LLM GPU Diagnostic</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 20px;
    background: #0d1117;
    color: #e6edf3;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "SF Pro Text",
      "Segoe UI",
      sans-serif;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }

  h2 {
    font-size: 17px;
    margin: 22px 0 10px;
  }

  .sub {
    color: #8b949e;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 18px;
  }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }

  button {
    width: 100%;
    min-height: 48px;
    margin: 6px 0;
    border: 0;
    border-radius: 10px;
    background: #238636;
    color: white;
    font-size: 15px;
    font-weight: 600;
  }

  button.secondary {
    background: #30363d;
  }

  button.warning {
    background: #9e6a03;
  }

  button:disabled {
    opacity: 0.45;
  }

  .status {
    padding: 10px;
    border-radius: 9px;
    background: #0d1117;
    border: 1px solid #30363d;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #log {
    min-height: 260px;
    max-height: 55vh;
    overflow: auto;
    font-family:
      ui-monospace,
      SFMono-Regular,
      Menlo,
      Monaco,
      Consolas,
      monospace;
    font-size: 12px;
    line-height: 1.55;
  }

  .ok {
    color: #3fb950;
  }

  .bad {
    color: #f85149;
  }

  .warn {
    color: #d29922;
  }

  .info {
    color: #58a6ff;
  }

  .small {
    color: #8b949e;
    font-size: 11px;
    line-height: 1.5;
  }
</style>
</head>

<body>

<h1>V10 · iPhone LLM GPU Diagnostic</h1>

<div class="sub">
  這一版不測 CPU LLM。<br>
  只分離：WebGPU 本身 → Qwen 0.5B → Gemma 3 1B。
</div>

<div class="card">

  <h2>① WebGPU Device</h2>

  <button id="gpuBtn">
    測試 WebGPU Device
  </button>

  <div id="gpuStatus" class="status">
    尚未測試
  </div>

</div>


<div class="card">

  <h2>② 模型</h2>

  <button id="downloadQwenBtn" class="secondary">
    下載 Qwen 0.5B
  </button>

  <button id="downloadGemmaBtn" class="secondary">
    下載 Gemma 3 1B
  </button>

  <button id="deleteBtn" class="warning">
    清除所有本機模型
  </button>

  <div id="modelStatus" class="status">
    尚未檢查 OPFS
  </div>

</div>


<div class="card">

  <h2>③ GPU 初始化</h2>

  <button id="qwenBtn">
    Qwen 0.5B · GPU 初始化
  </button>

  <button id="gemmaBtn">
    Gemma 3 1B · GPU 初始化
  </button>

  <div id="initStatus" class="status">
    尚未開始
  </div>

</div>


<div class="card">

  <h2>④ Log</h2>

  <div id="log" class="status"></div>

  <div class="small" style="margin-top:10px;">
    如果按下 GPU 初始化後整個 Safari 分頁重新載入，
    而 Log 沒有 catch 到 JavaScript error，
    請把重新載入後顯示的「上一輪未完成」內容貼給我。
  </div>
</div>


<script type="module">

/* =========================================================
   V10
   MediaPipe Tasks GenAI 0.10.29
   Qwen 0.5B + Gemma 3 1B
   OPFS + streaming
   ========================================================= */

const MP_VERSION = "0.10.29";

const QWEN_URL =
  "https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task";

const GEMMA_URL =
  "https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/gemma3-1b-it-int4-web.task";

const QWEN_FILE = "qwen-0.5b.task";
const GEMMA_FILE = "gemma3-1b.task";

const STAGE_KEY = "v10_llm_stage";
const TIME_KEY = "v10_llm_stage_time";

const logEl = document.getElementById("log");
const gpuStatus = document.getElementById("gpuStatus");
const modelStatus = document.getElementById("modelStatus");
const initStatus = document.getElementById("initStatus");

let FilesetResolver = null;
let LlmInference = null;
let genai = null;

let currentLLM = null;


/* =========================================================
   LOG
   ========================================================= */

function now() {
  return new Date().toLocaleTimeString();
}

function log(message, type = "") {

  const line = `[${now()}] ${message}`;

  const div = document.createElement("div");

  if (type) {
    div.className = type;
  }

  div.textContent = line;

  logEl.appendChild(div);

  logEl.scrollTop = logEl.scrollHeight;

  console.log(line);
}


function setStage(stage) {

  localStorage.setItem(STAGE_KEY, stage);
  localStorage.setItem(
    TIME_KEY,
    new Date().toISOString()
  );

  log(`Stage → ${stage}`, "info");
}


function clearStage() {

  localStorage.removeItem(STAGE_KEY);
  localStorage.removeItem(TIME_KEY);

}


function checkPreviousStage() {

  const stage = localStorage.getItem(STAGE_KEY);

  if (!stage) {
    return;
  }

  const time = localStorage.getItem(TIME_KEY);

  let age = "";

  if (time) {

    const diff =
      Math.round(
        (Date.now() - new Date(time).getTime()) / 1000
      );

    age = `${diff} 秒前`;

  }

  log(
    `⚠️ 偵測到上一輪未完成：${stage}${age ? " · " + age : ""}`,
    "warn"
  );

  initStatus.textContent =
    `上一輪初始化沒有正常完成：${stage}\n` +
    `${age ? "時間：" + age : ""}\n\n` +
    `如果 Safari 是整頁重新載入，這通常不是普通 JS exception。`;

}


/* =========================================================
   DEVICE INFO
   ========================================================= */

function printDeviceInfo() {

  log(
    `iOS/Safari UA：${navigator.userAgent}`,
    "info"
  );

  log(
    `deviceMemory：${
      navigator.deviceMemory ?? "unknown"
    }`,
    "info"
  );

  log(
    `hardwareConcurrency：${
      navigator.hardwareConcurrency ?? "unknown"
    }`,
    "info"
  );

  log(
    `crossOriginIsolated：${
      self.crossOriginIsolated
    }`,
    "info"
  );

}


/* =========================================================
   LOAD MEDIAPIPE
   ========================================================= */

async function loadMediaPipe() {

  if (genai) {
    return;
  }

  setStage("LOAD_MEDIAPIPE");

  log(
    `載入 @mediapipe/tasks-genai@${MP_VERSION} ...`
  );

  try {

    const module = await import(
      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VERSION}/+esm`
    );

    FilesetResolver = module.FilesetResolver;
    LlmInference = module.LlmInference;

    log(
      "MediaPipe JS module ✓",
      "ok"
    );

    genai = await FilesetResolver.forGenAiTasks(
      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@${MP_VERSION}/wasm`
    );

    log(
      "MediaPipe WASM fileset ✓",
      "ok"
    );

    clearStage();

  } catch (err) {

    log(
      `MediaPipe 載入失敗：${err?.stack || err}`,
      "bad"
    );

    throw err;
  }

}


/* =========================================================
   OPFS
   ========================================================= */

async function getOPFS() {

  if (!navigator.storage?.getDirectory) {

    throw new Error(
      "此 Safari 不支援 OPFS getDirectory()"
    );

  }

  return await navigator.storage.getDirectory();

}


async function fileExists(name) {

  const root = await getOPFS();

  try {

    await root.getFileHandle(name);

    return true;

  } catch {

    return false;

  }

}


async function getOPFSFile(name) {

  const root = await getOPFS();

  const handle =
    await root.getFileHandle(name);

  return await handle.getFile();

}


/* =========================================================
   MODEL STATUS
   ========================================================= */

async function refreshModelStatus() {

  try {

    const qwen =
      await fileExists(QWEN_FILE);

    const gemma =
      await fileExists(GEMMA_FILE);

    modelStatus.textContent =
      `Qwen 0.5B：${qwen ? "✓ 已下載" : "未下載"}\n` +
      `Gemma 3 1B：${gemma ? "✓ 已下載" : "未下載"}`;

  } catch (err) {

    modelStatus.textContent =
      `OPFS 錯誤：${err}`;

  }

}


/* =========================================================
   STREAMING DOWNLOAD
   ========================================================= */

async function downloadModel(
  url,
  filename,
  label
) {

  const root = await getOPFS();

  log(`開始下載 ${label}`, "info");

  log(
    "下載方式：HTTP stream → OPFS，避免 chunks[] / Blob"
  );

  const response = await fetch(url, {
    cache: "no-store"
  });

  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status} ${response.statusText}`
    );

  }

  if (!response.body) {

    throw new Error(
      "response.body 不存在，無法 streaming"
    );

  }

  const total =
    Number(
      response.headers.get("content-length") || 0
    );

  if (total) {

    log(
      `Content-Length：${(
        total / 1024 / 1024
      ).toFixed(1)} MB`
    );

  }

  const handle =
    await root.getFileHandle(
      filename,
      { create: true }
    );

  const writable =
    await handle.createWritable();

  const reader =
    response.body.getReader();

  let received = 0;

  let lastReport = 0;

  try {

    while (true) {

      const { value, done } =
        await reader.read();

      if (done) {
        break;
      }

      if (value) {

        await writable.write(value);

        received += value.byteLength;

      }

      const nowMs = Date.now();

      if (
        nowMs - lastReport > 1000
      ) {

        lastReport = nowMs;

        if (total) {

          const pct =
            received / total * 100;

          log(
            `${label}：${pct.toFixed(1)}% ` +
            `(${(
              received / 1024 / 1024
            ).toFixed(1)} MB)`
          );

        } else {

          log(
            `${label}：${(
              received / 1024 / 1024
            ).toFixed(1)} MB`
          );

        }

      }

    }

    await writable.close();

  } catch (err) {

    try {
      await writable.abort();
    } catch {}

    throw err;

  }

  log(
    `${label} 下載完成：${(
      received / 1024 / 1024
    ).toFixed(1)} MB`,
    "ok"
  );

  await refreshModelStatus();

}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteFileIfExists(name) {

  const root = await getOPFS();

  try {

    await root.removeEntry(name);

    log(
      `已刪除 ${name}`,
      "ok"
    );

  } catch {

    // 不存在就忽略

  }

}


async function deleteAllModels() {

  try {

    if (currentLLM) {

      try {
        currentLLM.close();
      } catch {}

      currentLLM = null;

      log(
        "已嘗試關閉目前 LLM"
      );

    }

    await deleteFileIfExists(QWEN_FILE);
    await deleteFileIfExists(GEMMA_FILE);

    await refreshModelStatus();

    log(
      "本機模型清除完成",
      "ok"
    );

  } catch (err) {

    log(
      `清除失敗：${err?.stack || err}`,
      "bad"
    );

  }

}


/* =========================================================
   WEBGPU DEVICE TEST
   ========================================================= */

async function testWebGPU() {

  setStage("WEBGPU_DEVICE_TEST");

  gpuStatus.textContent =
    "正在測試 WebGPU Adapter / Device ...";

  try {

    if (!navigator.gpu) {

      throw new Error(
        "navigator.gpu 不存在"
      );

    }

    log(
      "navigator.gpu ✓",
      "ok"
    );

    const adapter =
      await navigator.gpu.requestAdapter({
        powerPreference: "high-performance"
      });

    if (!adapter) {

      throw new Error(
        "requestAdapter() 回傳 null"
      );

    }

    log(
      "WebGPU Adapter ✓",
      "ok"
    );

    log(
      `maxStorageBufferBindingSize：${
        adapter.limits.maxStorageBufferBindingSize
      }`
    );

    log(
      `maxBufferSize：${
        adapter.limits.maxBufferSize
      }`
    );

    /*
     * 不呼叫 requestAdapterInfo()
     *
     * Safari 某些版本可能不支援 / 不完整支援。
     */

    log(
      "開始 requestDevice() ..."
    );

    const device =
      await adapter.requestDevice();

    if (!device) {

      throw new Error(
        "requestDevice() 回傳 null"
      );

    }

    log(
      "WebGPU Device ✓",
      "ok"
    );

    /*
     * 建立一個非常小的 buffer。
     * 這不是 LLM，只是確認 device 能真的建立 GPU buffer。
     */

    const buffer =
      device.createBuffer({
        size: 4096,
        usage:
          GPUBufferUsage.STORAGE |
          GPUBufferUsage.COPY_DST
      });

    buffer.destroy();

    log(
      "GPU buffer 建立 / destroy ✓",
      "ok"
    );

    gpuStatus.textContent =
      "✓ WebGPU Adapter\n" +
      "✓ WebGPU Device\n" +
      "✓ GPU Buffer\n\n" +
      "基本 WebGPU device 測試通過。";

    clearStage();

  } catch (err) {

    gpuStatus.textContent =
      `✗ WebGPU Device 測試失敗\n\n${err}`;

    log(
      `WebGPU Device FAIL：${err?.stack || err}`,
      "bad"
    );

  }

}


/* =========================================================
   COMMON LLM INITIALIZATION
   ========================================================= */

async function initLocalModel(
  filename,
  label
) {

  if (!LlmInference || !genai) {

    await loadMediaPipe();

  }

  const exists =
    await fileExists(filename);

  if (!exists) {

    throw new Error(
      `${label} 尚未下載`
    );

  }

  const file =
    await getOPFSFile(filename);

  log(
    `${label} 檔案：${(
      file.size / 1024 / 1024
    ).toFixed(1)} MB`
  );

  log(
    `${label} 建立 ReadableStream ...`
  );

  /*
   * 這裡使用 MediaPipe 官方範例採用的方式：
   *
   * file.stream().getReader()
   *
   * 不做 arrayBuffer()
   * 不做 Blob
   * 不做 chunks[]
   *
   * 官方 JS sample 目前也是以 modelAssetBuffer
   * 接 ReadableStream reader。
   */

  const reader =
    file.stream().getReader();

  setStage(
    `${label} · createFromOptions`
  );

  log(
    `${label} 開始 LlmInference.createFromOptions() ...`,
    "warn"
  );

  const start =
    performance.now();

  try {

    const llm =
      await LlmInference.createFromOptions(
        genai,
        {
          baseOptions: {
            modelAssetBuffer: reader,
            delegate: "GPU"
          },

          /*
           * 保守設定。
           *
           * 注意：
           * maxTokens 不一定能降低模型初始化階段
           * 的 GPU / WASM 資源需求。
           */

          maxTokens: 64,

          topK: 1,

          temperature: 0,

          randomSeed: 1
        }
      );

    const seconds =
      (
        performance.now() - start
      ) / 1000;

    clearStage();

    log(
      `${label} 初始化成功 ✓ (${seconds.toFixed(1)} 秒)`,
      "ok"
    );

    return llm;

  } catch (err) {

    /*
     * 如果 Safari 是整個 WebContent process
     * 被終止，這個 catch 根本不會執行。
     */

    log(
      `${label} JavaScript exception：${err?.stack || err}`,
      "bad"
    );

    throw err;

  }

}


/* =========================================================
   QWEN
   ========================================================= */

async function testQwen() {

  initStatus.textContent =
    "Qwen 0.5B：初始化中...\n" +
    "如果 Safari 整頁重載，代表 process 在這裡被終止。";

  log(
    "=============================="
  );

  log(
    "QWEN GPU TEST START",
    "info"
  );

  try {

    await loadMediaPipe();

    if (currentLLM) {

      try {
        currentLLM.close();
      } catch {}

      currentLLM = null;

    }

    const llm =
      await initLocalModel(
        QWEN_FILE,
        "QWEN"
      );

    currentLLM = llm;

    initStatus.textContent =
      "✓ Qwen 0.5B GPU 初始化成功\n\n" +
      "這表示：\n" +
      "• OPFS ✓\n" +
      "• MediaPipe WASM ✓\n" +
      "• WebGPU Device ✓\n" +
      "• Qwen GPU model build ✓";

    log(
      "QWEN TEST PASS ✓",
      "ok"
    );

  } catch (err) {

    initStatus.textContent =
      `Qwen 初始化失敗：\n${err?.message || err}`;

    log(
      `QWEN TEST FAIL：${err?.stack || err}`,
      "bad"
    );

  }

}


/* =========================================================
   GEMMA
   ========================================================= */

async function testGemma() {

  initStatus.textContent =
    "Gemma 3 1B：初始化中...\n" +
    "這是 Qwen 的 GPU 對照測試。";

  log(
    "=============================="
  );

  log(
    "GEMMA GPU TEST START",
    "info"
  );

  try {

    await loadMediaPipe();

    if (currentLLM) {

      try {
        currentLLM.close();
      } catch {}

      currentLLM = null;

    }

    const llm =
      await initLocalModel(
        GEMMA_FILE,
        "GEMMA"
      );

    currentLLM = llm;

    initStatus.textContent =
      "✓ Gemma 3 1B GPU 初始化成功\n\n" +
      "這表示：\n" +
      "• OPFS ✓\n" +
      "• MediaPipe WASM ✓\n" +
      "• WebGPU Device ✓\n" +
      "• Gemma GPU model build ✓";

    log(
      "GEMMA TEST PASS ✓",
      "ok"
    );

  } catch (err) {

    initStatus.textContent =
      `Gemma 初始化失敗：\n${err?.message || err}`;

    log(
      `GEMMA TEST FAIL：${err?.stack || err}`,
      "bad"
    );

  }

}


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById("gpuBtn")
  .onclick = async () => {

    await testWebGPU();

  };


document
  .getElementById("downloadQwenBtn")
  .onclick = async () => {

    try {

      setStage("DOWNLOAD_QWEN");

      await downloadModel(
        QWEN_URL,
        QWEN_FILE,
        "Qwen 0.5B"
      );

      clearStage();

    } catch (err) {

      log(
        `Qwen 下載失敗：${err?.stack || err}`,
        "bad"
      );

      clearStage();

    }

  };


document
  .getElementById("downloadGemmaBtn")
  .onclick = async () => {

    try {

      setStage("DOWNLOAD_GEMMA");

      await downloadModel(
        GEMMA_URL,
        GEMMA_FILE,
        "Gemma 3 1B"
      );

      clearStage();

    } catch (err) {

      log(
        `Gemma 下載失敗：${err?.stack || err}`,
        "bad"
      );

      clearStage();

    }

  };


document
  .getElementById("deleteBtn")
  .onclick = async () => {

    await deleteAllModels();

  };


document
  .getElementById("qwenBtn")
  .onclick = async () => {

    await testQwen();

  };


document
  .getElementById("gemmaBtn")
  .onclick = async () => {

    await testGemma();

  };


/* =========================================================
   STARTUP
   ========================================================= */

checkPreviousStage();

printDeviceInfo();

refreshModelStatus();

log(
  "V10 ready",
  "ok"
);

log(
  "先按 ① WebGPU Device，再分別測 Qwen / Gemma。",
  "info"
);

</script>

</body>
</html>
