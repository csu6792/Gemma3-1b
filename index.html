<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             viewport-fit=cover"
>

<meta name="theme-color" content="#0b0f14">

<title>iPhone Local AI - Qwen + Gemma</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0f14;
    color: #f5f5f5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang TC",
        "Noto Sans TC",
        sans-serif;
}

body {
    overflow: hidden;
}

button,
select,
textarea,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: default;
}

/* =========================================================
   APP
========================================================= */

#app {
    width: 100%;
    height: 100dvh;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

/* =========================================================
   HEADER
========================================================= */

header {
    flex: 0 0 auto;

    padding:
        13px
        14px
        10px;

    background: rgba(11,15,20,.97);

    border-bottom:
        1px solid #252b34;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

h1 {
    margin: 0;
    font-size: 18px;
    line-height: 1.2;
}

.badge {
    padding: 5px 9px;

    border-radius: 999px;

    background: #18212c;
    color: #8fc4ff;

    font-size: 11px;
    white-space: nowrap;
}

/* =========================================================
   MODEL
========================================================= */

.model-row {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    gap: 8px;

    margin-top: 10px;
}

select {
    width: 100%;
    min-height: 43px;

    padding:
        0
        10px;

    border:
        1px solid #343c47;

    border-radius: 11px;

    background: #151a21;
    color: #fff;

    outline: none;
}

.primary {
    min-height: 43px;

    padding:
        0
        15px;

    border: 0;
    border-radius: 11px;

    background: #2d7ff9;
    color: white;

    font-weight: 700;
}

/* =========================================================
   TOKEN
========================================================= */

.token-row {
    display: none;

    margin-top: 8px;
}

.token-row.visible {
    display: block;
}

.token-label {
    display: block;

    margin-bottom: 5px;

    color: #858e9a;
    font-size: 11px;
}

.token-input {
    width: 100%;

    min-height: 40px;

    padding:
        8px
        10px;

    border:
        1px solid #343c47;

    border-radius: 10px;

    background: #151a21;
    color: #fff;

    outline: none;
}

.token-help {
    margin-top: 5px;

    color: #737d89;

    font-size: 10px;
    line-height: 1.4;
}

/* =========================================================
   STATUS
========================================================= */

.status {
    min-height: 20px;

    margin-top: 8px;

    color: #a2aab5;

    font-size: 12px;
    line-height: 1.45;

    white-space: pre-wrap;
}

.progress {
    display: none;

    margin-top: 7px;
}

.progress.show {
    display: block;
}

.progress-bg {
    width: 100%;
    height: 5px;

    overflow: hidden;

    border-radius: 999px;

    background: #242b34;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: #2d7ff9;

    transition:
        width .12s linear;
}

.progress-info {
    display: flex;

    justify-content: space-between;

    margin-top: 4px;

    color: #747e8a;

    font-size: 10px;
}

/* =========================================================
   WARNING
========================================================= */

.warning {
    display: none;

    margin-top: 7px;

    padding:
        8px
        9px;

    border-radius: 9px;

    background: #241f18;

    color: #d6c09b;

    font-size: 11px;
    line-height: 1.5;
}

.warning.show {
    display: block;
}

/* =========================================================
   CHAT
========================================================= */

#messages {
    flex: 1 1 auto;

    min-height: 0;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    padding:
        16px
        13px
        20px;
}

.message {
    max-width: 90%;

    margin-bottom: 12px;

    padding:
        10px
        12px;

    border-radius: 14px;

    font-size: 15px;
    line-height: 1.6;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message.user {
    margin-left: auto;

    background: #205fb8;

    border-bottom-right-radius: 5px;
}

.message.ai {
    margin-right: auto;

    background: #171c23;

    border:
        1px solid #282f39;

    border-bottom-left-radius: 5px;
}

.message.system {
    max-width: 100%;

    margin-left: auto;
    margin-right: auto;

    background: transparent;

    color: #7d8793;

    font-size: 11px;

    text-align: center;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer {
    flex: 0 0 auto;

    padding:
        9px
        11px
        10px;

    background: rgba(11,15,20,.98);

    border-top:
        1px solid #252b34;
}

.composer-row {
    display: flex;

    align-items: flex-end;

    gap: 7px;
}

textarea {
    flex: 1;

    min-width: 0;

    min-height: 44px;
    max-height: 130px;

    resize: none;

    padding:
        10px
        11px;

    border:
        1px solid #343c47;

    border-radius: 13px;

    background: #151a21;
    color: white;

    outline: none;

    line-height: 1.45;
}

textarea:focus {
    border-color: #2d7ff9;
}

.send {
    min-width: 62px;
    min-height: 44px;

    border: 0;

    border-radius: 12px;

    background: #2d7ff9;

    color: white;

    font-weight: 700;
}

/* =========================================================
   iPHONE
========================================================= */

body.ios .badge {
    background: #18251d;
    color: #9ce2ad;
}

/* =========================================================
   SMALL SCREEN
========================================================= */

@media (max-width: 380px) {

    h1 {
        font-size: 16px;
    }

    .message {
        max-width: 94%;
    }

    .primary {
        padding: 0 12px;
    }
}

</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="top">

            <h1>
                📱 Local AI
            </h1>

            <div
                id="deviceBadge"
                class="badge"
            >
                Browser
            </div>

        </div>


        <!-- MODEL -->

        <div class="model-row">

            <select id="modelSelect">

                <option value="qwen">

                </option>

        </div>


        <!-- GEMMA TOKEN -->

        <div

            >
                Hugging Face Token（Gemma 必要時使用）
            </label>

            <input
                id="tokenInput"
                class="token-input"
                type="password"
                placeholder="hf_..."

                autocorrect="off"

            >

            <div class="token-help">

                Qwen 不需要 Token。
            </div>

        </div>


        <!-- STATUS -->

        <div
            id="status"
            class="status"

        </div>


        <!-- PROGRESS -->

        >

                <div
                    id="progressBar"
                    class="progress-bar"

    ====================================================== -->

    </main>


    <!-- =====================================================
         COMPOSER
    ====================================================== -->

        <div class="composer-row">

            <textarea

                rows="1"

                autocorrect="off"
                autocapitalize="sentences"

            <button
                id="sendBtn"
                class="send"
                disabled
            >
                發送
            </button>

        </div>

    </div>

</div>


<script type="module">

/* ============================================================
   MediaPipe Tasks GenAI 0.10.29
============================================================ */

import {
    FilesetResolver,
    LlmInference
} from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29/+esm";


/* ============================================================
   MODEL CONFIG
============================================================ */

const MODELS = {

    qwen: {

        name:
            "Qwen 2.5 0.5B",

        file:
            "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

        url:
            "https://huggingface.co/litert-community/" +
            "Qwen2.5-0.5B-Instruct/resolve/main/" +
            "Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task",

        expectedMB:
            547,

        iphone:
            true,

        maxTokensIOS:
            256,

        maxTokensDesktop:
            384
    },


    gemma: {

        name:
            "Gemma 3 1B",

        file:
            "gemma3-1b-it-int4-web.task",

        url:
            "https://huggingface.co/litert-community/" +
            "Gemma3-1B-IT/resolve/main/" +
            "gemma3-1b-it-int4-web.task",

        expectedMB:
            700,

        iphone:
            false,

        maxTokensIOS:
            192,

        maxTokensDesktop:
            384
    }

};


/* ============================================================
   DOM
============================================================ */

const modelSelect =
    document.getElementById("modelSelect");

const loadBtn =
    document.getElementById("loadBtn");

const sendBtn =
    document.getElementById("sendBtn");

const input =
    document.getElementById("input");

const messages =
    document.getElementById("messages");

const statusEl =
    document.getElementById("status");

const progressEl =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const progressLeft =
    document.getElementById("progressLeft");

const progressRight =
    document.getElementById("progressRight");

const warningEl =
    document.getElementById("warning");

const tokenRow =
    document.getElementById("tokenRow");

const tokenInput =
    document.getElementById("tokenInput");

const deviceBadge =
    document.getElementById("deviceBadge");


/* ============================================================
   DEVICE
============================================================ */

const isIOS =
    /iPhone|iPad|iPod/.test(
        navigator.userAgent
    ) ||
    (
        navigator.platform === "MacIntel" &&
        navigator.maxTouchPoints > 1
    );

const isSafari =
    /Safari/i.test(
        navigator.userAgent
    ) &&
    !/Chrome|CriOS|Android/i.test(
        navigator.userAgent
    );


if (isIOS) {

    document.body.classList.add(
        "ios"
    );

    deviceBadge.textContent =
        "iPhone / iPad";

} else {

    deviceBadge.textContent =
        "WebGPU";
}


/* ============================================================
   DEFAULT MODEL
============================================================ */

if (isIOS) {

    modelSelect.value =
        "qwen";

}


/* ============================================================
   STATE
============================================================ */

let llm = null;

let currentModelKey = null;

let currentObjectURL = null;

let isLoading = false;

let isGenerating = false;

let abortController = null;


/* ============================================================
   OPFS
============================================================ */

let opfsRoot = null;


/*
 * OPFS is deliberately used instead of:
 *
 * - Cache API
 * - IndexedDB Blob
 * - chunks[]
 *
 * because we want the download to be written progressively
 * to browser-managed storage.
 */

async function getOPFSRoot() {

    if (
        !navigator.storage ||
        !navigator.storage.getDirectory
    ) {

        throw new Error(
            "此 Safari 不支援 OPFS。\n" +
            "請更新至 iOS 16.4 以上；" +
            "若要使用串流檔案下載，建議 iOS 26。"
        );
    }


    if (!opfsRoot) {

        opfsRoot =
            await navigator.storage.getDirectory();
    }


    return opfsRoot;
}


/* ============================================================
   OPFS FILE
============================================================ */

async function getModelFileHandle(
    model
) {

    const root =
        await getOPFSRoot();

    return await root.getFileHandle(
        model.file,
        {
            create: true
        }
    );
}


/* ============================================================
   DELETE MODEL
============================================================ */

async function deleteModelFile(
    model
) {

    try {

        const root =
            await getOPFSRoot();

        await root.removeEntry(
            model.file
        );

    } catch (error) {

        /*
         * Not found is harmless.
         */

        console.log(
            "delete model:",
            error
        );
    }
}


/* ============================================================
   GET SAVED FILE
============================================================ */

async function getSavedFile(
    model
) {

    try {

        const root =
            await getOPFSRoot();

        const handle =
            await root.getFileHandle(
                model.file
            );

        const file =
            await handle.getFile();

        /*
         * Avoid accepting a zero-byte partial file.
         */

        if (
            !file.size ||
            file.size < 1024 * 1024
        ) {

            return null;
        }

        return file;

    } catch (error) {

        return null;
    }
}


/* ============================================================
   FORMAT
============================================================ */

function mb(
    bytes
) {

    return (
        bytes /
        1024 /
        1024
    ).toFixed(1);
}


function formatSpeed(
    bytesPerSecond
) {

    if (
        !bytesPerSecond ||
        !Number.isFinite(bytesPerSecond)
    ) {

        return "--";
    }


    if (
        bytesPerSecond >
        1024 * 1024
    ) {

        return (
            (
                bytesPerSecond /
                1024 /
                1024
            ).toFixed(1)
            +
            " MB/s"
        );

    }


    return (
        (
            bytesPerSecond /
            1024
        ).toFixed(0)
        +
        " KB/s"
    );
}


/* ============================================================
   STATUS
============================================================ */

function setStatus(
    text
) {

    statusEl.textContent =
        text;
}


/* ============================================================
   WARNING
============================================================ */

function showWarning(
    text
) {

    warningEl.textContent =
        text;

    warningEl.classList.add(
        "show"
    );
}


function hideWarning() {

    warningEl.textContent =
        "";

    warningEl.classList.remove(
        "show"
    );
}


/* ============================================================
   PROGRESS
============================================================ */

function showProgress() {

    progressEl.classList.add(
        "show"
    );
}


function hideProgress() {

    progressEl.classList.remove(
        "show"
    );

    progressBar.style.width =
        "0%";

    progressLeft.textContent =
        "0 MB / ?";

    progressRight.textContent =
        "--";
}


function updateProgress(
    loaded,
    total,
    startedAt
) {

    const percent =
        total > 0
            ? (
                loaded /
                total *
                100
            )
            : 0;


    if (total > 0) {

        progressBar.style.width =
            Math.min(
                100,
                percent
            ) +
            "%";

        progressLeft.textContent =
            `${mb(loaded)} MB / ${mb(total)} MB`;

    } else {

        progressBar.style.width =
            "0%";

        progressLeft.textContent =
            `${mb(loaded)} MB / ?`;
    }


    const elapsed =
        (
            performance.now() -
            startedAt
        ) /
        1000;


    const speed =
        elapsed > 0
            ? loaded / elapsed
            : 0;


    progressRight.textContent =
        formatSpeed(speed);
}


/* ============================================================
   MESSAGE
============================================================ */

function addMessage(
    text,
    type
) {

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "message " +
        type;

    el.textContent =
        text;

    messages.appendChild(
        el
    );

    messages.scrollTop =
        messages.scrollHeight;

    return el;
}


/* ============================================================
   CHECK WEBGPU
============================================================ */

async function checkWebGPU() {

    if (!navigator.gpu) {

        throw new Error(
            "此瀏覽器沒有 WebGPU。\n" +
            "請使用支援 WebGPU 的新版 Safari。"
        );
    }


    const adapter =
        await navigator.gpu.requestAdapter();


    if (!adapter) {

        throw new Error(
            "Safari 找不到可用的 GPU Adapter。"
        );
    }


    return true;
}


/* ============================================================
   CHECK STORAGE
============================================================ */

async function checkStorage(
    expectedBytes
) {

    if (
        !navigator.storage ||
        !navigator.storage.estimate
    ) {

        return;
    }


    try {

        const estimate =
            await navigator.storage.estimate();

        const available =
            (
                estimate.quota || 0
            ) -
            (
                estimate.usage || 0
            );


        /*
         * Need some headroom.
         */

        const required =
            expectedBytes +
            150 * 1024 * 1024;


        if (
            available > 0 &&
            available < required
        ) {

            throw new Error(
                `瀏覽器可用儲存空間可能不足。\n` +
                `模型約 ${mb(expectedBytes)} MB，` +
                `建議至少保留 ${mb(required)} MB。`
            );
        }

    } catch (error) {

        if (
            error instanceof Error &&
            error.message.includes(
                "儲存空間"
            )
        ) {

            throw error;
        }

        /*
         * estimate itself can fail.
         * Do not block the model.
         */
    }
}


/* ============================================================
   REQUEST PERSISTENT STORAGE
============================================================ */

async function requestPersistentStorage() {

    if (
        navigator.storage &&
        navigator.storage.persist
    ) {

        try {

            await navigator.storage.persist();

        } catch (error) {

            console.log(
                "persist:",
                error
            );
        }
    }
}


/* ============================================================
   DOWNLOAD TO OPFS
============================================================ */

async function downloadToOPFS(
    model
) {

    /*
     * Get HF token only when needed.
     */

    let token =
        tokenInput.value.trim();


    const headers = {};


    if (token) {

        headers.Authorization =
            "Bearer " +
            token;
    }


    /*
     * Prepare file.
     */

    const root =
        await getOPFSRoot();


    /*
     * Remove old partial file first.
     */

    try {

        await root.removeEntry(
            model.file
        );

    } catch (error) {
        // Doesn't exist.
    }


    const handle =
        await root.getFileHandle(
            model.file,
            {
                create: true
            }
        );


    /*
     * Safari 26 / modern browsers:
     *
     * createWritable()
     *
     * writes directly into OPFS.
     */

    if (
        typeof handle.createWritable !==
        "function"
    ) {

        throw new Error(
            "目前 Safari 沒有 FileSystemWritableFileStream。\n" +
            "請使用 iOS 26 / Safari 26 以上。"
        );
    }


    let writable = null;


    try {

        /*
         * Request model.
         */

        setStatus(
            `正在連線 Hugging Face...\n${model.name}`
        );


        abortController =
            new AbortController();


        const response =
            await fetch(
                model.url,
                {
                    method: "GET",

                    mode: "cors",

                    credentials: "omit",

                    headers,

                    signal:
                        abortController.signal
                }
            );


        /*
         * Clear token from local variable.
         */

        token = "";


        /*
         * HTTP error.
         */

        if (!response.ok) {

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                throw new Error(
                    "Hugging Face 拒絕存取模型。\n" +
                    "Gemma 需要先在 Hugging Face 接受 Gemma license，" +
                    "並提供有效的 hf_ Token。"
                );
            }


            throw new Error(
                `下載失敗：HTTP ${response.status}`
            );
        }


        if (!response.body) {

            throw new Error(
                "瀏覽器沒有提供 ReadableStream，無法進行穩定串流下載。"
            );
        }


        /*
         * Content-Length
         */

        const total =
            Number(
                response.headers.get(
                    "content-length"
                )
            ) || 0;


        if (total > 0) {

            await checkStorage(
                total
            );

        } else {

            await checkStorage(
                model.expectedMB *
                1024 *
                1024
            );
        }


        /*
         * Create OPFS writable stream.
         */

        writable =
            await handle.createWritable();


        const reader =
            response.body.getReader();


        const startedAt =
            performance.now();


        let loaded = 0;


        showProgress();


        updateProgress(
            loaded,
            total,
            startedAt
        );


        setStatus(
            `正在下載 ${model.name}...`
        );


        /*
         * IMPORTANT:
         *
         * 每次只保留目前這一個 chunk。
         *
         * 不建立：
         *
         * const chunks = [];
         *
         */

        while (true) {

            const {
                value,
                done
            } =
                await reader.read();


            if (done) {
                break;
            }


            if (value) {

                await writable.write(
                    value
                );

                loaded +=
                    value.byteLength;


                updateProgress(
                    loaded,
                    total,
                    startedAt
                );
            }
        }


        /*
         * Finish file.
         */

        await writable.close();

        writable = null;


        /*
         * Verify file size.
         */

        const finalFile =
            await handle.getFile();


        if (
            finalFile.size <
            1024 * 1024
        ) {

            throw new Error(
                "下載完成但檔案大小異常。"
            );
        }


        hideProgress();


        setStatus(
            `${model.name} 下載完成。\n` +
            `${mb(finalFile.size)} MB`
        );


        /*
         * Clear token input after successful download.
         *
         * This also avoids keeping it in the DOM.
         */

        tokenInput.value = "";


        return finalFile;


    } catch (error) {

        /*
         * Abort / network failure / Safari termination.
         */

        if (writable) {

            try {

                await writable.abort();

            } catch (e) {}
        }


        /*
         * Delete incomplete file.
         */

        try {

            await root.removeEntry(
                model.file
            );

        } catch (e) {}


        throw error;

    } finally {

        abortController = null;
    }
}


/* ============================================================
   GET MODEL FILE
============================================================ */

async function getModelFile(
    model
) {

    /*
     * First check OPFS.
     */

    const existing =
        await getSavedFile(
            model
        );


    if (existing) {

        setStatus(
            `${model.name} 已存在於本機。\n` +
            `${mb(existing.size)} MB`
        );

        return existing;
    }


    /*
     * Otherwise download.
     */

    return await downloadToOPFS(
        model
    );
}


/* ============================================================
   RELEASE MODEL
============================================================ */

async function releaseModel() {

    sendBtn.disabled = true;


    if (llm) {

        try {

            if (
                typeof llm.close ===
                "function"
            ) {

                await llm.close();
            }

        } catch (error) {

            console.warn(
                "LLM close:",
                error
            );
        }

        llm = null;
    }


    currentModelKey = null;


    /*
     * Release Blob URL.
     */

    if (currentObjectURL) {

        try {

            URL.revokeObjectURL(
                currentObjectURL
            );

        } catch (error) {}

        currentObjectURL = null;
    }


    /*
     * Give Safari/WebKit a little time
     * to release WASM/GPU resources.
     */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                250
            )
    );
}


/* ============================================================
   INITIALIZE LLM
============================================================ */

async function initializeModel(
    model,
    file
) {

    setStatus(
        `${model.name} 準備啟動 WebGPU...`
    );


    /*
     * IMPORTANT:
     *
     * File comes from OPFS.
     *
     * createObjectURL(File) does not create
     * another JavaScript Uint8Array copy.
     */

    currentObjectURL =
        URL.createObjectURL(
            file
        );


    /*
     * Release local File reference
     * as soon as URL has been created.
     */

    file = null;


    setStatus(
        `${model.name} 初始化 LiteRT...`
    );


    const genai =
        await FilesetResolver.forGenAiTasks(
            "https://cdn.jsdelivr.net/npm/" +
            "@mediapipe/tasks-genai@0.10.29/wasm"
        );


    /*
     * iPhone gets shorter generation.
     */

    const maxTokens =
        isIOS
            ? model.maxTokensIOS
            : model.maxTokensDesktop;


    llm =
        await LlmInference.createFromOptions(
            genai,
            {

                baseOptions: {

                    modelAssetPath:
                        currentObjectURL,

                    delegate:
                        "GPU"
                },


                maxTokens:


                    maxTokens,


                temperature:
                    0.7,


                topK:
                    40
            }
        );


    currentModelKey =
        Object.keys(
            MODELS
        ).find(
            key =>
                MODELS[key] ===
                model
        );


    setStatus(
        `${model.name} 已啟動，可以開始聊天。`
    );


    sendBtn.disabled =
        false;
}


/* ============================================================
   LOAD SELECTED MODEL
============================================================ */

async function loadSelectedModel() {

    if (isLoading) {
        return;
    }


    if (isGenerating) {

        addMessage(
            "目前正在產生回答，請稍候。",
            "system"
        );

        return;
    }


    const key =
        modelSelect.value;


    const model =
        MODELS[key];


    if (!model) {
        return;
    }


    /*
     * iPhone Gemma warning.
     */

    if (
        isIOS &&
        key === "gemma"
    ) {

        const ok =
            confirm(
                "Gemma 3 1B 約 700 MB。\n\n" +
                "iPhone Safari 的記憶體壓力會比 Qwen 0.5B 高。\n\n" +
                "仍然要載入 Gemma 嗎？"
            );


        if (!ok) {

            modelSelect.value =
                "qwen";

            updateTokenUI();

            return;
        }
    }


    isLoading = true;

    loadBtn.disabled =
        true;

    modelSelect.disabled =
        true;

    sendBtn.disabled =
        true;

    hideWarning();


    try {

        /*
         * Secure context
         */

        if (
            !window.isSecureContext
        ) {

            throw new Error(
                "此頁面不是 Secure Context。\n\n" +
                "請使用 HTTPS 網站開啟這個 HTML。\n" +
                "不要直接用 file:// 開啟。"
            );
        }


        /*
         * WebGPU
         */

        setStatus(
            "檢查 WebGPU..."
        );

        await checkWebGPU();


        /*
         * OPFS
         */

        await getOPFSRoot();


        /*
         * Persistent storage
         */

        await requestPersistentStorage();


        /*
         * Release previous model.
         */

        if (llm) {

            setStatus(
                "正在釋放上一個模型..."
            );

            await releaseModel();
        }


        /*
         * Get model file.
         */

        const file =
            await getModelFile(
                model
            );


        /*
         * Initialize.
         */

        await initializeModel(
            model,
            file
        );


    } catch (error) {

        console.error(
            error
        );


        hideProgress();


        /*
         * If aborted, show friendly message.
         */

        if (
            error &&
            error.name ===
            "AbortError"
        ) {

            setStatus(
                "下載已取消。"
            );

        } else {

            setStatus(
                "模型載入失敗"
            );


            addMessage(
                "❌ 模型載入失敗\n\n" +
                (
                    error?.message ||
                    String(error)
                ),
                "system"
            );
        }


        await releaseModel();


    } finally {

        isLoading = false;

        loadBtn.disabled =
            false;

        modelSelect.disabled =
            false;

        abortController = null;
    }
}


/* ============================================================
   CANCEL DOWNLOAD
============================================================ */

function cancelDownload() {

    if (
        abortController
    ) {

        abortController.abort();

        setStatus(
            "正在取消下載..."
        );
    }
}


/* ============================================================
   GENERATE
============================================================ */

async function generate() {

    if (!llm) {

        addMessage(
            "請先載入 Qwen 或 Gemma。",
            "system"
        );

        return;
    }


    if (isGenerating) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    isGenerating = true;

    sendBtn.disabled =
        true;

    input.disabled =
        true;


    addMessage(
        text,
        "user"
    );


    input.value = "";

    input.style.height =
        "auto";


    const output =
        addMessage(
            "",
            "ai"
        );


    try {

        setStatus(
            `${MODELS[currentModelKey].name} 正在思考...`
        );


        const response =
            await llm.generateResponse(
                text
            );


        output.textContent =
            response ||
            "(沒有產生文字)";


        messages.scrollTop =
            messages.scrollHeight;


        setStatus(
            `${MODELS[currentModelKey].name} 就緒`
        );


    } catch (error) {

        console.error(
            error
        );


        output.textContent =
            "產生回答失敗：\n" +
            (
                error?.message ||
                String(error)
            );


        setStatus(
            "推論發生錯誤"
        );


    } finally {

        isGenerating =
            false;

        sendBtn.disabled =
            false;

        input.disabled =
            false;

        input.focus();
    }
}


/* ============================================================
   MODEL UI
============================================================ */

function updateTokenUI() {

    if (
        modelSelect.value ===
        "gemma"
    ) {

        tokenRow.classList.add(
            "visible"
        );

    } else {

        tokenRow.classList.remove(
            "visible"
        );

        tokenInput.value = "";
    }
}


modelSelect.addEventListener(
    "change",
    updateTokenUI
);


/* ============================================================
   BUTTONS
============================================================ */

loadBtn.addEventListener(
    "click",
    loadSelectedModel
);


sendBtn.addEventListener(
    "click",
    generate
);


/* ============================================================
   LONG PRESS / SECOND CLICK
   If loading, clicking Load becomes cancel.
============================================================ */

loadBtn.addEventListener(
    "click",
    () => {

        /*
         * Handled above.
         */
    }
);


/*
 * Separate double action:
 *
 * If download is running, change button to "取消".
 */

setInterval(
    () => {

        if (isLoading) {

            loadBtn.textContent =
                "取消";

            loadBtn.onclick =
                cancelDownload;

        } else {

            loadBtn.textContent =
                "載入";

            loadBtn.onclick =
                null;
        }

    },
    150
);


/* ============================================================
   TEXTAREA
============================================================ */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                130
            ) +
            "px";
    }
);


/*
 * Desktop Enter sends.
 *
 * iPhone keeps Enter as newline.
 */

input.addEventListener(
    "keydown",
    event => {

        if (
            !isIOS &&
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            generate();
        }
    }
);


/* ============================================================
   PAGE VISIBILITY
============================================================ */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            console.log(
                "Local AI page hidden"
            );
        }
    }
);


/* ============================================================
   STARTUP
============================================================ */

(async function startup() {

    updateTokenUI();


    if (
        location.protocol ===
        "file:"
    ) {

        showWarning(
            "⚠️ 請不要用 file:// 開啟。\n" +
            "請把這個 HTML 放到 HTTPS 網站或 localhost。"
        );

        setStatus(
            "需要 HTTPS / Secure Context"
        );

        return;
    }


    if (!window.isSecureContext) {

        showWarning(
            "⚠️ 此頁面不是 Secure Context。\n" +
            "OPFS / WebGPU 可能無法正常工作。"
        );
    }


    if (!navigator.gpu) {

        showWarning(
            "⚠️ 找不到 WebGPU。\n" +
            "請確認 iPhone / Safari 版本支援 WebGPU。"
        );

        setStatus(
            "WebGPU 不可用"
        );

        return;
    }


    /*
     * Test OPFS.
     */

    try {

        await getOPFSRoot();

    } catch (error) {

        showWarning(
            "⚠️ OPFS 不可用。\n" +
            "請使用新版 iOS Safari。"
        );

        setStatus(
            "OPFS 不可用"
        );

        return;
    }


    if (isIOS) {

        setStatus(
            "iPhone 模式已啟用。\n" +
            "建議先使用 Qwen 0.5B。"
        );

    } else {

        setStatus(
            "WebGPU + OPFS 已就緒。"
        );
    }

})();
</script>
