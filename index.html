<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0d12">

  <title>Gemma 3 1B IT · WebGPU</title>

  <style>
    :root {
      --bg: #0b0d12;
      --card: #151922;
      --border: #2a3140;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --accent: #7aa2ff;
      --ok: #6bcf8e;
      --warn: #e6b84d;
      --err: #f07178;
      --user: #1a3358;
      --ai: #1c2333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);

      height: 100dvh;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    /* =========================
       Header
    ========================= */

    header {
      flex-shrink: 0;

      padding:
        max(12px, env(safe-area-inset-top))
        14px
        12px
        14px;

      background: var(--card);

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .sub {
      margin-top: 3px;

      color: var(--muted);

      font-size: 0.68rem;
    }

    .badge {
      padding: 5px 9px;

      border-radius: 999px;

      background: #222833;

      color: var(--muted);

      font-size: 0.7rem;

      white-space: nowrap;
    }

    .badge.ok {
      color: var(--ok);
    }

    .badge.warn {
      color: var(--warn);
    }

    .badge.err {
      color: var(--err);
    }

    /* =========================
       Chat
    ========================= */

    #chat {
      flex: 1;

      overflow-y: auto;

      padding: 14px;

      display: flex;
      flex-direction: column;

      gap: 12px;

      -webkit-overflow-scrolling: touch;
    }

    .msg {
      display: flex;

      width: 100%;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(680px, 88vw);

      padding: 10px 12px;

      border-radius: 14px;

      font-size: 0.92rem;

      line-height: 1.55;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user);

      border-bottom-right-radius: 4px;
    }

    .msg.ai .bubble {
      background: var(--ai);

      border-bottom-left-radius: 4px;
    }

    /* =========================
       Setup panel
    ========================= */

    .panel {
      max-width: 480px;

      width: 100%;

      margin: 8px auto;

      padding: 14px;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 14px;
    }

    .panel h2 {
      margin-bottom: 8px;

      font-size: 1rem;
    }

    .panel p {
      margin-bottom: 12px;

      color: var(--muted);

      font-size: 0.78rem;

      line-height: 1.5;
    }

    .panel b {
      color: var(--text);
    }

    /* =========================
       Load button
    ========================= */

    #loadBtn {
      width: 100%;

      padding: 12px;

      border: none;

      border-radius: 10px;

      background: var(--accent);

      color: #0b0d12;

      font-size: 0.95rem;

      font-weight: 700;

      cursor: pointer;
    }

    #loadBtn:disabled {
      opacity: 0.45;

      cursor: default;
    }

    /* =========================
       Progress
    ========================= */

    .bar {
      height: 6px;

      margin-top: 10px;

      overflow: hidden;

      background: #1e2430;

      border-radius: 4px;
    }

    .bar i {
      display: block;

      width: 0%;

      height: 100%;

      background: var(--accent);

      transition: width 0.2s;
    }

    #progress {
      min-height: 2.4em;

      margin-top: 9px;

      color: var(--muted);

      font-size: 0.72rem;

      line-height: 1.45;

      white-space: pre-wrap;

      word-break: break-word;
    }

    /* =========================
       Warning
    ========================= */

    .warning {
      margin-top: 10px;

      padding: 9px 10px;

      border-radius: 10px;

      background: #242016;

      color: var(--warn);

      font-size: 0.7rem;

      line-height: 1.45;
    }

    /* =========================
       Input
    ========================= */

    .input-area {
      flex-shrink: 0;

      padding:
        8px
        10px
        max(10px, env(safe-area-inset-bottom));

      background: var(--card);

      border-top: 1px solid var(--border);
    }

    .row {
      display: flex;

      gap: 8px;

      max-width: 720px;

      margin: 0 auto;
    }

    textarea {
      flex: 1;

      min-height: 44px;

      max-height: 100px;

      resize: none;

      padding: 11px 12px;

      border: 1px solid var(--border);

      border-radius: 12px;

      outline: none;

      background: #1e2430;

      color: var(--text);

      font-family: inherit;

      font-size: 16px;

      line-height: 1.4;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea:disabled {
      opacity: 0.45;
    }

    #send {
      width: 44px;
      height: 44px;

      flex-shrink: 0;

      border: none;

      border-radius: 12px;

      background: var(--accent);

      color: #0b0d12;

      font-size: 1.1rem;

      font-weight: 700;

      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.4;

      cursor: default;
    }

    .hint {
      margin-top: 5px;

      text-align: center;

      color: var(--muted);

      font-size: 0.62rem;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 480px) {
      .bubble {
        max-width: 90vw;
      }

      #chat {
        padding: 10px;
      }

      .panel {
        margin-top: 4px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       Header
  ========================== -->

  <header>

    <div>

      <div class="title">
        Gemma 3 1B IT
      </div>

      <div class="sub">
        Q4 · WebGPU · 本地執行
      </div>

    </div>

    <div
      id="status"
      class="badge warn"
    >
      未載入
    </div>

  </header>


  <!-- =========================
       Chat
  ========================== -->

  <div id="chat">

    <div
      id="setup"
      class="panel"
    >

      <h2>
        載入 Gemma 3 1B
      </h2>

      <p>
        使用
        <b>Gemma 3 1B IT</b>
        Q4 WebGPU。
        模型會直接在瀏覽器執行。
        第一次使用需要下載模型。
      </p>

      <button
        id="loadBtn"
        type="button"
      >
        載入模型
      </button>

      <div class="bar">
        <i id="bar"></i>
      </div>

      <div id="progress">
        等待開始。
      </div>

      <div class="warning">
        iPhone 14 Pro 版本：
        此版本刻意限制輸出長度，
        不使用圖片、音訊及聊天歷史，
        先確認 Gemma 3 1B 是否能穩定執行。
      </div>

    </div>

  </div>


  <!-- =========================
       Input
  ========================== -->

  <div class="input-area">

    <div class="row">

      <textarea
        id="input"
        rows="1"
        disabled
        placeholder="輸入問題…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      ></textarea>

      <button
        id="send"
        type="button"
        disabled
      >
        ➤
      </button>

    </div>

    <div class="hint">
      Gemma 3 1B IT · Q4 · WebGPU · 瀏覽器本地執行
    </div>

  </div>


  <!-- =========================
       JavaScript
  ========================== -->

  <script type="module">

    /*
     * ============================================
     * Transformers.js
     * ============================================
     */

    import {
      pipeline
    } from
      "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1";


    /*
     * ============================================
     * Model
     * ============================================
     */

    const MODEL =
      "onnx-community/gemma-3-1b-it-ONNX";


    /*
     * ============================================
     * Mobile memory protection
     *
     * 先使用 64。
     *
     * 如果 iPhone 14 Pro 穩定，
     * 可以改成 96 或 128。
     * ============================================
     */

    const MAX_NEW_TOKENS = 64;


    /*
     * ============================================
     * DOM
     * ============================================
     */

    const chat =
      document.getElementById("chat");

    const loadBtn =
      document.getElementById("loadBtn");

    const status =
      document.getElementById("status");

    const progress =
      document.getElementById("progress");

    const bar =
      document.getElementById("bar");

    const input =
      document.getElementById("input");

    const send =
      document.getElementById("send");


    /*
     * ============================================
     * State
     * ============================================
     */

    let generator = null;

    let generating = false;


    /*
     * ============================================
     * Status
     * ============================================
     */

    function setStatus(
      text,
      cls = ""
    ) {

      status.textContent = text;

      status.className =
        "badge" +
        (
          cls
            ? " " + cls
            : ""
        );
    }


    /*
     * ============================================
     * Add message
     * ============================================
     */

    function addMessage(
      role,
      text
    ) {

      const row =
        document.createElement("div");

      row.className =
        "msg " + role;


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      row.appendChild(
        bubble
      );

      chat.appendChild(
        row
      );


      requestAnimationFrame(() => {

        chat.scrollTop =
          chat.scrollHeight;

      });


      return bubble;
    }


    /*
     * ============================================
     * WebGPU detection
     * ============================================
     */

    async function checkWebGPU() {

      if (!navigator.gpu) {

        setStatus(
          "無 WebGPU",
          "err"
        );

        progress.textContent =
          "此瀏覽器沒有 WebGPU。\n" +
          "請使用支援 WebGPU 的瀏覽器。";

        return false;
      }


      try {

        const adapter =
          await navigator.gpu
            .requestAdapter();


        if (!adapter) {

          throw new Error(
            "找不到 WebGPU Adapter"
          );
        }


        console.log(
          "WebGPU adapter:",
          adapter
        );


        return true;

      } catch (error) {

        console.error(
          "WebGPU ERROR:",
          error
        );


        setStatus(
          "WebGPU 錯誤",
          "err"
        );


        progress.textContent =
          error?.message ||
          String(error);


        return false;
      }
    }


    /*
     * ============================================
     * Load model
     * ============================================
     */

    async function loadModel() {

      if (generator) {
        return;
      }


      /*
       * Check WebGPU
       */

      const webgpuOK =
        await checkWebGPU();


      if (!webgpuOK) {
        return;
      }


      /*
       * UI
       */

      loadBtn.disabled =
        true;

      setStatus(
        "下載中",
        "warn"
      );

      progress.textContent =
        "開始下載 / 初始化 Gemma 3 1B…";

      bar.style.width =
        "0%";


      /*
       * Load
       */

      try {

        generator =
          await pipeline(

            "text-generation",

            MODEL,

            {

              /*
               * Q4
               */
              dtype: "q4",

              /*
               * WebGPU
               */
              device: "webgpu",

              /*
               * Download progress
               */
              progress_callback:
                (info) => {

                  console.log(
                    "model progress:",
                    info
                  );


                  if (
                    typeof info.progress ===
                    "number"
                  ) {

                    /*
                     * 某些版本可能回傳 0~1，
                     * 某些回傳 0~100。
                     */

                    let value =
                      info.progress;


                    if (value <= 1) {
                      value *= 100;
                    }


                    value =
                      Math.max(
                        0,
                        Math.min(
                          100,
                          value
                        )
                      );


                    bar.style.width =
                      Math.round(value) +
                      "%";


                    progress.textContent =
                      "下載 / 初始化 " +
                      Math.round(value) +
                      "%";
                  }

                  else if (
                    info.status
                  ) {

                    progress.textContent =
                      info.status;
                  }
                }
            }
          );


        /*
         * Loaded
         */

        bar.style.width =
          "100%";


        progress.textContent =
          "模型載入完成，可以開始提問。";


        setStatus(
          "已就緒",
          "ok"
        );


        input.disabled =
          false;

        send.disabled =
          false;


        loadBtn.textContent =
          "已載入";


        addMessage(
          "ai",
          "Gemma 3 1B 已載入。\n可以開始提問。"
        );


        input.focus();


      } catch (error) {

        console.error(
          "MODEL LOAD ERROR:",
          error
        );


        /*
         * 如果 JS 有機會捕捉到錯誤，
         * 顯示錯誤。
         *
         * 如果整個 WebKit process 被 OS
         * 直接殺掉，這裡不會執行。
         */

        generator =
          null;


        loadBtn.disabled =
          false;


        setStatus(
          "載入失敗",
          "err"
        );


        progress.textContent =
          "模型載入失敗：\n\n" +
          (
            error?.message ||
            String(error)
          );
      }
    }


    /*
     * ============================================
     * Extract generated text
     * ============================================
     */

    function extractText(
      output
    ) {

      if (!output) {
        return "";
      }


      const first =
        output[0];


      if (!first) {
        return "";
      }


      const generated =
        first.generated_text;


      /*
       * Chat format
       */

      if (
        Array.isArray(generated)
      ) {

        /*
         * 找最後一個 assistant message
         */

        for (
          let i = generated.length - 1;
          i >= 0;
          i--
        ) {

          const item =
            generated[i];


          if (
            item &&
            item.role ===
            "assistant"
          ) {

            if (
              typeof item.content ===
              "string"
            ) {

              return item.content;
            }
          }
        }


        /*
         * fallback
         */

        const last =
          generated[
            generated.length - 1
          ];


        if (
          typeof last?.content ===
          "string"
        ) {

          return last.content;
        }


        return "";
      }


      /*
       * String format
       */

      if (
        typeof generated ===
        "string"
      ) {

        return generated;
      }


      return "";
    }


    /*
     * ============================================
     * Ask
     * ============================================
     */

    async function ask() {

      if (
        !generator ||
        generating
      ) {

        return;
      }


      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      generating =
        true;


      input.value =
        "";


      input.disabled =
        true;

      send.disabled =
        true;


      /*
       * User message
       */

      addMessage(
        "user",
        text
      );


      /*
       * AI placeholder
       */

      const bubble =
        addMessage(
          "ai",
          "生成中…"
        );


      try {

        /*
         * 每次只傳一個問題。
         *
         * 不保存 history，
         * 降低 context / KV cache 壓力。
         */

        const messages = [

          {
            role: "user",

            content:
              "請用繁體中文簡潔回答以下問題：\n\n" +
              text
          }

        ];


        /*
         * Generate
         */

        const output =
          await generator(

            messages,

            {

              /*
               * 手機模式限制輸出
               */

              max_new_tokens:
                MAX_NEW_TOKENS,


              /*
               * 不採樣，
               * 降低一些額外計算。
               */

              do_sample:
                false

            }
          );


        console.log(
          "Generation output:",
          output
        );


        /*
         * Extract
         */

        const answer =
          extractText(
            output
          );


        if (
          answer &&
          answer.trim()
        ) {

          bubble.textContent =
            answer.trim();

        } else {

          bubble.textContent =
            "（沒有產生回答）";
        }


      } catch (error) {

        console.error(
          "GENERATION ERROR:",
          error
        );


        bubble.textContent =
          "生成失敗：\n" +
          (
            error?.message ||
            String(error)
          );

      } finally {

        generating =
          false;


        input.disabled =
          false;

        send.disabled =
          false;


        input.focus();
      }
    }


    /*
     * ============================================
     * Events
     * ============================================
     */

    loadBtn.addEventListener(
      "click",
      loadModel
    );


    send.addEventListener(
      "click",
      ask
    );


    input.addEventListener(
      "keydown",
      event => {

        /*
         * Enter = send
         *
         * Shift + Enter = newline
         */

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          ask();
        }
      }
    );


    /*
     * ============================================
     * Initial WebGPU check
     * ============================================
     */

    if (!navigator.gpu) {

      setStatus(
        "無 WebGPU",
        "err"
      );


      progress.textContent =
        "偵測不到 WebGPU。\n" +
        "目前無法使用本地模型。";


      loadBtn.disabled =
        true;

    } else {

      setStatus(
        "等待載入",
        "warn"
      );


      progress.textContent =
        "已偵測到 WebGPU。\n" +
        "可以載入模型。";
    }

  </script>

</body>
</html>
